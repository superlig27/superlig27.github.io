.lander-cta{ display:flex; gap:12px; flex-wrap:wrap; justify-content:center; margin-top:30px; }
.lander-cta .btn{ border-radius:99px; padding:14px 30px; font-size:14px; }
.lander-stats{ display:flex; gap:30px; flex-wrap:wrap; justify-content:center; margin-top:32px; }
.lander-stats div{ display:flex; flex-direction:column; gap:3px; }
.lander-stats b{
  font-family:var(--f-num); font-size:30px; letter-spacing:1px; line-height:1; color:var(--text);
}
.lander-stats span{
  font-size:9.5px; letter-spacing:1.6px; text-transform:uppercase; color:var(--faint);
}

/* Sıradaki maç rozeti — tıklayınca fikstüre gider */
.lander-next{
  display:inline-flex; align-items:center; gap:11px; margin-top:26px;
  padding:9px 9px 9px 16px; border-radius:99px; cursor:pointer;
  font:inherit; color:var(--dim); text-align:left;
  background:rgba(var(--pane),.5); border:1px solid var(--line-2);
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  transition:border-color .25s, transform .25s, background .25s;
}
.lander-next:hover{ border-color:var(--line-2); transform:translateY(-2px);
  background:rgba(var(--pane),.75); }
.lander-next .lbl{
  font-size:9px; letter-spacing:2px; text-transform:uppercase; color:var(--faint);
}
.lander-next .mt{ display:flex; align-items:center; gap:7px; }
.lander-next .mt b{ font-family:var(--f-head); font-size:13px; letter-spacing:.6px; color:var(--text); }
.lander-next .mt em{ font-style:normal; color:var(--faint); font-size:12px; }
.lander-next .cd{
  font-family:var(--f-num); font-size:15px; letter-spacing:.8px; color:var(--ink);
  background:var(--grad); padding:5px 13px; border-radius:99px; white-space:nowrap;
}

/* Şimşek katmanı — metnin altında, zemin efektlerinin üstünde */
.bolt-fx{
  position:absolute; inset:0; width:100%; height:100%;
  z-index:2; pointer-events:none; display:block;
}

@media (max-width:640px){
  .lander{ padding-top:26px; }
  .lander-title{ margin-top:16px; }
  .lander-desc{ margin-top:16px; font-size:13.5px; line-height:1.7; }
  .lander-cta{ margin-top:22px; }
  .lander-cta .btn{ padding:12px 22px; font-size:13px; }
  .lander-stats{ gap:20px; margin-top:24px; }
  .lander-stats b{ font-size:23px; }
  .lander-next{ margin-top:20px; padding-left:13px; }
  .lander-next .mt b{ font-size:12px; }
}

/* Alçak ekranlarda dikey boşlukları kıs */
@media (max-height:820px){
  .lander      { padding-top:24px; }
  .lander-desc { margin-top:16px; font-size:13.5px; line-height:1.65; }
  .lander-cta  { margin-top:20px; }
  .lander-stats{ margin-top:22px; }
  .lander-stats b{ font-size:24px; }
  .lander-next { margin-top:18px; }
  .lander-in   { padding-bottom:14px; }
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{ animation-duration:.001s !important; animation-iteration-count:1 !important;
    animation-delay:0s !important; transition-duration:.001s !important; }
  .reveal{ opacity:1; transform:none; }
}


/* ════════════════════════════════════════════════════════════
   CİLA KATMANI
   Buradaki kurallar bilerek en sonda: yukarıdaki bileşenlerin
   üstüne ortak bir hareket, odak ve yüzey dili çeker. Tek tek
   bileşene dokunmak yerine hepsini aynı gramerle konuşturur.
   ════════════════════════════════════════════════════════════ */

:root{
  /* Tek yerden hareket dili — süre ve yumuşama */
  --ease:      cubic-bezier(.2,.8,.3,1);   /* çık-yerleş: girişler için */
  --ease-out:  cubic-bezier(.33,1,.68,1);  /* yalın yavaşlama */
  --dur-1: .14s;   /* dokunma tepkisi */
  --dur-2: .24s;   /* üzerine gelme */
  --dur-3: .42s;   /* yer değiştirme */
}

/* ---------- Odak halkası ----------
   Klavyeyle gezen için TEK ve tutarlı bir işaret. :focus yerine
   :focus-visible: fareyle tıklayanda halka çıkmaz, sekme ile
   gelende çıkar. Öncesinde yalnızca birkaç alanda odak izi vardı,
   kalan her şeyde klavye kullanıcısı nerede olduğunu göremiyordu. */
:where(a, button, input, select, textarea, [tabindex]):focus-visible{
  outline:2px solid var(--iris);
  outline-offset:2px;
  border-radius:var(--r-sm);
}
/* Fare tıklamasında tarayıcının bıraktığı iz temizlensin */
:where(a, button, input, select, textarea, [tabindex]):focus:not(:focus-visible){ outline:none; }

/* ---------- Seçim ve kaydırma çubuğu ---------- */
::selection{ background:color-mix(in srgb, var(--iris) 42%, transparent); color:var(--text); }
*{ scrollbar-width:thin; scrollbar-color:var(--line-2) transparent; }
*::-webkit-scrollbar{ width:10px; height:10px; }
*::-webkit-scrollbar-track{ background:transparent; }
*::-webkit-scrollbar-thumb{
  background:var(--line-2); border-radius:99px;
  border:3px solid transparent; background-clip:content-box;
}
*::-webkit-scrollbar-thumb:hover{ background:var(--dim); background-clip:content-box; }

/* ---------- Yüzey basamakları ----------
   Eskiden her kart aynı ağırlıktaydı: buzlu cam, aynı gölge, aynı
   kenarlık. Göz nereye bakacağını seçemiyordu. Artık üç basamak var:
     .card        → sayfanın ana kartı (değişmedi)
     .card.quiet  → destek içeriği: cam yok, gölge yok, ince çizgi
     .card.raised → sayfanın tek kahramanı: daha derin gölge
   Kart yapısı aynı kaldığı için istediğin karta sınıf eklemen yeter. */
.card.quiet{
  background:rgba(255,255,255,.022);
  border-color:var(--line);
  backdrop-filter:none; -webkit-backdrop-filter:none;
  box-shadow:none;
}
.card.quiet::before{ opacity:.35; }
.card.raised{ box-shadow:var(--shadow-lg); border-color:var(--line-2); }

/* Tıklanabilir kart: üzerine gelince hafifçe kalkar ve kenarı aydınlanır.
   Yalnızca .clickable olanlarda — süs değil, "bu tıklanır" işareti. */
.card.clickable, .card[onclick]{ cursor:pointer; }
.card.clickable{ transition:transform var(--dur-2) var(--ease), border-color var(--dur-2) linear,
                            box-shadow var(--dur-2) var(--ease); }
.card.clickable:hover{ transform:translateY(-2px); border-color:var(--line-2);
                       box-shadow:var(--shadow-lg); }

/* ---------- Düğme ve pil dokunma tepkisi ---------- */
.btn{ transition:transform var(--dur-1) var(--ease), box-shadow var(--dur-2) var(--ease),
                 filter var(--dur-2) linear; }
.btn.ghost:hover{ border-color:var(--line-2); }
.pill{ transition:color var(--dur-2) linear, border-color var(--dur-2) linear,
                  background var(--dur-2) linear, transform var(--dur-1) var(--ease); }
.pill:hover{ transform:translateY(-1px); }
.pill:active{ transform:translateY(0) scale(.97); }
.pill.on:hover{ transform:translateY(-1px); filter:brightness(1.06); }

/* ---------- Puan tablosu satırı ----------
   Üzerine gelince solda ince bir vurgu şeridi açılır: satırın
   tıklanabilir olduğunu, satırı boyamadan söyler. */
.lb-row{ position:relative; transition:background var(--dur-2) linear,
                                       border-color var(--dur-2) linear; }
.lb-row.clickable::after{
  content:''; position:absolute; left:0; top:10%; bottom:10%; width:2px;
  border-radius:0 2px 2px 0; background:var(--grad); opacity:0;
  transform:scaleY(.3); transform-origin:center;
  transition:opacity var(--dur-2) linear, transform var(--dur-2) var(--ease);
}
.lb-row.clickable:hover::after, .lb-row.clickable:focus-visible::after{
  opacity:1; transform:scaleY(1);
}
.lb-row.clickable:hover{ background:rgba(255,255,255,.05); }

/* ---------- Boş durum ----------
   Önceden tek satır gri yazıydı. Sezon başında en çok görülen ekran
   burasıydı; artık bir simge, bir başlık ve yol gösteren bir alt
   satır taşıyor. Eski tek-satırlık kullanımlar da çalışmaya devam eder. */
.empty{ text-align:center; padding:44px 20px; color:var(--faint); font-size:13px; }
.empty .em{
  display:grid; place-items:center; width:52px; height:52px; margin:0 auto 14px;
  border-radius:50%; font-size:23px; opacity:1;
  background:var(--grad-soft); border:1px solid var(--line-2);
}
.empty .ttl{
  display:block; font-family:var(--f-head); font-size:15px; letter-spacing:.9px;
  text-transform:uppercase; color:var(--dim); margin-bottom:7px;
}
.empty .hint{ display:block; max-width:330px; margin:0 auto; line-height:1.7; font-size:12px; }

/* ---------- İpucu balonu ----------
   title= özniteliği bir saniye gecikir ve dokunmatikte hiç çıkmaz.
   Bu balon anında açılır; title da yedek olarak yerinde bırakılır. */
.tip{ position:relative; }
.tip::after{
  content:attr(data-tip);
  position:absolute; bottom:calc(100% + 8px); left:50%;
  transform:translateX(-50%) translateY(4px);
  z-index:120; pointer-events:none; opacity:0;
  padding:7px 11px; border-radius:var(--r-sm);
  background:color-mix(in srgb, var(--bg-2) 96%, transparent);
  border:1px solid var(--line-2); box-shadow:var(--shadow);
  font-family:var(--f-body); font-size:11px; font-weight:500; line-height:1.5;
  letter-spacing:.2px; color:var(--text); text-transform:none;
  white-space:normal; width:max-content; max-width:210px; text-align:center;
  transition:opacity var(--dur-2) linear, transform var(--dur-2) var(--ease);
}
.tip:hover::after, .tip:focus-visible::after{ opacity:1; transform:translateX(-50%) translateY(0); }
/* Kenara taşanlar için hizalama kaçamağı */
.tip.tip-l::after{ left:0; transform:translateX(0) translateY(4px); }
.tip.tip-l:hover::after{ transform:translateX(0) translateY(0); }
.tip.tip-r::after{ left:auto; right:0; transform:translateX(0) translateY(4px); }
.tip.tip-r:hover::after{ transform:translateX(0) translateY(0); }

/* ---------- Yukarı çık ----------
   Uzun listelerde (124 maç, 17 satır) başa dönmek için. Sayfa
   kaydırılınca belirir; tema düğmesinin üstüne oturur. */
.to-top{
  position:fixed; right:16px; bottom:74px; z-index:149;
  width:42px; height:42px; border-radius:50%; cursor:pointer;
  display:grid; place-items:center; font-size:15px; line-height:1;
  color:var(--dim); background:rgba(var(--pane),.86); border:1px solid var(--line-2);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  box-shadow:var(--shadow);
  opacity:0; transform:translateY(10px) scale(.9); pointer-events:none;
  transition:opacity var(--dur-2) linear, transform var(--dur-2) var(--ease),
             color var(--dur-2) linear, border-color var(--dur-2) linear;
}
.to-top.on{ opacity:1; transform:none; pointer-events:auto; }
.to-top:hover{ color:var(--text); border-color:var(--line-2); transform:translateY(-2px); }
@media (max-width:640px){ .to-top{ right:12px; bottom:66px; width:38px; height:38px; } }

/* ---------- Maç medyası (video / fotoğraf) ----------
   Kart yalnızca medya varken (ya da yönetici bakarken) basılır;
   burada "boş hâl" diye bir stil yok, çünkü boş hâl hiç çizilmiyor. */
.med-card{ overflow:hidden; }
/* Video 16:9 çerçevede */
.med-frame{
  position:relative; width:100%; background:#000;
  aspect-ratio:16 / 9;
}
.med-frame iframe, .med-frame video{
  position:absolute; inset:0; width:100%; height:100%;
  border:0; display:block;
}
/* Fotoğraf KENDİ oranını korur; uzun kareler ekranı kaplamasın diye
   yüksekliği sınırlanır, kırpılmaz (contain). */
.med-foto{ display:block; background:#000; line-height:0; }
.med-foto img{
  display:block; width:100%; max-height:440px;
  object-fit:contain; object-position:center;
}
.med-foto:hover img{ opacity:.94; }

/* Alt yazı — medyanın hemen altında, tırnak içinde bir espri gibi */
.med-yazi{
  padding:12px 16px; font-size:12.5px; line-height:1.6;
  color:var(--dim); text-align:center; font-style:italic;
  border-top:1px solid var(--line);
  background:rgba(255,255,255,.02);
}

/* Yönetici satırı: kutular esner, düğmeler sabit kalır */
.med-admin{ flex-wrap:wrap; }
.med-admin .med-in{
  flex:1 1 200px; min-width:0;
  font-family:var(--f-body); font-size:12px; color:var(--text);
  padding:8px 11px; border-radius:var(--r-sm);
  background:rgba(0,0,0,.28); border:1px solid var(--line-2); outline:none;
}
.med-admin .med-yazi-in{ flex:1 1 160px; font-style:italic; }
.med-admin .med-in:focus{ border-color:var(--iris); }
.med-admin .med-in::placeholder{ color:var(--faint); font-style:normal; }
/* Dosya seçme satırı */
.med-upload{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  margin-top:9px; padding-top:9px; border-top:1px dashed var(--line);
}
.med-file{ cursor:pointer; flex-shrink:0; padding:8px 14px; font-size:12px; }
.med-durum{ font-size:11px; color:var(--faint); flex:1; min-width:0; }
@media (max-width:520px){
  .med-admin .med-in{ flex:1 1 100%; }
  .med-admin .btn{ flex:1; }
  .med-foto img{ max-height:320px; }
  .med-file{ width:100%; text-align:center; }
  .med-durum{ flex:1 1 100%; }
}

/* ---------- Oran simgesi ---------- */
.odds-emoji{ display:inline-block; line-height:1; }
/* Emoji kendi rengini taşır; degrade zemin altında kalmasın diye
   pencere başlığındaki yuvarlak sade bırakılır. */
.brand-mark.odds-mark{
  display:grid; place-items:center;
  background:rgba(255,255,255,.08); border:1px solid var(--line-2);
}
.odds-btn .odds-emoji{ margin-right:2px; }

/* Beraberlik satırındaki kılıçlar — arma genişliğiyle aynı kutuda */
.ov-draw{
  display:inline-grid; place-items:center; width:20px; height:20px;
  font-size:14px; line-height:1; flex-shrink:0;
}

/* Yeni üye hakkı kutusu — altın vurgu, normal uyarıdan ayrılsın */
.season-cta.grace{
  border-color:color-mix(in srgb, var(--gold) 38%, transparent);
  background:color-mix(in srgb, var(--gold) 9%, transparent);
}
.season-cta.grace .dot{ background:var(--gold); }

/* ---------- Form serisi ateşi ----------
   Adın hemen yanında, ünvan pillerinden ayrı bir dilde: bu bir
   ödül değil, "şu an sıcak" demek. Alev hafifçe nefes alır. */
.streak{
  display:inline-flex; align-items:center; gap:2px; vertical-align:2px;
  margin-left:6px; padding:1px 6px 1px 4px; border-radius:99px;
  font-size:10px; line-height:1.5;
  color:var(--gold); background:color-mix(in srgb, var(--gold) 14%, transparent);
  border:1px solid color-mix(in srgb, var(--gold) 34%, transparent);
  cursor:default;
}
.streak b{ font-family:var(--f-num); font-size:11px; letter-spacing:.5px; }
.streak::before{ content:''; }
@keyframes alev{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.14); } }
.streak{ animation:alev 2.2s ease-in-out infinite; }
@media (prefers-reduced-motion:reduce){ .streak{ animation:none; } }

/* ---------- Avrupa sekmesi boş durumu ---------- */
.euro-empty .em{ font-size:26px; }
.euro-marks{
  display:flex; align-items:center; justify-content:center; gap:12px;
  margin-top:16px;
}
.euro-marks .comp-mark.ico{ margin-right:0; vertical-align:middle; opacity:.9; }

/* Kura sonucu: iki takım, sekizer rakip */
.euro-draw{
  display:grid; gap:12px; margin:18px auto 4px; max-width:520px; text-align:left;
}
@media (min-width:620px){ .euro-draw{ grid-template-columns:1fr 1fr; } }
.ed-team{
  padding:12px 13px; border-radius:var(--r-md);
  background:rgba(255,255,255,.035); border:1px solid var(--line);
}
.ed-head{ display:flex; align-items:center; gap:9px; margin-bottom:10px; }
.ed-head b{ font-family:var(--f-head); font-size:14px; letter-spacing:.6px; color:var(--text); }
.ed-list{ display:grid; grid-template-columns:1fr 1fr; gap:6px 8px; }
.ed-opp{ display:flex; align-items:center; gap:6px; min-width:0; }
.ed-opp em{
  font-style:normal; font-size:10.5px; color:var(--dim);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}

/* ---------- Küme düşme işareti ----------
   Tehlike rengi ve aşağı akan bir zemin: bahsin diğer ikisinden
   (şampiyonluk, kupa) farklı bir şey olduğunu renk söylüyor. */
.comp-mark.ico.drop{
  display:inline-grid; place-items:center; padding:0; box-shadow:none;
  color:var(--red);
  background:linear-gradient(180deg,
    color-mix(in srgb, var(--red) 26%, transparent),
    color-mix(in srgb, var(--red) 8%, transparent));
  border:1px solid color-mix(in srgb, var(--red) 42%, transparent);
  filter:none;
}
.comp-mark.ico.drop svg{ display:block; }
/* Arteta madalyonu.
   Görsel zaten kare kırpılmış olduğu için ekstra konumlandırma yok:
   kutuyu tam doldurur. Diğer bahis logoları size+6 kutuda dururken
   bu size+18'de — yüz ifadesi seçilsin diye bilerek büyük. Kırmızı
   halka ve içeriden gölge, madalyonu başlığa bağlar. */
.comp-mark.ico.drop.arteta{
  background-size:cover; background-position:center; background-repeat:no-repeat;
  border:2px solid color-mix(in srgb, var(--red) 62%, transparent);

}
.modal-x.on-shot:hover{ background:rgba(0,0,0,.6); }

/* ---------- Rozet dolabı (profil penceresi) ----------
   Kazanılanlar net, kilitliler soluk. Kilitliyi göstermek bilerek:
   toplanacak bir şey olduğunu bilmek toplamayı başlatır. */
/* Ünvan tahtası: her satır bir ünvan, sağda o an kimde olduğu.
   Oyuncunun kendi ünvanları renkli ve vurgulu; sahipsiz olanlar soluk. */

.tl-who{
  flex-shrink:0; font-size:9.5px; font-weight:700; letter-spacing:.4px;

  background:rgba(255,255,255,.05); border:1px solid var(--line);

/* Bakılan profilin taşıdığı ünvan */

/* Etiketin iki hâli:
     .you   → ünvan GİRİŞ YAPANDA; degrade ile en güçlü vurgu

.tl-who.you{

.tl-who.owner{

.tl.free{ opacity:.55; }
/* Botun giremediği dal — soluk ve çizgili, "burada yarış yok" demek */

.tl.mine.ach-kumar  .tl-b b{ color:var(--gold); }
.tl.mine.ach-kanka  .tl-b b{ color:var(--violet); }
.tl.mine.ach-avrupa .tl-b b{ color:var(--cyan); }
.tl.mine.ach-robotav .tl-b b{ color:var(--iris); }
.tl.mine.ach-uzunyol .tl-b b{ color:var(--gold); }
.tl.mine.ach-kararsiz .tl-b b{ color:var(--violet); }

.pf-note{

}

.pf-count{
  font-family:var(--f-num); font-size:12px; letter-spacing:.5px; color:var(--faint);
  margin-left:6px; padding:1px 7px; border-radius:99px;
  background:rgba(255,255,255,.06); border:1px solid var(--line);
}
.pf-sub{
  font-size:9.5px; letter-spacing:1.8px; text-transform:uppercase;
  color:var(--faint); margin:12px 0 7px;
}
.pf-none{ font-size:11.5px; color:var(--faint); padding:4px 0 8px; }
@media (max-width:420px){
  .tl{ padding:8px 9px; gap:8px; }
  .tl-who{ max-width:74px; }
}

/* ---------- Puan tablosu araç çubuğu (ara + sırala) ---------- */
.lb-tools{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  margin-bottom:14px;
}
.lb-search{
  position:relative; flex:1 1 180px; min-width:0;

<script type="module" data-cloud>
/* ============================================================
   BULUT KATMANI — Firebase
   store.js yalnızca window.Cloud üzerinden konuşur.
   Yapılandırma girilmezse site demo modunda çalışmaya devam eder.

   YAPILANDIRMAYI NEREDEN ALIRSIN:
     Firebase Console → ⚙ Project settings → Your apps
     → Web app (yoksa </> ikonuyla oluştur) → SDK setup → Config
   Oradaki firebaseConfig nesnesini aşağıdakinin üstüne yapıştır.
   ============================================================ */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
         signOut, onAuthStateChanged, updateProfile, sendPasswordResetEmail }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, getDocs, collection, serverTimestamp,
         writeBatch, onSnapshot, deleteDoc }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey:            "AIzaSyB19WvlnrJxQhlH9HjkT_DnJCgJlt40FgU",
  authDomain:        "superlig27-4bc76.firebaseapp.com",
  projectId:         "superlig27-4bc76",
  storageBucket:     "superlig27-4bc76.firebasestorage.app",
  messagingSenderId: "481187628168",
  appId:             "1:481187628168:web:648fce3a7b9f67d1720b3d",
  measurementId:     "G-H6EWXTF3WX",
};

/* Bulut verisini yeniden yükle ve açık sayfayı tazele */
const refresh = async () => {
  try { await initStore(); } catch(e){ console.warn('[Cloud] tazeleme başarısız:', e); return; }
  window.refreshAuthChip?.();
  window.render?.();
};

/* boot() bu olayı bekler; iki durumda da gönderilmeli.

   ÖNEMLİ: boot() bulut için yalnızca 3,5 sn bekler. Firebase
   modülleri gstatic'ten ağ üzerinden geldiği için ilk açılışta
   bu süre aşılabilir; o durumda uygulama demo moduna düşer.
   Aşağıdaki kontrol, geç kalındığında sessizce buluta geçirir. */
const ready = () => {
  window.__cloudReady = true;
  window.dispatchEvent(new Event('cloud-auth'));
  if (typeof Store !== 'undefined' && Store.ready && Store.mode !== 'bulut') refresh();
};

/* Yapılandırma boşsa demo modunda kal (yer tutucu bırakılırsa) */
if (!firebaseConfig.projectId || firebaseConfig.projectId.includes('PROJE-ID')){
  console.info('[Cloud] Firebase yapılandırması girilmedi — demo modunda devam ediliyor.');
  ready();
} else {
  const app  = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db   = getFirestore(app);

  let me = null, changeCb = null, firstAuth = true;

  /* window.Cloud, onAuthStateChanged'den ÖNCE atanmalı */
  window.Cloud = {
    enabled: true,
    currentUser: () => me,
    onChange(cb){ changeCb = cb; },

    /* store.js'in beklediği biçim:
       users [{uid,name}] · predictions uid→{matchId:{h,a}}
       season uid→{champion,derbyKing,euroBest} · results matchId→{h,a} */
    async loadAll(){
      const [uSnap, pSnap, sSnap, rSnap, oSnap, lSnap, vSnap] = await Promise.all([
        getDocs(collection(db, 'users')),
        getDocs(collection(db, 'predictions')),
        getDocs(collection(db, 'season')),
        getDocs(collection(db, 'results')),
        getDocs(collection(db, 'odds')),
        getDoc(doc(db, 'config', 'logos')),
        getDocs(collection(db, 'media')),
      ]);

      const users = [];
      /* createdAt da alınıyor: yeni üyeye tanınan 24 saatlik sezon
         bahsi hakkı buna dayanıyor (bkz. graceKalan). Eski kayıtlarda
         alan olmayabilir — o zaman null kalır ve hak verilmez. */
      uSnap.forEach(d => {
        const x = d.data();
        users.push({ uid: d.id, name: x.name || 'Oyuncu',
                     createdAt: x.createdAt?.toMillis?.() ?? null });
      });

      const predictions = {};
      pSnap.forEach(d => {
        const x = d.data();
        if (!x.uid || !x.matchId) return;
        (predictions[x.uid] ||= {})[x.matchId] = { h: x.h, a: x.a };
      });

      const season = {};
      sSnap.forEach(d => season[d.id] = d.data());

      const results = {};
      rSnap.forEach(d => { const x = d.data(); results[d.id] = { h: x.h, a: x.a }; });

      const odds = {};
      oSnap.forEach(d => { const x = d.data(); if (x.scores) odds[d.id] = { scores: x.scores }; });

      const logos = lSnap.exists() ? (lSnap.data().urls || {}) : {};

      /* Maça iliştirilen medya — yalnızca yönetici ekler, olmayabilir */
      const media = {};
      vSnap.forEach(d => { const x = d.data(); if (x.url) media[d.id] = { url:x.url, yazi:x.yazi || '' }; });

      return { users, predictions, season, results, odds, logos, media };
    },

    async savePrediction(uid, matchId, val){
      await setDoc(doc(db, 'predictions', `${uid}__${matchId}`),
        { uid, matchId, h: val.h, a: val.a, at: serverTimestamp() });
    },
    /* Toplu kayıt: tek turda hepsi ya yazılır ya hiçbiri (batch sınırı 500) */
    async savePredictions(uid, list){
      const b = writeBatch(db);
      list.forEach(p => b.set(doc(db, 'predictions', `${uid}__${p.id}`),
        { uid, matchId: p.id, h: p.h, a: p.a, at: serverTimestamp() }));
      await b.commit();
    },
    async saveSeasonPick(uid, kind, team){
      await setDoc(doc(db, 'season', uid), { [kind]: team, at: serverTimestamp() }, { merge: true });
    },
    async saveResult(matchId, val){
      await setDoc(doc(db, 'results', matchId), { h: val.h, a: val.a, at: serverTimestamp() });
    },
    /* Sonuçları CANLI dinler. Yönetici maç sürerken skoru güncelleyince
       herkesin tablosu kendiliğinden yenilensin diye var — yoksa
       diğer oyuncular sayfayı yenilemeden yeni golü göremezdi.
       Yalnızca 'results' dinlenir: tahminler ve oranlar maç başlayınca
       zaten donuyor, onları sürekli dinlemenin faydası yok.        */
    watchResults(cb){
      return onSnapshot(collection(db, 'results'), snap => {
        const out = {};
        snap.forEach(d => { const x = d.data(); out[d.id] = { h: x.h, a: x.a }; });
        cb(out);
      }, err => console.warn('[Cloud] sonuç dinlemesi koptu:', err));
    },
    /* Oranlar bir kez girilip DONDURULUR: herkes aynı oranla puanlanır */
    async saveOdds(matchId, scores){
      await setDoc(doc(db, 'odds', matchId), { scores, frozenAt: serverTimestamp() });
    },
    async saveLogos(urls){
      await setDoc(doc(db, 'config', 'logos'), { urls, at: serverTimestamp() });
    },
    /* Maç medyası: { url, yazi }. Boş adres = medyayı kaldır; belge
       tamamen silinir ki "medya var ama boş" diye bir ara durum
       oluşmasın. yazi = altına düşülen espri, isteğe bağlı. */
    async saveMedia(matchId, url, yazi){
      const ref = doc(db, 'media', matchId);
      if (url) await setDoc(ref, { url, yazi: yazi || '', at: serverTimestamp() });
      else     await deleteDoc(ref);
    },
    /* Medya eklenince/silinince herkeste anında görünsün */
    watchMedia(cb){
      return onSnapshot(collection(db, 'media'), snap => {
        const out = {};
        snap.forEach(d => { const x = d.data(); if (x.url) out[d.id] = { url:x.url, yazi:x.yazi || '' }; });
        cb(out);
      }, err => console.warn('[Cloud] medya dinlemesi koptu:', err));
    },

    async login(email, pass){ await signInWithEmailAndPassword(auth, email, pass); },
    async signup(email, pass, name){
      const cred = await createUserWithEmailAndPassword(auth, email, pass);
      await updateProfile(cred.user, { displayName: name });
      /* users belgesi herkese açık okunur — e-posta BURAYA YAZILMAZ */
      await setDoc(doc(db, 'users', cred.user.uid), { name, createdAt: serverTimestamp() });
    },
    async logout(){ await signOut(auth); },
    async resetPassword(email){ await sendPasswordResetEmail(auth, email); },
  };

  onAuthStateChanged(auth, async (user) => {
    if (user){
      let admin = false, name = user.displayName || '';
      try { admin = (await getDoc(doc(db, 'admins', user.uid))).exists(); } catch(e){}
      if (!name){
        try { name = (await getDoc(doc(db, 'users', user.uid))).data()?.name || user.email; }
        catch(e){ name = user.email; }
      }
      me = { uid: user.uid, name, email: user.email, admin };
    } else {
      me = null;
    }
    if (firstAuth){ firstAuth = false; ready(); }
    else if (changeCb) changeCb();
    /* boot() zaman aşımına uğradıysa onChange hiç kaydedilmemiş olur */
    else refresh();
  });
}
</script>

/* Turnuva logoları — takım armalarıyla aynı yerde saklanır
   (config/logos). Kodlar takım kodlarıyla çakışmaz.
   Adresi Armalar sayfasından yapıştırabilirsin.              */
const COMP_CODES = ['SL','UCL','UEL','UECL'];
function compLogo(code){
  const u = (typeof Store !== 'undefined' && Store.logos) ? Store.logos[code] : null;
  return u || null;
}
/* Turnuva rozetinin başındaki küçük logo (yoksa hiç çizilmez) */
function compMark(code, size = 14, cls = ''){
  const u = compLogo(code);
  return u ? `<img class="comp-mark ${cls}" src="${u}" width="${size}" height="${size}"
    alt="" loading="lazy" onerror="this.remove()">` : '';
}

/* Bahis başlığındaki yuvarlak Arteta. Sitedeki diğer yuvarlak
   işaretlerden bilerek BÜYÜK: yüz ifadesi seçilsin diye. Turnuva
   logoları size+6 kutuya oturuyor, bu size+18'e. */
function dropMark(size = 22){
  const kutu = size + 18;
  return `<span class="comp-mark ico drop arteta" role="img"
    aria-label="Küme düşme hattı"
    style="width:${kutu}px;height:${kutu}px;background-image:url('${ARTETA}')"></span>`;
}

/* Sezon bahsinin kart üstü görseli. Şimdilik yalnızca küme düşme
   bahsinde var — 22 piksellik işaret Arteta'yı hakkıyla gösteremiyor,
   asıl dram bu şeritte çıkıyor. Başka bir bahse görsel istersen
   SEASON_PICKS içine `foto:'…'` eklemen yeterli. */
function seasonFoto(cfg){
  if (!cfg?.foto) return '';
  return `<div class="card-banner season-shot"
    style="height:104px;background-image:url('${cfg.foto}')">
    <span class="bn-title">${cfg.fotoYazi || ''}</span></div>`;
}

function seasonMark(cfg, size = 22){
  if (!cfg) return '';
  if (cfg.logoKey) return compMark(cfg.logoKey, size, 'ico');
  if (cfg.mark === 'drop') return dropMark(size);
  if (!cfg.emoji) return '';
  return `<span class="comp-mark ico emoji" aria-hidden="true"
    style="width:${size + 6}px;height:${size + 6}px;font-size:${size - 2}px">${cfg.emoji}</span>`;
}

const STAGE_NAMES = {
  league:'Lig Aşaması', po:'Play-off', r16:'Son 16', qf:'Çeyrek Final',
  sf:'Yarı Final', final:'FİNAL',
};

/* ------------------------------------------------------------
   TURNUVA ÇARPANI — maçın ÖNEMİ
   Zorluğu oranlar taşıdığı için burası bilerek çok basit tutuldu:
     normal lig maçı ×1 · derbi ×2 · her Avrupa maçı ×2
   ------------------------------------------------------------ */
function multiplierOf(m){
  if (m.derby) return 2;                 // dört büyükler arası
  return m.comp === 'SL' ? 1 : 2;        // Avrupa kupaları
}
/* Kartın "öne çıkan" tasarımı alıp almayacağı */
const isFeatured = m => m.derby || m.comp !== 'SL';

/* Etiket: kartın üstünde görünen tür rozeti */
function badgeOf(m){
  if (m.derby) return { text:'DERBİ', cls:'tier-derby', mult:multiplierOf(m) };
  const c = COMPS[m.comp];
  const stage = m.comp === 'SL' ? `${m.wk}. HF`
                               : (m.md ? `${m.md}. MAÇ` : STAGE_NAMES[m.stage]);
  return {
    text: `${c.short}${stage ? ' · ' + stage.toUpperCase() : ''}`,
    cls: 'tier-' + m.comp.toLowerCase(),
    mult: multiplierOf(m),
  };
}

/* ============================================================
   TEKRARLANABİLİR RASTGELELİK
   ============================================================ */
function rng(seed){
  let t = seed >>> 0;
  return function(){
    t = (t + 0x6D2B79F5) >>> 0;
    let x = Math.imul(t ^ (t >>> 15), 1 | t);
    x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x;
    return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
  };
}
function hashStr(s){
  let h = 2166136261;
  for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function poisson(lambda, r){
  const L = Math.exp(-Math.max(.05, lambda));
  let k = 0, p = 1;
  do { k++; p *= r(); } while (p > L && k < 12);
  return Math.min(k - 1, 6);
}

/* ============================================================
   FİKSTÜR ÜRETİMİ
   NOT: Tarihler ve eşleşmeler demo amaçlıdır. Gerçek fikstür
   açıklanınca bu bölümü elle doldurmak yeterli.
   ============================================================ */
const SL_TEAMS = ['GS','FB','BJK','TS','BAS','SAM','GOZ','KON','RIZ','KAS',
                  'ALA','GAZ','EYU','KOC','GEN','ERZ','AME','COR'];

/* Berger tablosu — her takım her hafta bir maç yapar, derbiler tutarlı olur */
function roundRobin(codes){
  const t = codes.slice();
  const n = t.length;
  const order = t.map((_, i) => i);
  const rounds = [];
  for (let r = 0; r < n - 1; r++){
    const round = [];
    for (let i = 0; i < n / 2; i++){
      const a = order[i], b = order[n - 1 - i];
      round.push((i + r) % 2 === 0 ? [t[a], t[b]] : [t[b], t[a]]);
    }
    rounds.push(round);
    order.splice(1, 0, order.pop());   // ilk takım sabit, diğerleri döner
  }
  return rounds;
}

/* Tarih üretimi tamamen takvim aritmetiğiyle yapılır; cihazın saat
   dilimi ne olursa olsun aynı fikstür çıkar. */
const DAY_MS = 86400000;
const ymd = str => { const [y,m,d] = str.split('-').map(Number); return Date.UTC(y, m - 1, d); };
function isoIstanbul(utcMs, hh, mm){
  const d = new Date(utcMs);
  const p = n => String(n).padStart(2,'0');
  return `${d.getUTCFullYear()}-${p(d.getUTCMonth() + 1)}-${p(d.getUTCDate())}` +
         `T${p(hh)}:${p(mm)}:00+03:00`;
}

    const turkish = !!e.team;
    const home = turkish ? (e.away ? e.opp : e.team) : e.home;
    const away = turkish ? (e.away ? e.team : e.opp) : e.away;
    const stage = e.stage || 'league';
    /* Kural: Türk takımı olmayan maç yalnızca UCL ve yalnızca çeyrek
       finalden itibaren eklenir. Yanlış satırı sessizce yutmak yerine
       uyarıyoruz ki fikstürü girerken fark edilsin. */
    if (!turkish && !isBig(home) && !isBig(away) &&
        (e.comp !== 'UCL' || !['qf','sf','final'].includes(stage))){
      console.warn('[Fikstür] Türk takımı olmayan maç yalnızca UCL çeyrek final ve sonrası olabilir:', e);
    }
    return {
      id: `${e.comp}${stage}${e.md || ''}${home}${away}`,
      comp: e.comp, stage, md: e.md,
      home, away, dt: e.dt,
      derby: false, official: true,
    };
  });
}

function matchState(m){

  if (n < t) return 'open';
  if (n < t + TWO_HOURS) return 'live';
  return 'done';
}

function filterFixtures(list, team, comp){
  return list.filter(m => {
    if (team !== 'ALL' && !m.big.includes(team)) return false;
    if (comp === 'ALL') return true;
    if (comp === 'DERBY') return m.derby;
    if (comp === 'EU') return EURO_COMPS.includes(m.comp);
    return m.comp === comp;
  });

/* Avrupa sekmesi seçiliyken fikstürde hiç Avrupa maçı yoksa gösterilir.

   ekran kendiliğinden kaybolur, başka bir yeri değiştirmeye gerek yok. */
function euroBos(comp){
  if (comp !== 'EU' && !EURO_COMPS.includes(comp)) return '';
  if (FIXTURES.some(m => EURO_COMPS.includes(m.comp))) return '';   // maç var, boş durum gerekmez

     gelmemiş olsa da "kimlerle oynuyoruz" sorusunun cevabı hazır. */

  const kuraHtml = !kuraVar ? '' : `
    <div class="euro-draw">
      ${Object.entries(EURO_DRAW).map(([kod, rakipler]) => `
        <div class="ed-team">
          <div class="ed-head">${crest(kod, 26)}<b>${TEAMS[kod]?.name || kod}</b></div>

              ${crest(o, 20)}<em>${TEAMS[o]?.name || o}</em></span>`).join('')}</div>

    </div>`;

  return `<div class="card quiet euro-empty"><div class="empty">
      <span class="em">🏆</span>
      <span class="ttl">${kuraVar ? 'Kura çekildi, takvim bekleniyor' : 'Avrupa maçları yolda'}</span>

           UEFA maç günlerini ve saatlerini açıklayınca maçlar buraya düşecek
           ve tahmine açılacak.`

           <b>kura çekilir çekilmez</b> buraya düşecek.`}</span>
      ${kuraHtml}
      <span class="euro-marks">${EURO_COMPS.map(c => compMark(c, 26, 'ico')).join('')}</span>
      <span class="hint" style="margin-top:12px">Avrupa maçları
        <b style="color:var(--gold)">çift puan</b> getirir.</span>
    </div></div>`;
}

/* ============================================================
   YENİ ÜYE HAKKI
   Sonradan katılan biri sezon bahislerini hiç oynayamadan başlamasın
   diye: kayıt olduktan sonraki 24 saat boyunca üç sezon bahsini
   kilit geçmiş olsa bile yapabilir.

   ÖNEMLİ — bu hak tek yönlü çalışır. Hak süresi boyunca oyuncu için
   seasonLocked() "kilitli değil" der; canSeeSeason() de bu fonksiyona
   dayandığı için aynı oyuncu BAŞKALARININ seçimini göremez. Yani
   seçimini herkesin kâğıdına bakmadan yapar. Kilit zaten açılmış
   olduğundan diğer oyuncular onun seçimini görebilir; asimetri
   bilinçli, avantaj geç kalana değil erken oynayana kalsın diye.
   ============================================================ */
const YENI_UYE_SURESI = 24 * 3600 * 1000;          // 24 saat

/* Giriş yapan oyuncunun hakkından kalan süre (ms). 0 = hak yok/bitti. */
function graceKalan(){
  const uid = Store.me && !Store.me.anon ? Store.me.uid : null;
  if (!uid) return 0;
  const u = Store.users.find(x => x.uid === uid);
  if (!u?.createdAt) return 0;                     // kayıt zamanı bilinmiyorsa hak yok
  return Math.max(0, u.createdAt + YENI_UYE_SURESI - NOW().getTime());
}
const yeniUye = () => graceKalan() > 0;

/* Kilit açıldı mı? Açılana kadar oyuncular başkasının seçimini göremez.
   Yeni üye hakkı süresince bu oyuncu için kilit YOK sayılır. */
function seasonLocked(kind){
  const cfg = SEASON_PICKS[kind];
  if (!cfg) return false;
  if (NOW() < new Date(cfg.lock)) return false;    // kilit zaten açılmamış
  return !yeniUye();                               // yeni üyeye kilit işlemez
}

/* Başkalarının seçimi görülebilir mi?
   Kilit açıldıysa herkese açık. Açılmadıysa yalnızca yönetici görebilir —
   o da KENDİ seçimini yaptıysa; yönetici de ödül için yarışıyor.
   Koşulu kaldırmak istersen aşağıdaki "&& kendiSecti" yeter. */
function canSeeSeason(kind){
  if (seasonLocked(kind)) return true;
  if (!isAdmin()) return false;
  const cfg = SEASON_PICKS[kind], v = mySeason()[kind];
  const kendiSecti = cfg.kind === 'multi'
    ? Array.isArray(v) && v.length === cfg.max
    : !!v;
  return kendiSecti;
}

/* Sonuçlar sezon sonunda buraya yazılır.
   relegated bir DİZİ olmalı, örn: ['KON','SAM','COR'] */
const SEASON_RESULT = { champion:null, uclWinner:null, relegated:null };

/* Bir şıkkın puanı. Bahiste oran tanımlıysa favoriden uzaklaştıkça
   artar; maç puanlamasıyla aynı sıkıştırma (ODDS_EXP) kullanılır ki
   sistem tek bir mantıkla çalışsın. Oran yoksa herkes eşit puan alır. */
function seasonPickPoints(kind, value){
  const cfg = SEASON_PICKS[kind];
  if (!cfg) return 0;
  if (!cfg.odds || value == null || !cfg.odds[value]) return cfg.points;

  let tot = 0;
  Object.values(cfg.odds).forEach(o => tot += 1 / o);
  const p    = (1 / cfg.odds[value]) / tot;              // marj atılmış olasılık
  const favP = Math.max(...Object.values(cfg.odds).map(o => (1 / o) / tot));
  const mult = clampMult(Math.pow(favP / p, ODDS_EXP), 1, 2.5);
  return Math.round(cfg.points * mult / 5) * 5;          // 5'in katına yuvarla
}

/* Bir sezon bahsinin getirdiği puan (çoklu seçimde her isabet ayrı sayılır) */
function seasonPoints(kind, pick, result){
  const cfg = SEASON_PICKS[kind];
  if (!cfg || pick == null || result == null) return 0;
  if (cfg.kind === 'multi'){
    if (!Array.isArray(pick) || !Array.isArray(result)) return 0;
    return pick.filter(x => result.includes(x)).length * cfg.points;
  }
  return pick === result ? seasonPickPoints(kind, pick) : 0;
}

/* Kartın başlığında gösterilecek puan aralığı */
function seasonPointsLabel(kind){
  const cfg = SEASON_PICKS[kind];
  if (!cfg) return '';
  if (cfg.kind === 'multi') return `her isabet +${cfg.points}p`;
  if (!cfg.odds) return `+${cfg.points}p`;
  const all = cfg.options.map(o => seasonPickPoints(kind, o));
  const lo = Math.min(...all), hi = Math.max(...all);
  return lo === hi ? `+${lo}p` : `${lo}–${hi}p`;
}

/* ============================================================
   ORAN MOTORU
   Zorluğu bahis oranları belirler; "sürpriz" tanımı bize kalmaz.
   Referans HER MAÇ İÇİN AYRI: o maçın en kısa oranı (bahisçinin
   favori skoru) = ×1.00 kabul edilir. Böylece 0:1 tahmini dengeli
   bir maçta ×1.19, tek taraflı bir maçta ×3.00 edebilir.
   ============================================================ */
const ODDS_EXP = 0.45;   // 0 = oran etkisiz · 1 = tüm seçimler eşit değerde
const ODDS_CAP = 3.00;   // tek bir uzun atış sezonu belirlemesin
const OUT_CAP  = 2.00;   // sonuç (1/X/2) çarpanı tavanı

const clampMult = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

/* Ham oran tablosundan türetilenler; sonuç nesnede önbelleklenir */
function oddsInfo(id){
  const raw = Store.odds[id];
  if (!raw || !raw.scores) return null;
  if (raw.__i) return raw.__i;

  const scores = raw.scores;
  let min = Infinity;
  const p = { H:0, D:0, A:0 };

  Object.keys(scores).forEach(k => {
    const o = scores[k];
    if (!(o > 1)) return;
    if (o < min) min = o;
    const [h, a] = k.split(':').map(Number);
    p[h > a ? 'H' : h < a ? 'A' : 'D'] += 1 / o;     // örtük olasılık
  });

  /* Bahisçi marjını at: üç sonucun toplamı 1 olsun */
  const tot = p.H + p.D + p.A;
  if (tot > 0){ p.H /= tot; p.D /= tot; p.A /= tot; }

  return raw.__i = { scores, min: min === Infinity ? null : min,
                     p, favP: Math.max(p.H, p.D, p.A) };
}

const hasOdds = m => !!oddsInfo(m.id);

/* ---- Tahmin penceresi -------------------------------------------
   Oranı girilmiş maç her zaman tahmine açıktır. Oranı GİRİLMEMİŞ maç
   da başlamasına iki haftadan az kalınca açılır: tahmin kaydedilir,
   ama "ne kazanırsın" gösterilemez — çarpanı belirleyen oran tablosu
   ortada yok. Oranlar sonradan girilirse puan kendiliğinden ona göre
   hesaplanır; hiç girilmezse çarpan ×1'de kalır (bkz. scoreMult).
   Böylece isteyen herkes erkenden tahminini yazabilir, ama iki
   haftadan uzak 120 kart da listeyi boğmaz.                        */
const ERKEN_PENCERE = 14 * 24 * 3600 * 1000;
const erkenAcik  = m => new Date(m.dt) - NOW() <= ERKEN_PENCERE;
const canPredict = m => matchState(m) === 'open' && (hasOdds(m) || erkenAcik(m));

/* Bir SKORUN çarpanı — tam isabet ve 1 gol sapma için.
   DİKKAT: her zaman GERÇEKLEŞEN skorla çağrılır, tahmin edilenle değil.
   Nedeni: tahmin edilen skorla çağrılırsa uçuk skor yazmak bedava
   çarpan kazandırır (8-2 yaz, ıskala, yine de büyük çarpanlı
   "1 gol sapma" biletin olsun). Çarpan artık yazdığına değil,
   maçın nasıl bittiğine bağlı — kimse şişirerek çarpan avlayamaz. */
function scoreMult(m, h, a){
  const i = oddsInfo(m.id);
  if (!i || !i.min) return 1;
  const o = i.scores[`${h}:${a}`];
  if (o == null) return ODDS_CAP;          // listede yoksa en riskli sayılır
  return clampMult(Math.pow(o / i.min, ODDS_EXP), 1, ODDS_CAP);
}

/* Seçilen SONUCUN çarpanı — skoru tutturamayıp sonucu bilenler için */
function outcomeMult(m, res){
  const i = oddsInfo(m.id);
  if (!i) return 1;
  const p = i.p[res];
  if (!p) return OUT_CAP;
  return clampMult(Math.pow(i.favP / p, ODDS_EXP), 1, OUT_CAP);
}

/* ============================================================
   PUANLAMA
   10 tam isabet · 8 kazanan + 1 gol · 6 doğru sonuç · 2 kıl payı
   İlk iki basamak SKOR oranıyla, üçüncüsü SONUÇ oranıyla çarpılır.
   Dördüncüsü düz kalır: yoksa her hafta uçuk skor yazmak kârlı olurdu.
   ============================================================ */
function scorePrediction(p, r, m){
  const pH = parseInt(p?.h), pA = parseInt(p?.a);
  const rH = parseInt(r?.h), rA = parseInt(r?.a);
  const none = { pts:0, tier:0, mult:0 };
  if ([pH,pA,rH,rA].some(v => isNaN(v))) return none;

  const comp = m?.mult || 1;
  const pr = pH > pA ? 'H' : pH < pA ? 'A' : 'D';
  const rr = rH > rA ? 'H' : rH < rA ? 'A' : 'D';
  const diff = Math.abs(pH - rH) + Math.abs(pA - rA);

  /* Çarpanlar HEP gerçekleşen sonuçtan gelir:
       10 / 8 → o SKORUN ne kadar beklenmedik olduğu
       6      → o SONUCUN (1/X/2) ne kadar beklenmedik olduğu
       2      → düz
     Böylece yazdığın skoru şişirerek çarpan büyütemezsin. */
  let tier, mult;
  if (pH === rH && pA === rA)   { tier = 10; mult = scoreMult(m, rH, rA); }
  else if (pr === rr && diff===1){ tier = 8;  mult = scoreMult(m, rH, rA); }
  else if (pr === rr)            { tier = 6;  mult = outcomeMult(m, rr); }
  else if (diff === 1)           { tier = 2;  mult = 1; }
  else return none;

  return { pts: Math.round(tier * mult * comp), tier,
           mult: Math.round(mult * comp * 100) / 100 };
}

/* Eski çağrılar için ince sarmalayıcı */
function calcPoints(pH, pA, rH, rA, m){
  return scorePrediction({ h:pH, a:pA }, { h:rH, a:rA }, m).pts;
}

function ptsClass(tier){
  if (!tier) return 'pt-0';
  if (tier >= 10) return 'pt-10';
  if (tier >= 8)  return 'pt-8';
  if (tier >= 6)  return 'pt-6';
  return 'pt-2';
}

/* ============================================================
   BİÇİMLENDİRME (saatler her cihazda TSİ)
   ============================================================ */
const TR_MONTHS = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const TR_DAYS   = ['Paz','Pzt','Sal','Çar','Per','Cum','Cmt'];
const TR_DAYS_L = ['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
const TZ = 'Europe/Istanbul';

function istParts(iso){
  const d = new Date(iso);
  try{
    const p = {};
    new Intl.DateTimeFormat('en-GB', { timeZone:TZ, year:'numeric', month:'numeric',
      day:'numeric', hour:'2-digit', minute:'2-digit', hour12:false })
      .formatToParts(d).forEach(x => p[x.type] = x.value);
    const shifted = new Date(`${p.year}-${String(p.month).padStart(2,'0')}-${String(p.day).padStart(2,'0')}T00:00:00Z`);
    return { day:+p.day, month:+p.month - 1, year:+p.year,
             hour:p.hour === '24' ? '00' : p.hour, minute:p.minute,
             dow:shifted.getUTCDay(), key:`${p.year}-${p.month}-${p.day}` };
  }catch(e){
    return { day:d.getDate(), month:d.getMonth(), year:d.getFullYear(),
             hour:String(d.getHours()).padStart(2,'0'),
             minute:String(d.getMinutes()).padStart(2,'0'),
             dow:d.getDay(), key:d.toDateString() };
  }
}
const fmtTime      = iso => { const p = istParts(iso); return `${p.hour}:${p.minute}`; };
const fmtDate      = iso => { const p = istParts(iso); return `${p.day} ${TR_MONTHS[p.month]} ${TR_DAYS[p.dow]} · ${p.hour}:${p.minute}`; };
const fmtDateShort = iso => { const p = istParts(iso); return `${p.day} ${TR_MONTHS[p.month].slice(0,3)} ${p.year}`; };
const dayKey       = iso => istParts(iso).key;
function fmtDayHeader(iso){
  const p = istParts(iso), t = istParts(NOW().toISOString());
  if (p.key === t.key) return 'BUGÜN';
  return `${p.day} ${TR_MONTHS[p.month]} ${TR_DAYS_L[p.dow]}`;
}

function timeParts(ms){
  if (ms < 0) ms = 0;
  const s = Math.floor(ms / 1000);
  return { d:Math.floor(s/86400), h:Math.floor((s%86400)/3600), m:Math.floor((s%3600)/60), s:s%60 };
}
function timeLeftShort(ms){
  const t = timeParts(ms);
  if (t.d > 0) return `${t.d} gün ${t.h} sa`;
  if (t.h > 0) return `${t.h} sa ${t.m} dk`;
  return `${t.m} dk`;
}

const SHIELD = 'M32 2 L60 11 V34 C60 49 47 59.5 32 65 C17 59.5 4 49 4 34 V11 Z';

/* Bir takımın arma adresi: önce yöneticinin girdiği (buluttan gelen),
   yoksa dosyadaki varsayılan. Hiçbiri yoksa çizilmiş arma kullanılır. */
function logoOf(code){

  return LOGOS[code] || null;
}

/* Arma varsa gerçek görsel, yoksa çizilmiş arma.
   Görsel yüklenemezse onerror ile çizilmiş armaya döner. */
function crest(code, size = 44){
  const url = logoOf(code);
  if (!url) return crestShield(code, size);
  const t = TEAMS[code];
  return `<img class="crest crest-img" src="${url}"
    width="${size}" height="${Math.round(size * 67/64)}" alt="${t ? t.name : code}"
    decoding="async" onerror="this.outerHTML=crestShield('${code}',${size})">`;
}

function crestShield(code, size = 44){
  const t = TEAMS[code];
  if (!t) return `<span style="width:${size}px;display:inline-block"></span>`;
  const uid = `c${code}${Math.random().toString(36).slice(2,7)}`;
  let bands;

  if (t.stripe === 'h'){
    bands = `<rect y="0"  width="64" height="17" fill="${t.c1}"/><rect y="17" width="64" height="16" fill="${t.c2}"/>
             <rect y="33" width="64" height="16" fill="${t.c1}"/><rect y="49" width="64" height="18" fill="${t.c2}"/>`;
  } else if (t.stripe === 'v'){
    bands = `<rect x="0" width="16" height="67" fill="${t.c2}"/><rect x="16" width="16" height="67" fill="${t.c1}"/>
             <rect x="32" width="16" height="67" fill="${t.c2}"/><rect x="48" width="16" height="67" fill="${t.c1}"/>`;
  } else if (t.stripe === 'v3'){
    bands = `<rect width="64" height="67" fill="${t.c2}"/><rect x="9" width="9" height="67" fill="${t.c1}"/>
             <rect x="27" width="9" height="67" fill="${t.c1}"/><rect x="45" width="9" height="67" fill="${t.c1}"/>`;
  } else if (t.stripe === 'd'){
    bands = `<rect x="-40" y="-40" width="150" height="150" fill="${t.c1}"/>
             <g transform="rotate(-30 32 33)"><rect x="-22" y="-40" width="18" height="150" fill="${t.c2}"/>
             <rect x="14" y="-40" width="18" height="150" fill="${t.c2}"/>
             <rect x="50" y="-40" width="18" height="150" fill="${t.c2}"/></g>`;
  } else {
    // diğer takımlar: çapraz iki renk + baş harfler
    const mono = (t.name.match(/\b[A-ZÇĞİÖŞÜ]/g) || [t.name[0]]).slice(0,2).join('');
    const dark = isDark(t.c1);
    bands = `<rect width="64" height="67" fill="${t.c1}"/>
             <path d="M0 67 L64 0 V67 Z" fill="${t.c2}"/>
             <text x="32" y="42" text-anchor="middle" font-family="Anton, Impact, sans-serif"
                   font-size="24" fill="${dark ? '#fff' : '#10101a'}"
                   stroke="rgba(0,0,0,.28)" stroke-width=".6">${mono}</text>`;
  }

  return `<svg class="crest" width="${size}" height="${size * 67/64}" viewBox="0 0 64 67" role="img" aria-label="${t.name}">
    <defs><clipPath id="${uid}"><path d="${SHIELD}"/></clipPath>
      <linearGradient id="${uid}g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff" stop-opacity=".26"/>
        <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
        <stop offset="1" stop-color="#000" stop-opacity=".34"/></linearGradient></defs>
    <g clip-path="url(#${uid})">${bands}<rect width="64" height="67" fill="url(#${uid}g)"/></g>
    <path d="${SHIELD}" fill="none" stroke="rgba(255,255,255,.42)" stroke-width="2"/>
  </svg>`;
}
function isDark(hex){
  const c = hex.replace('#','');
  const r = parseInt(c.slice(0,2),16), g = parseInt(c.slice(2,4),16), b = parseInt(c.slice(4,6),16);
  return (0.299*r + 0.587*g + 0.114*b) < 140;
}

/* ============================================================

   Puan tablosunda gerçek oyuncularla yarışan iki bot. Tahminleri

   Maç başladığı anda tahmin DONAR: tohum, başlama anındaki pencereye

const AI_PLAYERS = [

         'Maç başlayana kadar sık sık fikir değiştirir, başlayınca tahmini kilitlenir.' },
];
const DELI_MIN_ODDS  = 15;
const DELI_REROLL_MS = 5 * 60000;   // kaç dakikada bir fikir değiştirsin

/* Deli'nin o an geçerli tohum penceresi.
   Maç başlamadan önce saatle birlikte ilerler → tahmin değişir.
   Başladıktan sonra sabitlenir.

   Sınır "kick" değil "kick - 1": başlama anı yeni bir pencere açıyorsa
   tahmin tam düdükle birlikte bir kez daha değişirdi. Bir milisaniye
   geri çekmek, ekranda EN SON görünen tahmini kilitler — oyuncular ne
   gördüyse maça o girer. */
function deliBucket(m){
  const kick = new Date(m.dt).getTime();
  return Math.floor(Math.min(NOW().getTime(), kick - 1) / DELI_REROLL_MS);
}

function aiPrediction(uid, m){
  const i = oddsInfo(m.id);
  if (!i) return null;                       // oran yoksa tahmin de yok

  /* ÖNEMLİ: anahtarlar HER ZAMAN sıralanır.
     Object.keys() sırası kaynağa göre değişebilir (Firestore map
     sırası garanti değildir). Sıralamazsak Deli'nin seçtiği skor
     aynı pencerede bile kayar ve puanı oynardı. */
  const keys = Object.keys(i.scores).sort();
  if (!keys.length) return null;

  let key;
  if (uid === 'ai_robot'){
    /* En kısa oran; eşitlikte sıralı listede önce gelen kazanır */
    key = keys.reduce((b, x) => i.scores[x] < i.scores[b] ? x : b);
  } else {
    const wild = keys.filter(k => i.scores[k] >= DELI_MIN_ODDS);
    const pool = wild.length ? wild : keys;                            // 15+ yoksa hepsi
    /* Havuzdaki her skorun şansı eşit: en yüksek oranı kayırmaz,
       15.00'lik skor da 96.00'lık skor kadar çıkabilir. */
    key = pool[Math.floor(rng(hashStr('deli' + m.id + '#' + deliBucket(m)))() * pool.length)];
  }
  const [h, a] = key.split(':').map(Number);
  return { h, a };
}

/* ------------------------------------------------------------
   DELİ'NİN SEZON BAHİSLERİ

   Deli eskiden listedeki EN UZUN oranı alıyordu. İki sorun çıktı:

   1) Şampiyonlar Ligi'nde oran tablosuna Dinamo Zagreb (326.00)
      girince seçim "sürpriz" olmaktan çıkıp imkânsıza döndü. Artık
      DELI_BAND aralığından seçiyor: tutması şaşırtır ama saçma
      değildir — Napoli, Dortmund, Roma, Leipzig gibi isimler.
      Bant boş kalırsa (dar listelerde olabilir) en uzun atışa döner.

   2) Süper Lig'de oranlar güncellenince en uzun atış Trabzonspor'dan
      Beşiktaş'a geçmişti. Oysa Deli'nin karakteri kalabalığın
      gitmediği yere gitmek; Trabzonspor'u kimse seçmiyor. Bu yüzden
      şampiyonluk seçimi DELI_SEZON ile elle sabitlendi.

   Değiştirmek istersen tek yer aşağıdaki iki sabit.
   ------------------------------------------------------------ */
const DELI_SEZON = { champion:'TS', uclWinner:'Napoli' };   // elle sabitlenen seçimler
const DELI_BAND  = [25, 70];            // "karanlık at" oran aralığı

function aiSeason(uid){
  const robot = uid === 'ai_robot';
  const out = {};
  ['champion','uclWinner'].forEach(k => {
    const cfg = SEASON_PICKS[k];
    if (!cfg?.odds) return;
    const sorted = Object.entries(cfg.odds).sort((a,b) => a[1] - b[1]);
    if (robot){ out[k] = sorted[0][0]; return; }          // Robot: hep favori

    /* Elle sabitlenmiş seçim varsa (ve hâlâ listedeyse) o kullanılır */
    const sabit = DELI_SEZON[k];
    if (sabit && cfg.odds[sabit] != null){ out[k] = sabit; return; }

    const bant = sorted.filter(([, o]) => o >= DELI_BAND[0] && o <= DELI_BAND[1]);
    const havuz = bant.length ? bant : [sorted[sorted.length - 1]];
    out[k] = havuz[Math.floor(rng(hashStr('deli-sezon-' + k))() * havuz.length)][0];
  });
  /* Küme düşmede oran yok: Robot en zayıf üçü, Deli rastgele üçü seçer */
  const pool = SL_TEAMS.filter(c => !BIG4.includes(c));
  if (robot){
    out.relegated = [...pool].sort((a,b) => strength(a) - strength(b)).slice(0,3);
  } else {
    const r = rng(hashStr('deli-kume')), c = [...pool], out3 = [];
    while (out3.length < 3 && c.length) out3.push(c.splice(Math.floor(r() * c.length), 1)[0]);
    out.relegated = out3;
  }
  return out;
}

/* Botları Store'a ekler — hem demo hem bulut modunda çağrılır */
function injectAI(){

/* Deli fikir değiştirince ekranı tazeler.
   Yalnızca BAŞLAMAMIŞ maçlara bakılır: başlamış maçın penceresi zaten
   sabittir, boşuna yeniden çizmeye gerek yok. Pencere numaralarının
   toplamı değişmediyse hiçbir şey yapılmaz — yani sakin zamanlarda
   bu döngü bedavaya gelir. */
let deliWatch = null, deliSig = null;
function deliSignature(){
  let s = 0;
  FIXTURES.forEach(m => { if (matchState(m) === 'open') s += deliBucket(m); });
  return s;
}
function watchDeli(render){
  clearInterval(deliWatch);
  deliSig = deliSignature();
  if (DEMO_NOW) return;                    // saat donmuşsa Deli de donar
  deliWatch = setInterval(() => {
    const now = deliSignature();
    if (now === deliSig) return;
    deliSig = now;

    render();                              // tabloyu ve kartları tazele
  }, 15000);
}

/* Demo modda oran tablosu üretir (bulut yokken de oyun çalışsın).
   Poisson gol dağılımından skor olasılıkları, üstüne bahisçi marjı. */
function simulateOdds(m){
  const fact = n => { let f = 1; for (let i = 2; i <= n; i++) f *= i; return f; };
  const pmf  = (l, k) => Math.exp(-l) * Math.pow(l, k) / fact(k);
  const eh = Math.max(.25, 1.05 + (strength(m.home) + 4 - strength(m.away)) / 26);
  const ea = Math.max(.20, 0.95 + (strength(m.away) - strength(m.home) - 4) / 26);

  const scores = {};
  for (let h = 0; h <= 5; h++){
    for (let a = 0; a <= 5; a++){
      const p = pmf(eh, h) * pmf(ea, a);
      if (p < 0.0015) continue;                      // bahisçi de listelemez
      const o = Math.min(251, Math.max(1.5, (1 / p) / 1.15));
      scores[`${h}:${a}`] = Math.round(o * 4) / 4;   // .25 basamağına yuvarla
    }
  }
  return { scores };
}

/* Oranlar yalnızca yakın maçlar için bulunur — pencereyi bu belirler */
const ODDS_WINDOW_DAYS = 14;

function demoPrediction(uid, m, res){
  const r = rng(hashStr(uid + m.id));
  const skill = DEMO_SKILL[uid] ?? .4;
  if (res && r() < skill){
    const j = () => (r() < .55 ? 0 : (r() < .5 ? -1 : 1));
    return { h: Math.max(0, res.h + j()), a: Math.max(0, res.a + j()) };
  }
  const eh = Math.max(.3, 1.1 + (strength(m.home) + 4 - strength(m.away)) / 24);
  const ea = Math.max(.25, 1.0 + (strength(m.away) - strength(m.home) - 4) / 24);
  return { h: poisson(eh, r), a: poisson(ea, r) };
}

function loadDemo(){

  /* Demo modda "giriş", tarayıcıda saklanan bir takma addır.

  Store.season = JSON.parse(JSON.stringify(DEMO_SEASON));

  /* Oynanmış maçlar + önümüzdeki iki hafta için oran tablosu */
  const now = NOW().getTime();
  FIXTURES.forEach(m => {
    const t = new Date(m.dt).getTime();
    if (t < now + ODDS_WINDOW_DAYS * DAY_MS) Store.odds[m.id] = simulateOdds(m);
  });

  FIXTURES.forEach(m => {
    if (NOW().getTime() < new Date(m.dt).getTime()) return;
    Store.results[m.id] = simulateResult(m);
  });
  FIXTURES.forEach(m => {
    const t = new Date(m.dt).getTime(), n = NOW().getTime();
    const r = Store.results[m.id];
    if (r && n < t + TWO_HOURS){
      r.live = true;
      r.minute = Math.max(1, Math.min(90, Math.floor((n - t) / 60000)));
    }
  });
  DEMO_USERS.forEach(u => {
    Store.predictions[u.uid] = {};
    FIXTURES.forEach(m => {
      if (matchState(m) === 'open') return;
      Store.predictions[u.uid][m.id] = demoPrediction(u.uid, m, Store.results[m.id]);
    });
  });

  // tarayıcıda saklanan kendi tahminlerin demo verinin üstüne biner
  const local = loadLocal();
  Object.assign(Store.predictions.u_sen, local.preds || {});
  Object.assign(Store.season.u_sen, local.season || {});
  injectAI();
  Store.ready = true;
}

/* ============================================================
   MAÇ MEDYASI (video ya da fotoğraf)
   Yönetici sıradaki maça bir şey iliştirebilir: komik bir klip,
   bir ekran görüntüsü, bir karikatür… MEDYA YOKSA sayfada hiçbir
   iz kalmaz — ne boş kutu, ne başlık, ne çizgi. mediaBlock() boş
   dize döner.

   GÜVENLİK: yapıştırılan adres OLDUĞU GİBİ iframe'e konmaz. YouTube
   için yalnızca video kimliği çıkarılır ve gömme adresini biz
   kurarız; dosya adreslerinde ise https ve bilinen uzantı şartı
   aranır. Tanınmayan hiçbir şey sayfaya girmez.
   ============================================================ */
/* Alt yazı serbest metindir ve HTML'e basılır: kaçırılmazsa
   yapıştırılan bir etiket sayfaya karışır. Tek yerden geçsin. */
function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

function mediaEmbed(url){
  const u = (url || '').trim();
  if (!u) return null;

  /* YouTube: watch?v= · youtu.be/ · shorts/ · embed/ — kimlik 11 karakter */
  const yt = u.match(/(?:youtube\.com\/(?:watch\?(?:[^#]*&)?v=|shorts\/|embed\/|live\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);
  if (yt) return { tur:'yt', id:yt[1],
    src:`https://www.youtube-nocookie.com/embed/${yt[1]}?rel=0&modestbranding=1&playsinline=1` };

  /* Doğrudan video dosyası — yalnızca https ve bilinen uzantılar */
  if (/^https:\/\/[^\s"'<>]+\.(mp4|webm|ogg)(\?[^\s"'<>]*)?$/i.test(u))
    return { tur:'video', src:u };

  /* Fotoğraf — gif dahil, çünkü hareketli gif de "fotoğraf" gibi durur */
  if (/^https:\/\/[^\s"'<>]+\.(jpe?g|png|gif|webp|avif)(\?[^\s"'<>]*)?$/i.test(u))
    return { tur:'foto', src:u };

  /* Bilgisayardan yüklenen fotoğraf: dosyanın kendisi belgeye gömülür.
     SVG BİLEREK dışarıda — içine betik gömülebiliyor; jpeg/png/gif/webp
     ise yalnızca piksel taşır, <img> içinde çalıştırılamaz. Biçim
     harfi harfine denetlenir, base64 gövdesinde başka karakter olamaz. */
  if (/^data:image\/(jpeg|png|gif|webp);base64,[A-Za-z0-9+/]+=*$/.test(u))
    return { tur:'foto', src:u, gomulu:true };

  return null;                       // tanınmadı → hiç gösterme
}

/* ---- Bilgisayardan fotoğraf yükleme ----
   Firebase Storage bu projede açık değil (kova yok, açmak Blaze
   planı istiyor). Onun yerine fotoğraf TARAYICIDA küçültülüp
   Firestore belgesine gömülüyor. Firestore'un belge sınırı 1 MiB,
   base64 boyu ~%33 şişirdiği için hedef FOTO_HEDEF baytın altı.
   Video bu yolla gitmez: en kısa klip bile sınırın kat kat üstünde. */
const FOTO_HEDEF   = 620 * 1024;   // gömülü hâlin üst sınırı (bayt)
const FOTO_EN_BOY  = 1280;         // uzun kenar bu piksele indirilir

function fotoKucult(file){
  return new Promise((coz, red) => {
    if (!/^image\//.test(file.type)) return red(new Error('Bu bir fotoğraf değil'));
    const fr = new FileReader();
    fr.onerror = () => red(new Error('Dosya okunamadı'));
    fr.onload = () => {
      const im = new Image();
      im.onerror = () => red(new Error('Fotoğraf açılamadı'));
      im.onload = () => {
        const olcek = Math.min(1, FOTO_EN_BOY / Math.max(im.width, im.height));
        const c = document.createElement('canvas');
        c.width  = Math.round(im.width  * olcek);
        c.height = Math.round(im.height * olcek);
        const x = c.getContext('2d');
        x.imageSmoothingQuality = 'high';
        x.drawImage(im, 0, 0, c.width, c.height);
        /* Kalite kademe kademe düşürülür; hedefin altına inen ilk
           sonuç kullanılır. Hiçbiri sığmazsa en küçüğü döner. */
        let son = '';
        for (const q of [0.86, 0.78, 0.7, 0.62, 0.54, 0.46, 0.38]){
          son = c.toDataURL('image/jpeg', q);
          if (son.length <= FOTO_HEDEF) break;
        }
        coz({ uri: son, en: c.width, boy: c.height, bayt: son.length });
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ============================================================
   SIRALAMA VE İSTATİSTİK
   ============================================================ */
function lastFinishedId(){
  const done = FIXTURES.filter(isFinished);
  return done.length ? done[done.length - 1].id : null;
}

/* Skoru girilmiş ve BAŞLAMIŞ her maç puanlanır — bitmesi beklenmez.
   Maç sürerken girilen skor "şimdilik böyle" demektir; puan da geçicidir
   ve her golle değişir. Bitmemiş maçtan gelen puan ayrıca sayılır ki
   arayüz bunu canlı olarak işaretleyebilsin. */
const isLiveScored = m => matchState(m) === 'live' && !!Store.results[m.id];
const anyLiveMatch  = () => FIXTURES.some(isLiveScored);

/* ============================================================
   FORM SERİSİ (🔥)
   Ünvan DEĞİLDİR: tek sahibi yoktur, kimseden alınmaz, kimseyle
   yarışılmaz. Sadece bir durum göstergesi — üst üste puan alan
   HERKESTE aynı anda yanar.

   Seri, oynanmış maçların SONUNDAN geriye doğru sayılır: son maçta
   puan yoksa seri sıfırdır. Tahmin girilmemiş maç da seriyi kırar;
   "form" oynamayı sürdürmeyi de kapsar.

   ATEŞ_ESIGI maçta bir kez tutunca ateş yanar ve seri devam ettiği
   sürece yanmaya devam eder; seri kırıldığı an söner.
   ============================================================ */
const ATES_ESIGI = 3;

function scoringStreak(uid){
  const preds = Store.predictions[uid] || {};
  const oynanan = FIXTURES.filter(m => matchState(m) !== 'open' && Store.results[m.id]);
  let seri = 0;
  for (let i = oynanan.length - 1; i >= 0; i--){
    const m = oynanan[i], p = preds[m.id];
    if (!p) break;                                   // tahmin yok → seri kırılır
    if (scorePrediction(p, Store.results[m.id], m).pts <= 0) break;
    seri++;
  }
  return seri;
}

function leaderboard(){
  const lastId = lastFinishedId();
  /* Canlı maç varken "önceki sıralama" = maç başlamadan önceki hâl;
     yoksa eski davranış (son biten maçtan önceki hâl). Böylece ok
     işareti maç sürerken tam da o maçın etkisini gösterir. */
  const canliVar = anyLiveMatch();

  const rows = Store.users.map(u => {
    const preds  = Store.predictions[u.uid] || {};
    const season = Store.season[u.uid] || {};
    let pts = 0, exact = 0, count = 0, prevPts = 0, derbyPts = 0, euroPts = 0;
    let livePts = 0, liveCount = 0;

    FIXTURES.forEach(m => {
      const p = preds[m.id], r = Store.results[m.id];
      if (!p) return;
      count++;
      if (!r || matchState(m) === 'open') return;
      const canli = !isFinished(m);
      const got = scorePrediction(p, r, m).pts;
      pts += got;
      if (canli){ livePts += got; liveCount++; }
      if (m.derby) derbyPts += got;
      if (['UCL','UEL','UECL'].includes(m.comp)) euroPts += got;
      if (p.h === r.h && p.a === r.a) exact++;
      if (canliVar ? !canli : m.id !== lastId) prevPts += got;
    });

    Object.keys(SEASON_PICKS).forEach(k => {
      pts += seasonPoints(k, season[k], SEASON_RESULT[k]);
    });

    return { ...u, points:pts, exact, count, prevPoints:prevPts, derbyPts, euroPts, season,
             livePts, liveCount, streak: scoringStreak(u.uid) };
  });

  rows.sort((a,b) => b.points - a.points || b.exact - a.exact || a.name.localeCompare(b.name,'tr'));
  const prev = [...rows].sort((a,b) => b.prevPoints - a.prevPoints || a.name.localeCompare(b.name,'tr'));
  rows.forEach((r,i) => { r.rank = i + 1; r.delta = prev.findIndex(x => x.uid === r.uid) - i; });
  return rows;
}

/* Bir ölçütün değeri ve o değere ulaşılan maç sırası.
   art()  → sayaç: her artışta sırayı günceller
   enBuyuk() → rekor: yalnızca aşıldığında sırayı günceller */
const olc = () => ({ v:0, i:Infinity });
const art     = (o, i, n = 1) => { o.v += n; o.i = i; };
const enBuyuk = (o, i, n) => { if (n > o.v){ o.v = n; o.i = i; } };

/* Oyuncu başına ham sayılar. Puan tablosuyla aynı maç kümesini
   kullanır: başlamış + skoru girilmiş her maç. */
function achievementStats(rows){
  const oynanan  = FIXTURES.filter(m => matchState(m) !== 'open' && Store.results[m.id]);
  const sonMacId = oynanan.length ? oynanan[oynanan.length - 1].id : null;
  const deliTah  = Store.predictions['ai_deli'] || {};

  /* Maç başına ÖN HESAP — herkes için bir kez.
     · macSkor : o maçta hangi skoru kaç kişi yazmış (Yalnız Kurt için)
     · robotPuan: Robot o maçtan kaç puan almış (Robot Avcısı için)
     Bunları oyuncu döngüsünün içinde hesaplasaydık iş oyuncu sayısının
     KARESİ kadar büyürdü; burada bir kez çıkarılıp paylaşılıyor. */
  const macSkor = {}, robotPuan = {};
  oynanan.forEach(m => {
    const say = {};
    rows.forEach(x => {
      const p = (Store.predictions[x.uid] || {})[m.id];
      if (p) { const k = `${p.h}-${p.a}`; say[k] = (say[k] || 0) + 1; }
    });
    macSkor[m.id] = say;
    const rp = (Store.predictions['ai_robot'] || {})[m.id];
    robotPuan[m.id] = rp ? scorePrediction(rp, Store.results[m.id], m).pts : null;
  });

  const stats = {};

  rows.forEach(r => {
    const preds = Store.predictions[r.uid] || {};
    const d = { sonMac:olc(), enIyiMac:olc(), tamIsabet:olc(), derbi:olc(), seri:olc(),
                puanliMac:olc(), enBuyukOran:olc(), tahmin:olc(), ayna:olc(),
                sifirci:olc(), yagmur:olc(), deliKanka:olc(), kilPayi:olc(),
                avrupa:olc(), robotYendi:olc(), uzunYol:olc(), ezberci:olc(),
                kararsiz:olc(), tersine:olc(), yalnizKurt:olc(), balon:olc() };
    const skorSayim = {}, ayriSkorlar = new Set();
    d.ezberciSkor = '';                          // en çok tekrarlanan skor (ipucunda yazılır)

    const puanlar = oynanan.map((m, i) => {
      const p = preds[m.id], res = Store.results[m.id];
      if (!p) return null;                       // tahmin yoksa seri kırılır
      art(d.tahmin, i);
      const s = scorePrediction(p, res, m);
      const tam = p.h === res.h && p.a === res.a;

      enBuyuk(d.enIyiMac, i, s.pts);
      if (s.pts > 0) art(d.puanliMac, i);
      if (tam) art(d.tamIsabet, i);
      if (m.derby && s.pts) art(d.derbi, i, s.pts);
      if (m.id === sonMacId){ d.sonMac.v = s.pts; d.sonMac.i = i; }
      if (s.tier === 2) art(d.kilPayi, i);       // tek gol farkla kaçan

      if (p.h === 0 && p.a === 0) art(d.sifirci, i);
      if (!tam && p.h === res.a && p.a === res.h) art(d.ayna, i);
      if (tam && (res.h + res.a) > 5) art(d.yagmur, i);

      /* Deli'nin kankası: Deli ile aynı skoru yazmak. Deli kendi
         kankası olamaz, yoksa ünvan hep onda kalırdı. */
      const dp = deliTah[m.id];
      if (r.uid !== 'ai_deli' && dp && dp.h === p.h && dp.a === p.a) art(d.deliKanka, i);

      /* Tutturulan en yüksek oran — riski ödüllendiren ünvan için */
      if (tam){
        const o = oddsInfo(m.id)?.scores?.[`${p.h}:${p.a}`];
        if (o) enBuyuk(d.enBuyukOran, i, o);
      }

      /* ---- Yeni ünvanların ölçütleri ---- */
      if (EURO_COMPS.includes(m.comp) && s.pts) art(d.avrupa, i, s.pts);

      /* Robot'u geçmek: aynı maçta ondan çok puan almak. Robot kendini
         geçemez; Deli geçebilir — o da herkes gibi tahmin yazıyor. */
      const rp = robotPuan[m.id];
      if (r.uid !== 'ai_robot' && rp !== null && s.pts > rp) art(d.robotYendi, i);

      /* Ezberci / Kararsız: aynı skoru kaç kez yazdı, kaç ayrı skor denedi */
      const anahtar = `${p.h}-${p.a}`;
      skorSayim[anahtar] = (skorSayim[anahtar] || 0) + 1;
      if (skorSayim[anahtar] > d.ezberci.v){
        d.ezberci = { v: skorSayim[anahtar], i };
        d.ezberciSkor = anahtar;
      }
      if (!ayriSkorlar.has(anahtar)){ ayriSkorlar.add(anahtar); d.kararsiz = { v: ayriSkorlar.size, i }; }

      /* Yalnız Kurt: o skoru yazan tek kişi olmak */
      if (macSkor[m.id][anahtar] === 1) art(d.yalnizKurt, i);

      /* Balon: bol gollü yazıp eli boş dönmek */
      if (p.h + p.a >= 4 && s.pts === 0) art(d.balon, i);

      return s.pts;
    });

    /* Form = SONDAN başlayarak kesintisiz puan alınan maç sayısı */
    let seri = 0;
    for (let i = puanlar.length - 1; i >= 0; i--){
      if (!puanlar[i]) break;                    // null (tahmin yok) ya da 0 puan
      seri++;
    }
    /* Serinin "ulaşma sırası" = serinin BAŞLADIĞI maç. Eşit seride
       daha erken başlayan, yani daha uzun süredir formda olan kazanır. */
    d.seri = { v:seri, i: seri ? puanlar.length - seri : Infinity };

    /* UZUN YOL — sezonun EN UZUN puan serisi (rekor, güncel seri değil).
       Ateş rozeti "şu an" der, bu ünvan "bu sezon en iyisi" der.
       Tahmin girilmemiş maç seriyi kırar: form oynamayı da kapsar. */
    let enUzun = 0, enUzunSon = Infinity, ard = 0;
    puanlar.forEach((v, i) => {
      if (v){ ard++; if (ard > enUzun){ enUzun = ard; enUzunSon = i; } }
      else ard = 0;
    });
    d.uzunYol = { v:enUzun, i:enUzunSon };

    /* NE DERSE TERSİNE OYNA — en uzun puansız seri.
       Atlanan maç seriyi NE KIRAR NE DE UZATIR: bir hafta ara vermek
       kötü gidişi sıfırlamaz, ama oyunu tamamen bırakan da sonsuz
       seri biriktiremez — sayaç son oynadığı maçta donar. */
    let enKotu = 0, enKotuSon = Infinity, ard2 = 0;
    puanlar.forEach((v, i) => {
      if (v === null) return;                    // atlanan maç: görünmez
      if (v > 0){ ard2 = 0; return; }            // puan aldı → seri bitti
      ard2++; if (ard2 > enKotu){ enKotu = ard2; enKotuSon = i; }
    });
    d.tersine = { v:enKotu, i:enKotuSon };

    stats[r.uid] = d;
  });
  return stats;
}

/* uid → [ünvan].  Her ünvan için tek kazanan seçilir:
   önce en yüksek değer, eşitlikte o değere önce ulaşan. */
function titlesFor(rows, stats){
  stats = stats || achievementStats(rows);
  const out = {};

  TITLES.forEach(t => {
    let kazanan = null, en = null;
    rows.forEach(r => {
      /* BOTLAR yalnızca botaAcik işaretli dalda yarışır (şu an sadece
         Son Maçın Kralı). Kural bu yönde yazıldı — 19 ünvana "insan
         özel" etiketi koymak yerine, botun girebildiği TEK dalı
         işaretlemek hem kısa hem de yeni ünvan eklerken güvenli:
         işaretlemeyi unutursan bot yine giremez, sessizce sızamaz. */
      if (r.ai && !t.botaAcik) return;
      const o = stats[r.uid][t.olcut];
      if (!o || o.v < t.esik) return;            // bu oyuncu bu dalda yok
      if (!kazanan || o.v > en.v || (o.v === en.v && o.i < en.i)){ kazanan = r; en = o; }
    });
    if (!kazanan) return;                        // dal henüz anlamsız
    /* İpucu kazananın kendi sayılarını da alabilir — Ezberci hangi
       skoru tekrarladığını yazıyor. */
    (out[kazanan.uid] ||= []).push({ ...t, sayi: en.v, baslik: t.ipucu(en.v, stats[kazanan.uid]) });
  });
  return out;
}

/* Ünvan → o an kimde. Profildeki "kimde, kaçla" tablosu için. */
function titleBoard(rows, stats){
  stats = stats || achievementStats(rows);
  const sahip = titlesFor(rows, stats);
  const kimde = {};
  Object.entries(sahip).forEach(([uid, list]) =>
    list.forEach(t => kimde[t.id] = { uid, ...t }));
  return TITLES.map(t => ({ ...t, tutan: kimde[t.id] || null }));
}

function achievementsFor(rows){
  const stats = achievementStats(rows);
  return { stats, unvan: titlesFor(rows, stats) };
}
function derbyTable(){
  const t = {}; BIG4.forEach(c => t[c] = { code:c, w:0, d:0, l:0, gf:0, ga:0, pts:0, played:0 });
  FIXTURES.forEach(m => {
    if (!m.derby) return;
    const r = Store.results[m.id]; if (!r || !isFinished(m)) return;
    const H = t[m.home], A = t[m.away];
    H.played++; A.played++; H.gf += r.h; H.ga += r.a; A.gf += r.a; A.ga += r.h;
    if (r.h > r.a){ H.w++; A.l++; H.pts += 3; }
    else if (r.h < r.a){ A.w++; H.l++; A.pts += 3; }
    else { H.d++; A.d++; H.pts++; A.pts++; }
  });
  return Object.values(t).sort((a,b) => b.pts - a.pts || (b.gf-b.ga)-(a.gf-a.ga) || b.gf-a.gf);
}

function teamRecord(code, comp){
  const rec = { w:0, d:0, l:0, gf:0, ga:0, played:0 };
  FIXTURES.forEach(m => {
    if (!m.big.includes(code)) return;
    if (comp && comp !== 'ALL' && m.comp !== comp) return;
    const r = Store.results[m.id]; if (!r || !isFinished(m)) return;
    const home = m.home === code;
    const gf = home ? r.h : r.a, ga = home ? r.a : r.h;
    rec.played++; rec.gf += gf; rec.ga += ga;
    if (gf > ga) rec.w++; else if (gf < ga) rec.l++; else rec.d++;
  });
  return rec;
}

function teamForm(code, n = 5){
  const out = [];
  FIXTURES.filter(m => m.big.includes(code) && isFinished(m) && Store.results[m.id])
    .slice(-n).forEach(m => {
      const r = Store.results[m.id], home = m.home === code;
      const gf = home ? r.h : r.a, ga = home ? r.a : r.h;
      out.push(gf > ga ? 'G' : gf < ga ? 'M' : 'B');
    });
  return out;
}
