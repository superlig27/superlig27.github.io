const SEASON_RESULT = { champion:null, uclWinner:null, relegated:null };

/* Bir sezon bahsinin getirdiği puan (çoklu seçimde her isabet ayrı sayılır) */
function seasonPoints(kind, pick, result){
  const cfg = SEASON_PICKS[kind];
  if (!cfg || pick == null || result == null) return 0;
  if (cfg.kind === 'multi'){
    if (!Array.isArray(pick) || !Array.isArray(result)) return 0;
    return pick.filter(x => result.includes(x)).length * cfg.points;
  }
  return pick === result ? cfg.points : 0;
}

/* ============================================================
   ORAN MOTORU
   Zorluğu bahis oranları belirler; "sürpriz" tanımı bize kalmaz.
   Referans HER MAÇ İÇİN AYRI: o maçın en kısa oranı (bahisçinin
   favori skoru) = ×1.00 kabul edilir. Böylece 0:1 tahmini dengeli
   bir maçta ×1.19, tek taraflı bir maçta ×3.00 edebilir.
   ============================================================ */
const ODDS_EXP = 0.45;   // 0 = oran etkisiz · 1 = tüm seçimler eşit değerde
const ODDS_CAP = 3.00;   // tek bir uzun atış sezonu belirlemesin
const OUT_CAP  = 2.00;   // sonuç (1/X/2) çarpanı tavanı

const clampMult = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

/* Ham oran tablosundan türetilenler; sonuç nesnede önbelleklenir */
function oddsInfo(id){
  const raw = Store.odds[id];
  if (!raw || !raw.scores) return null;
  if (raw.__i) return raw.__i;

  const scores = raw.scores;
  let min = Infinity;
  const p = { H:0, D:0, A:0 };

  Object.keys(scores).forEach(k => {
    const o = scores[k];
    if (!(o > 1)) return;
    if (o < min) min = o;
    const [h, a] = k.split(':').map(Number);
    p[h > a ? 'H' : h < a ? 'A' : 'D'] += 1 / o;     // örtük olasılık
  });

  /* Bahisçi marjını at: üç sonucun toplamı 1 olsun */
  const tot = p.H + p.D + p.A;
  if (tot > 0){ p.H /= tot; p.D /= tot; p.A /= tot; }

  return raw.__i = { scores, min: min === Infinity ? null : min,
                     p, favP: Math.max(p.H, p.D, p.A) };
}

const hasOdds = m => !!oddsInfo(m.id);

/* Bir SKORUN çarpanı — tam isabet ve 1 gol sapma için.
   DİKKAT: her zaman GERÇEKLEŞEN skorla çağrılır, tahmin edilenle değil.
   Nedeni: tahmin edilen skorla çağrılırsa uçuk skor yazmak bedava
   çarpan kazandırır (8-2 yaz, ıskala, yine de büyük çarpanlı
   "1 gol sapma" biletin olsun). Çarpan artık yazdığına değil,
   maçın nasıl bittiğine bağlı — kimse şişirerek çarpan avlayamaz. */
function scoreMult(m, h, a){
  const i = oddsInfo(m.id);
  if (!i || !i.min) return 1;
  const o = i.scores[`${h}:${a}`];
  if (o == null) return ODDS_CAP;          // listede yoksa en riskli sayılır
  return clampMult(Math.pow(o / i.min, ODDS_EXP), 1, ODDS_CAP);
}

/* Seçilen SONUCUN çarpanı — skoru tutturamayıp sonucu bilenler için */
function outcomeMult(m, res){
  const i = oddsInfo(m.id);
  if (!i) return 1;
  const p = i.p[res];
  if (!p) return OUT_CAP;
  return clampMult(Math.pow(i.favP / p, ODDS_EXP), 1, OUT_CAP);
}

/* ============================================================
   PUANLAMA
   10 tam isabet · 8 kazanan + 1 gol · 6 doğru sonuç · 2 kıl payı
   İlk iki basamak SKOR oranıyla, üçüncüsü SONUÇ oranıyla çarpılır.
   Dördüncüsü düz kalır: yoksa her hafta uçuk skor yazmak kârlı olurdu.
   ============================================================ */
function scorePrediction(p, r, m){
  const pH = parseInt(p?.h), pA = parseInt(p?.a);
  const rH = parseInt(r?.h), rA = parseInt(r?.a);
  const none = { pts:0, tier:0, mult:0 };
  if ([pH,pA,rH,rA].some(v => isNaN(v))) return none;

  const comp = m?.mult || 1;
  const pr = pH > pA ? 'H' : pH < pA ? 'A' : 'D';
  const rr = rH > rA ? 'H' : rH < rA ? 'A' : 'D';
  const diff = Math.abs(pH - rH) + Math.abs(pA - rA);

  /* Çarpanlar HEP gerçekleşen sonuçtan gelir:
       10 / 8 → o SKORUN ne kadar beklenmedik olduğu
       6      → o SONUCUN (1/X/2) ne kadar beklenmedik olduğu
       2      → düz
     Böylece yazdığın skoru şişirerek çarpan büyütemezsin. */
  let tier, mult;
  if (pH === rH && pA === rA)   { tier = 10; mult = scoreMult(m, rH, rA); }
  else if (pr === rr && diff===1){ tier = 8;  mult = scoreMult(m, rH, rA); }
  else if (pr === rr)            { tier = 6;  mult = outcomeMult(m, rr); }
  else if (diff === 1)           { tier = 2;  mult = 1; }
  else return none;

  return { pts: Math.round(tier * mult * comp), tier,
           mult: Math.round(mult * comp * 100) / 100 };
}

/* Eski çağrılar için ince sarmalayıcı */
function calcPoints(pH, pA, rH, rA, m){
  return scorePrediction({ h:pH, a:pA }, { h:rH, a:rA }, m).pts;
}

function ptsClass(tier){
  if (!tier) return 'pt-0';
  if (tier >= 10) return 'pt-10';
  if (tier >= 8)  return 'pt-8';
  if (tier >= 6)  return 'pt-6';
  return 'pt-2';
}

/* ============================================================
   BİÇİMLENDİRME (saatler her cihazda TSİ)
   ============================================================ */
const TR_MONTHS = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const TR_DAYS   = ['Paz','Pzt','Sal','Çar','Per','Cum','Cmt'];
const TR_DAYS_L = ['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
const TZ = 'Europe/Istanbul';

function istParts(iso){
  const d = new Date(iso);
  try{
    const p = {};
    new Intl.DateTimeFormat('en-GB', { timeZone:TZ, year:'numeric', month:'numeric',
      day:'numeric', hour:'2-digit', minute:'2-digit', hour12:false })
      .formatToParts(d).forEach(x => p[x.type] = x.value);
    const shifted = new Date(`${p.year}-${String(p.month).padStart(2,'0')}-${String(p.day).padStart(2,'0')}T00:00:00Z`);
    return { day:+p.day, month:+p.month - 1, year:+p.year,
             hour:p.hour === '24' ? '00' : p.hour, minute:p.minute,
             dow:shifted.getUTCDay(), key:`${p.year}-${p.month}-${p.day}` };
  }catch(e){
    return { day:d.getDate(), month:d.getMonth(), year:d.getFullYear(),
             hour:String(d.getHours()).padStart(2,'0'),
             minute:String(d.getMinutes()).padStart(2,'0'),
             dow:d.getDay(), key:d.toDateString() };
  }
}
const fmtTime      = iso => { const p = istParts(iso); return `${p.hour}:${p.minute}`; };
const fmtDate      = iso => { const p = istParts(iso); return `${p.day} ${TR_MONTHS[p.month]} ${TR_DAYS[p.dow]} · ${p.hour}:${p.minute}`; };
const fmtDateShort = iso => { const p = istParts(iso); return `${p.day} ${TR_MONTHS[p.month].slice(0,3)} ${p.year}`; };
const dayKey       = iso => istParts(iso).key;
function fmtDayHeader(iso){
  const p = istParts(iso), t = istParts(NOW().toISOString());
  if (p.key === t.key) return 'BUGÜN';
  return `${p.day} ${TR_MONTHS[p.month]} ${TR_DAYS_L[p.dow]}`;
}

function timeParts(ms){
  if (ms < 0) ms = 0;
  const s = Math.floor(ms / 1000);
  return { d:Math.floor(s/86400), h:Math.floor((s%86400)/3600), m:Math.floor((s%3600)/60), s:s%60 };
}
function timeLeftShort(ms){
  const t = timeParts(ms);
  if (t.d > 0) return `${t.d} gün ${t.h} sa`;
  if (t.h > 0) return `${t.h} sa ${t.m} dk`;
  return `${t.m} dk`;
}

/* ============================================================
   ARMA (SVG)
   Dört büyükler çizgili; diğer takımlar iki renkli + monogram
   ============================================================ */
const SHIELD = 'M32 2 L60 11 V34 C60 49 47 59.5 32 65 C17 59.5 4 49 4 34 V11 Z';

/* Bir takımın arma adresi: önce yöneticinin girdiği (buluttan gelen),
   yoksa dosyadaki varsayılan. Hiçbiri yoksa çizilmiş arma kullanılır. */
function logoOf(code){
  if (typeof Store !== 'undefined' && Store.logos && Store.logos[code]) return Store.logos[code];
  return LOGOS[code] || null;
}

/* Arma varsa gerçek görsel, yoksa çizilmiş arma.
   Görsel yüklenemezse onerror ile çizilmiş armaya döner. */
function crest(code, size = 44){
  const url = logoOf(code);
  if (!url) return crestShield(code, size);
  const t = TEAMS[code];
  return `<img class="crest crest-img" src="${url}"
    width="${size}" height="${Math.round(size * 67/64)}" alt="${t ? t.name : code}"
    decoding="async" onerror="this.outerHTML=crestShield('${code}',${size})">`;
}

function crestShield(code, size = 44){
  const t = TEAMS[code];
  if (!t) return `<span style="width:${size}px;display:inline-block"></span>`;
  const uid = `c${code}${Math.random().toString(36).slice(2,7)}`;
  let bands;

  if (t.stripe === 'h'){
    bands = `<rect y="0"  width="64" height="17" fill="${t.c1}"/><rect y="17" width="64" height="16" fill="${t.c2}"/>
             <rect y="33" width="64" height="16" fill="${t.c1}"/><rect y="49" width="64" height="18" fill="${t.c2}"/>`;
  } else if (t.stripe === 'v'){
    bands = `<rect x="0" width="16" height="67" fill="${t.c2}"/><rect x="16" width="16" height="67" fill="${t.c1}"/>
             <rect x="32" width="16" height="67" fill="${t.c2}"/><rect x="48" width="16" height="67" fill="${t.c1}"/>`;
  } else if (t.stripe === 'v3'){
    bands = `<rect width="64" height="67" fill="${t.c2}"/><rect x="9" width="9" height="67" fill="${t.c1}"/>
             <rect x="27" width="9" height="67" fill="${t.c1}"/><rect x="45" width="9" height="67" fill="${t.c1}"/>`;
  } else if (t.stripe === 'd'){
    bands = `<rect x="-40" y="-40" width="150" height="150" fill="${t.c1}"/>
             <g transform="rotate(-30 32 33)"><rect x="-22" y="-40" width="18" height="150" fill="${t.c2}"/>
             <rect x="14" y="-40" width="18" height="150" fill="${t.c2}"/>
             <rect x="50" y="-40" width="18" height="150" fill="${t.c2}"/></g>`;
  } else {
    // diğer takımlar: çapraz iki renk + baş harfler
    const mono = (t.name.match(/\b[A-ZÇĞİÖŞÜ]/g) || [t.name[0]]).slice(0,2).join('');
    const dark = isDark(t.c1);
    bands = `<rect width="64" height="67" fill="${t.c1}"/>
             <path d="M0 67 L64 0 V67 Z" fill="${t.c2}"/>
             <text x="32" y="42" text-anchor="middle" font-family="Anton, Impact, sans-serif"
                   font-size="24" fill="${dark ? '#fff' : '#10101a'}"
                   stroke="rgba(0,0,0,.28)" stroke-width=".6">${mono}</text>`;
  }

  return `<svg class="crest" width="${size}" height="${size * 67/64}" viewBox="0 0 64 67" role="img" aria-label="${t.name}">
    <defs><clipPath id="${uid}"><path d="${SHIELD}"/></clipPath>
      <linearGradient id="${uid}g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff" stop-opacity=".26"/>
        <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
        <stop offset="1" stop-color="#000" stop-opacity=".34"/></linearGradient></defs>
    <g clip-path="url(#${uid})">${bands}<rect width="64" height="67" fill="url(#${uid}g)"/></g>
    <path d="${SHIELD}" fill="none" stroke="rgba(255,255,255,.42)" stroke-width="2"/>
  </svg>`;
}
function isDark(hex){
  const c = hex.replace('#','');
  const r = parseInt(c.slice(0,2),16), g = parseInt(c.slice(2,4),16), b = parseInt(c.slice(4,6),16);
  return (0.299*r + 0.587*g + 0.114*b) < 140;
}

/* Oynanmış maçlar için örnek sonuç (takım güçlerine göre) */
function simulateResult(m){
  const r = rng(hashStr('res' + m.id));
  const eh = Math.max(.25, 1.05 + (strength(m.home) + 4 - strength(m.away)) / 26);
  const ea = Math.max(.20, 0.95 + (strength(m.away) - strength(m.home) - 4) / 26);
  return { h: poisson(eh, r), a: poisson(ea, r) };
}
/* Demo modda oran tablosu üretir (bulut yokken de oyun çalışsın).
   Poisson gol dağılımından skor olasılıkları, üstüne bahisçi marjı. */
function simulateOdds(m){
  const fact = n => { let f = 1; for (let i = 2; i <= n; i++) f *= i; return f; };
  const pmf  = (l, k) => Math.exp(-l) * Math.pow(l, k) / fact(k);
  const eh = Math.max(.25, 1.05 + (strength(m.home) + 4 - strength(m.away)) / 26);
  const ea = Math.max(.20, 0.95 + (strength(m.away) - strength(m.home) - 4) / 26);

  const scores = {};
  for (let h = 0; h <= 5; h++){
    for (let a = 0; a <= 5; a++){
      const p = pmf(eh, h) * pmf(ea, a);
      if (p < 0.0015) continue;                      // bahisçi de listelemez
      const o = Math.min(251, Math.max(1.5, (1 / p) / 1.15));
      scores[`${h}:${a}`] = Math.round(o * 4) / 4;   // .25 basamağına yuvarla
    }
  }
  return { scores };
}

    return { h: Math.max(0, res.h + j()), a: Math.max(0, res.a + j()) };
  }
  const eh = Math.max(.3, 1.1 + (strength(m.home) + 4 - strength(m.away)) / 24);
  const ea = Math.max(.25, 1.0 + (strength(m.away) - strength(m.home) - 4) / 24);
  return { h: poisson(eh, r), a: poisson(ea, r) };
}

function lastFinishedId(){
  const done = FIXTURES.filter(isFinished);
  return done.length ? done[done.length - 1].id : null;
}

function leaderboard(){
  const lastId = lastFinishedId();

  const rows = Store.users.map(u => {
    const preds  = Store.predictions[u.uid] || {};
    const season = Store.season[u.uid] || {};
    let pts = 0, exact = 0, count = 0, prevPts = 0, derbyPts = 0, euroPts = 0;

    FIXTURES.forEach(m => {
      const p = preds[m.id], r = Store.results[m.id];
      if (!p) return;
      count++;
      if (!r || !isFinished(m)) return;
      const got = scorePrediction(p, r, m).pts;
      pts += got;
      if (m.derby) derbyPts += got;
      if (['UCL','UEL','UECL'].includes(m.comp)) euroPts += got;
      if (p.h === r.h && p.a === r.a) exact++;
      if (m.id !== lastId) prevPts += got;
    });

    Object.keys(SEASON_PICKS).forEach(k => {
      pts += seasonPoints(k, season[k], SEASON_RESULT[k]);
    });

    return { ...u, points:pts, exact, count, prevPoints:prevPts, derbyPts, euroPts, season };
  });

  rows.sort((a,b) => b.points - a.points || b.exact - a.exact || a.name.localeCompare(b.name,'tr'));
  const prev = [...rows].sort((a,b) => b.prevPoints - a.prevPoints || a.name.localeCompare(b.name,'tr'));
  rows.forEach((r,i) => { r.rank = i + 1; r.delta = prev.findIndex(x => x.uid === r.uid) - i; });
  return rows;
}

function derbyTable(){
  const t = {}; BIG4.forEach(c => t[c] = { code:c, w:0, d:0, l:0, gf:0, ga:0, pts:0, played:0 });
  FIXTURES.forEach(m => {
    if (!m.derby) return;
    const r = Store.results[m.id]; if (!r || !isFinished(m)) return;
    const H = t[m.home], A = t[m.away];
    H.played++; A.played++; H.gf += r.h; H.ga += r.a; A.gf += r.a; A.ga += r.h;
    if (r.h > r.a){ H.w++; A.l++; H.pts += 3; }
    else if (r.h < r.a){ A.w++; H.l++; A.pts += 3; }
    else { H.d++; A.d++; H.pts++; A.pts++; }
  });
  return Object.values(t).sort((a,b) => b.pts - a.pts || (b.gf-b.ga)-(a.gf-a.ga) || b.gf-a.gf);
}

function teamRecord(code, comp){
  const rec = { w:0, d:0, l:0, gf:0, ga:0, played:0 };
  FIXTURES.forEach(m => {
    if (!m.big.includes(code)) return;
    if (comp && comp !== 'ALL' && m.comp !== comp) return;
    const r = Store.results[m.id]; if (!r || !isFinished(m)) return;
    const home = m.home === code;
    const gf = home ? r.h : r.a, ga = home ? r.a : r.h;
    rec.played++; rec.gf += gf; rec.ga += ga;
    if (gf > ga) rec.w++; else if (gf < ga) rec.l++; else rec.d++;
  });
  return rec;
}

function teamForm(code, n = 5){
  const out = [];
  FIXTURES.filter(m => m.big.includes(code) && isFinished(m) && Store.results[m.id])
    .slice(-n).forEach(m => {
      const r = Store.results[m.id], home = m.home === code;
      const gf = home ? r.h : r.a, ga = home ? r.a : r.h;
      out.push(gf > ga ? 'G' : gf < ga ? 'M' : 'B');
    });
  return out;
}

/* ============================================================
   TEMA SEÇİCİ
   Yeni tema eklemek için: style.css'e [data-theme="ad"] bloğu
   yaz, sonra buraya bir satır ekle. `bg` ve `sw` sadece
   listedeki önizleme içindir.
   ============================================================ */
const THEMES = [
  { key:'obsidyen', name:'Obsidyen',  bg:'#06060c', sw:'linear-gradient(115deg,#29d6ee,#7c6cff,#e8479f)' },
  { key:'gece',     name:'Gece Mavisi',bg:'#04070f', sw:'linear-gradient(115deg,#2fd8f5,#4b7dfb,#7b5cf0)' },
  { key:'bordo',    name:'Bordo Gece', bg:'#0a0509', sw:'linear-gradient(115deg,#f4a261,#d11d47,#ff4d8d)' },
  { key:'grafit',   name:'Grafit',     bg:'#0b0b0d', sw:'linear-gradient(115deg,#ffc93c,#ff8c42,#ff5e5b)' },
  { key:'ametist',  name:'Ametist',    bg:'#090514', sw:'linear-gradient(115deg,#4cc9f0,#9d4edd,#f72585)' },
  { key:'celik',    name:'Çelik',      bg:'#0a0c0f', sw:'linear-gradient(115deg,#cfe3f5,#7f9cc0,#5fd0e0)' },
];
const THEME_KEY = 'dortbuyuk-tema';

function applyTheme(key){
  const t = THEMES.find(x => x.key === key) || THEMES[0];
  if (t.key === 'obsidyen') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t.key);
  try { localStorage.setItem(THEME_KEY, t.key); } catch(e){}
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', t.bg);
  document.querySelectorAll('.theme-list button').forEach(b =>
    b.classList.toggle('on', b.dataset.theme === t.key));
}
const DEFAULT_THEME = 'grafit';          // varsayılan tema
function currentTheme(){
  try { return localStorage.getItem(THEME_KEY) || DEFAULT_THEME; } catch(e){ return DEFAULT_THEME; }
}
function mountThemeDock(){
  document.body.insertAdjacentHTML('beforeend', `
    <div class="theme-dock" id="themeDock">
      <div class="theme-list">
        ${THEMES.map(t => `<button data-theme="${t.key}" onclick="applyTheme('${t.key}')">
          <span class="sw" style="background:${t.sw}"></span><span class="nm">${t.name}</span>
        </button>`).join('')}
      </div>
      <button class="theme-btn" onclick="document.getElementById('themeDock').classList.toggle('open')">
        <span class="dot"></span><span>Tema</span>
      </button>
    </div>`);
  applyTheme(currentTheme());

  document.addEventListener('click', (e) => {
    const dock = document.getElementById('themeDock');
    if (dock && !dock.contains(e.target)) dock.classList.remove('open');
  });
}

/* ---------- Görünüme girince belirme ---------- */
function initReveal(root = document){
  const els = root.querySelectorAll('.reveal:not(.in)');
  if (!('IntersectionObserver' in window)){ els.forEach(e => e.classList.add('in')); return; }
  const io = new IntersectionObserver((entries) => {
    entries.forEach((e, i) => {
      if (!e.isIntersecting) return;
      const el = e.target;
      setTimeout(() => el.classList.add('in'), Math.min(i * 55, 240));
      io.unobserve(el);
    });
  }, { rootMargin:'0px 0px -8% 0px', threshold:.06 });
  els.forEach(el => io.observe(el));
}

/* ---------- Kartlarda 3B eğilme ---------- */
function initTilt(root = document){
  if (window.matchMedia('(hover: none)').matches) return;
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  root.querySelectorAll('[data-tilt]').forEach(card => {
    if (card.__tilt) return;
    card.__tilt = true;
    let raf = null;

    const move = (ev) => {
      if (raf) return;
      raf = requestAnimationFrame(() => {
        raf = null;
        const r = card.getBoundingClientRect();
        const px = (ev.clientX - r.left) / r.width  - .5;
        const py = (ev.clientY - r.top)  / r.height - .5;
        card.style.transform =
          `perspective(1000px) rotateX(${(-py * 4).toFixed(2)}deg) rotateY(${(px * 5).toFixed(2)}deg) translateY(-3px)`;
      });
    };
    const leave = () => { card.style.transform = ''; };

    card.addEventListener('mousemove', move);
    card.addEventListener('mouseleave', leave);
  });
}

/* ---------- Buton dalgası ---------- */
document.addEventListener('click', (e) => {
  const btn = e.target.closest('.btn, .pill, .team-opt');
  if (!btn) return;
  const r = btn.getBoundingClientRect();
  const size = Math.max(r.width, r.height);
  const s = document.createElement('span');
  s.className = 'ripple';
  s.style.width = s.style.height = size + 'px';
  s.style.left = (e.clientX - r.left - size / 2) + 'px';
  s.style.top  = (e.clientY - r.top  - size / 2) + 'px';
  btn.appendChild(s);
  setTimeout(() => s.remove(), 620);
});

/* ---------- Sayaç animasyonu ---------- */
function countUp(el, to, dur = 900){
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches){ el.textContent = to; return; }
  const from = 0, t0 = performance.now();
  const tick = (t) => {
    const k = Math.min((t - t0) / dur, 1);
    const eased = 1 - Math.pow(1 - k, 3);
    el.textContent = Math.round(from + (to - from) * eased);
    if (k < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
function initCounters(root = document){
  const els = [...root.querySelectorAll('[data-count]')];
  if (!('IntersectionObserver' in window)){ els.forEach(el => el.textContent = el.dataset.count); return; }
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      countUp(e.target, +e.target.dataset.count);
      io.unobserve(e.target);
    });
  }, { threshold:.4 });
  els.forEach(el => io.observe(el));
}

/* ---------- Bildirim ---------- */
let toastTimer = null;
function toast(msg){
  let el = document.getElementById('toast');
  if (!el){
    el = document.createElement('div');
    el.id = 'toast';
    document.body.appendChild(el);
  }
  el.innerHTML = `<span class="bar"></span><span>${msg}</span>`;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

/* ---------- Konfeti ---------- */
function confetti(x, y, n = 26){
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const colors = ['#29d6ee','#7c6cff','#e8479f','#a855f7','#f7c95a','#ffffff'];
  for (let i = 0; i < n; i++){
    const p = document.createElement('i');
    p.className = 'confetti';
    p.style.left = x + 'px';
    p.style.top  = y + 'px';
    p.style.background = colors[i % colors.length];
    document.body.appendChild(p);

    const ang  = (Math.PI * 2 * i) / n + Math.random() * .6;
    const vel  = 90 + Math.random() * 150;
    const dx   = Math.cos(ang) * vel;
    const dy   = Math.sin(ang) * vel - 120;
    const spin = (Math.random() * 900 - 450) + 'deg';

    p.animate([
      { transform:'translate(0,0) rotate(0deg)', opacity:1 },
      { transform:`translate(${dx}px, ${dy + 320}px) rotate(${spin})`, opacity:0 },
    ], { duration: 1000 + Math.random() * 700, easing:'cubic-bezier(.15,.7,.35,1)' })
     .onfinish = () => p.remove();
  }
}

/* ---------- Canlı geri sayım ---------- */
function startCountdown(target, els){
  const tick = () => {
    const t = timeParts(new Date(target).getTime() - NOW().getTime());
    els.d.textContent = String(t.d);
    els.h.textContent = String(t.h).padStart(2,'0');
    els.m.textContent = String(t.m).padStart(2,'0');
    els.s.textContent = String(t.s).padStart(2,'0');
  };
  tick();
  // DEMO_NOW sabitken saniye akmaz; canlıya alınca kendiliğinden çalışır
  if (!DEMO_NOW) setInterval(tick, 1000);
}

/* ---------- Sayfa açılış ---------- */
async function boot(activePage, render){
  applyTheme(currentTheme());        // ilk boyamadan önce temayı uygula
  mountChrome(activePage);
  document.getElementById('app').innerHTML =
    `<div class="empty" style="padding:80px 20px"><span class="em">⚽</span>Yükleniyor…</div>`;

  await waitForCloud();
  await initStore();

  render();
  mountFooter();
  mountThemeDock();
  refreshAuthChip();
  initReveal();
  initTilt();
  initCounters();

  // oturum değişince (başka sekmede çıkış vb.) tazele
  window.Cloud?.onChange(async () => {
    await initStore(); refreshAuthChip(); render();
  });
}

/* cloud.js bir modül olduğu için gecikmeli yüklenir; kısa süre bekle */
function waitForCloud(){
  if (!document.querySelector('script[data-cloud]')) return Promise.resolve();
  if (window.__cloudReady) return Promise.resolve();
  return new Promise(res => {
    const done = () => { window.__cloudReady = true; res(); };
    window.addEventListener('cloud-auth', done, { once:true });
    setTimeout(done, 3500);            // bağlanamazsa demo moduna düş
  });
}

  if (c.includes('invalid-credential') || c.includes('wrong-password') ||
      c.includes('user-not-found')) return 'E-posta veya şifre hatalı.';
  if (c.includes('email-already-in-use')) return 'Bu e-posta zaten kayıtlı.';
  if (c.includes('weak-password'))        return 'Şifre en az 6 karakter olmalı.';
  if (c.includes('invalid-email'))        return 'E-posta adresi geçersiz.';
  if (c.includes('too-many-requests'))    return 'Çok fazla deneme. Biraz sonra tekrar dene.';
  if (c.includes('network'))              return 'Bağlantı kurulamadı.';

/* ============================================================
   OYUNCU PROFİLİ — puan tablosunda bir satıra tıklayınca açılır
   ============================================================ */

/* Oynanmış maçlar boyunca biriken puan */
function progressionOf(uid){
  const preds = Store.predictions[uid] || {};
  const out = [];
  let cum = 0;
  FIXTURES.forEach(m => {
    if (!isFinished(m) || !Store.results[m.id]) return;
    const p = preds[m.id];
    if (!p) return;
    const s = scorePrediction(p, Store.results[m.id], m);
    cum += s.pts;
    out.push({ m, pred:p, res:Store.results[m.id], got:s.pts, tier:s.tier, cum });
  });
  return out;
}

/* Tek serili birikimli puan grafiği.
   Tek seri olduğu için gösterge (legend) yok — başlık zaten neyi
   gösterdiğini söylüyor. Renk siteyle aynı vurgu değişkeninden gelir,
   böylece altı temada da doğru görünür. */
function progressionChart(rows){
  if (rows.length < 2) return '';
  const W = 340, H = 116, PL = 6, PR = 34, PT = 10, PB = 18;
  const max = Math.max(...rows.map(r => r.cum), 1);
  const x = i => PL + (i / (rows.length - 1)) * (W - PL - PR);
  const y = v => PT + (1 - v / max) * (H - PT - PB);

  const line = rows.map((r,i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(r.cum).toFixed(1)}`).join(' ');
  const area = `${line} L${x(rows.length-1).toFixed(1)} ${y(0)} L${x(0).toFixed(1)} ${y(0)} Z`;

  /* Yatay kılavuz: geri planda, üçte bir aralıklarla */
  const grid = [0.5, 1].map(f => `<line x1="${PL}" x2="${W-PR}" y1="${y(max*f).toFixed(1)}"
    y2="${y(max*f).toFixed(1)}" stroke="currentColor" stroke-opacity=".08" stroke-width="1"/>`).join('');

  /* Her nokta için görünmez, parmak dostu vuruş alanı */
  const hit = rows.map((r,i) => `
    <circle cx="${x(i).toFixed(1)}" cy="${y(r.cum).toFixed(1)}" r="9" fill="transparent"
      style="cursor:pointer" onmouseenter="showProgTip(event, ${i})" onmouseleave="hideProgTip()"
      onclick="showProgTip(event, ${i})"></circle>`).join('');

  const last = rows[rows.length - 1];
  return `
    <div class="prog-wrap">
      <svg class="prog" viewBox="0 0 ${W} ${H}" role="img"
           aria-label="Sezon boyunca biriken puan: ${last.cum}">
        <defs>
          <linearGradient id="progFill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="var(--iris)" stop-opacity=".28"/>
            <stop offset="1" stop-color="var(--iris)" stop-opacity="0"/>
          </linearGradient>
        </defs>
        ${grid}
        <path d="${area}" fill="url(#progFill)"/>
        <path d="${line}" fill="none" stroke="var(--iris)" stroke-width="2"
              stroke-linejoin="round" stroke-linecap="round"/>
        <circle cx="${x(rows.length-1).toFixed(1)}" cy="${y(last.cum).toFixed(1)}" r="4"
                fill="var(--iris)" stroke="var(--bg)" stroke-width="2"/>
        <text x="${W-PR+7}" y="${(y(last.cum)+4).toFixed(1)}" fill="var(--text)"
              font-family="var(--f-num)" font-size="15">${last.cum}</text>
        ${hit}
      </svg>
      <div class="prog-tip" id="progTip"></div>
      <div class="prog-x"><span>${fmtDateShort(rows[0].m.dt)}</span>
        <span>${rows.length} maç</span>
        <span>${fmtDateShort(last.m.dt)}</span></div>
    </div>`;
}

let progRows = [];
function showProgTip(ev, i){
  const r = progRows[i], tip = document.getElementById('progTip');
  if (!r || !tip) return;
  const H = TEAMS[r.m.home], A = TEAMS[r.m.away];
  tip.innerHTML = `<b>${H.short || H.name} ${r.res.h}-${r.res.a} ${A.short || A.name}</b>
    <span>Tahmin ${r.pred.h}-${r.pred.a} · <b class="${ptsClass(r.tier)}">+${r.got}p</b>
    · toplam ${r.cum}</span>`;
  const box = tip.parentElement.getBoundingClientRect();
  const dot = ev.target.getBoundingClientRect();
  const left = dot.left - box.left + dot.width / 2;
  tip.style.left = Math.max(4, Math.min(box.width - 4, left)) + 'px';
  tip.classList.add('on');
}
function hideProgTip(){ document.getElementById('progTip')?.classList.remove('on'); }

function openProfile(uid){
  const rows = leaderboard();
  const me = rows.find(r => r.uid === uid);
  if (!me) return;
  progRows = progressionOf(uid);

  let el = document.getElementById('profileModal');
  if (!el){
    el = document.createElement('div');
    el.id = 'profileModal'; el.className = 'modal';
    el.addEventListener('click', e => { if (e.target === el) closeProfile(); });
    document.body.appendChild(el);
  }

  const best = [...progRows].sort((a,b) => b.got - a.got)[0];
  const recent = [...progRows].reverse().slice(0, 8);

  const seasonHtml = Object.keys(SEASON_PICKS).map(k => {
    const v = me.season?.[k], cfg = SEASON_PICKS[k];
    const has = Array.isArray(v) ? v.length > 0 : !!v;
    const txt = !has ? '<em>seçilmedi</em>'
      : (Array.isArray(v) ? v : [v]).map(x => TEAMS[x]?.name || x).join(', ');
    const got = seasonPoints(k, v, SEASON_RESULT[k]);
    return `<div class="pf-season">
      <span class="k">${cfg.emoji} ${cfg.title}</span>
      <span class="v">${txt}${got ? ` <b style="color:var(--cyan)">+${got}p</b>` : ''}</span>
    </div>`;
  }).join('');

  el.innerHTML = `<div class="modal-card" style="max-width:480px">
    <button class="modal-x" onclick="closeProfile()" aria-label="Kapat">✕</button>
    <div class="modal-head">
      <span class="brand-mark" style="font-size:16px">${(me.name||'?').charAt(0).toLocaleUpperCase('tr')}</span>
      <div>
        <div class="modal-title">${me.name}${me.you ? ' (sen)' : ''}</div>
        <div class="modal-sub">${me.rank}. sıra · ${rows.length} oyuncu arasında</div>
      </div>
    </div>
    <div class="modal-body">
      <div class="stat-row" style="margin-bottom:6px">
        <div class="stat"><b>${me.points}</b><span>Puan</span></div>
        <div class="stat"><b>${me.exact}</b><span>Tam isabet</span></div>
        <div class="stat"><b>${me.count}</b><span>Tahmin</span></div>
      </div>

      ${progRows.length >= 2 ? `
        <div class="pf-h">Puan gelişimi</div>
        ${progressionChart(progRows)}` : `
        <div class="empty" style="padding:16px"><span class="em">📈</span>
          Grafik için en az iki puanlanmış maç gerekiyor.</div>`}

      <div class="pf-h">Sezon tahminleri</div>
      ${seasonHtml}

      ${best && best.got > 0 ? `
        <div class="note" style="margin-top:14px"><span>⭐</span>
          <span>En iyi maçı: <b>${TEAMS[best.m.home].short || TEAMS[best.m.home].name}
          ${best.res.h}-${best.res.a} ${TEAMS[best.m.away].short || TEAMS[best.m.away].name}</b>
          — ${best.pred.h}-${best.pred.a} dedi,
          <b style="color:var(--gold)">${best.got} puan</b> aldı.</span>
        </div>` : ''}

      ${recent.length ? `
        <div class="pf-h">Son tahminleri</div>
        <div class="pf-list">
          ${recent.map(r => `
            <div class="pf-row">
              <span class="mt">${TEAMS[r.m.home].short || TEAMS[r.m.home].name}
                <b>${r.res.h}-${r.res.a}</b>
                ${TEAMS[r.m.away].short || TEAMS[r.m.away].name}</span>
              <span class="pd">${r.pred.h}-${r.pred.a}</span>
              <span class="pt ${ptsClass(r.tier)}">${r.got}p</span>
            </div>`).join('')}
        </div>` : ''}
    </div>
  </div>`;
  requestAnimationFrame(() => el.classList.add('show'));
}
function closeProfile(){
  const el = document.getElementById('profileModal');
  if (!el) return;
  el.classList.remove('show');
  setTimeout(() => el.remove(), 260);
}

/* Tahmin kaydetmeden önce çağrılır. Girişli değilse pencereyi açar. */
function requireLogin(){
  if (Store.me && !Store.me.anon) return true;
  openAuth('login');
  return false;
}

<script>
/* ===== index.html ===== */
window.P_tahmin = (function(){
/* ============================================================

let fTeam = 'ALL', fComp = 'ALL', shown = 14;

/* ---------------- Hero: sıradaki / oynanan maç ---------------- */

        <span style="font-size:11px;color:var(--faint)">${fmtDate(m.dt)} · ${m.venue}</span>

/* ---------------- Ödül kartı ----------------
   Sıralamanın hemen üstünde durur; kimse aramasın diye kompakt.
   Görsel dış bir adresten gelir; yüklenemezse kart sadece
   yazıyla kalır (onerror ile alan gizlenir).                   */
const PRIZE_ART = 'https://static0.moviewebimages.com/wordpress/wp-content/uploads/2024/10/spongebob-squarepants-holding-up-krabby-patty.jpg';

function prizeCard(){

           onerror="this.remove()">

/* ---------------- Çarpan tablosu ---------------- */
function multBlock(){
  const rowsHtml = [
    ['SÜRPRİZ PRİMİ', '1. çarpan — beklenmedik skor tutturunca', '×3', 'hot'],
    ['DERBİ', '2. çarpan — dört büyükler birbiriyle', '×2', 'hot'],

  ].map(([t, d, x, c]) => `

        İkisi birden en fazla ×6 eder — yani bir maçtan en çok 60 puan.</span>
      </div>
      ${rowsHtml}
      <div class="note" style="margin-top:14px">

        Hangi maçların açılacağı yandaki kartta anlatılıyor.</span>

/* ---------------- Filtreler ---------------- */
function filterBar(){
  const teams = [['ALL','Tüm Takımlar'], ...BIG4.map(c => [c, TEAMS[c].name])];
  const have = new Set(FIXTURES.map(m => m.comp));
  const comps = [['ALL','Hepsi'],['DERBY','⚔️ Derbiler'],['SL','Süper Lig'],
                 ['EU','🌍 Avrupa'],['UCL','Şampiyonlar L.'],['UEL','Avrupa L.'],['UECL','Konferans L.']]
                 .filter(([k]) => ['ALL','DERBY','SL'].includes(k) ||

}

/* ---------------- Maç kartı ---------------- */
function matchCard(m){
  const H = TEAMS[m.home], A = TEAMS[m.away], b = badgeOf(m);
  const st = matchState(m);
  const r = RESULTS[m.id];
  const my = myPredictions()[m.id];
  const open = st === 'open';
  const feat = isFeatured(m);

  const oddsReady = hasOdds(m);
  /* Tahmin girilebilir mi, girilmiş mi? Kart rengi buna göre. */
  const actionable = open && oddsReady && isLoggedIn();
  const status = !actionable ? '' : (my ? 'ok' : 'todo');

  const stateChip = open
    ? `<span class="state state-open">⏱ ${timeLeftShort(new Date(m.dt) - NOW())}</span>`
    : st === 'live'
      ? `<span class="state state-live"><span class="pulse-dot"></span>CANLI${r?.minute ? ' ' + r.minute + "'" : ''}</span>`
      : `<span class="state state-done">🔒 BİTTİ</span>`;

  const pickChip = status === 'todo'
    ? `<span class="state state-todo" title="Bu maça henüz tahmin yapmadın">
         <span class="dot"></span>TAHMİNİN YOK</span>`
    : status === 'ok'
      ? `<span class="state state-ok">✓ TAHMİNİN VAR</span>`
      : '';

  const center = (st !== 'open' && r)
    ? `<div class="score tint">${r.h} — ${r.a}</div>`
    : `<div class="vs-lite">VS</div>`;

  let pickArea = '';
  if (open && !oddsReady){
    /* Oran tablosu girilmeden maç tahmine kapalıdır — pencere budur */
    pickArea = `
      <div class="login-cta">
        <span>⏳ <b>Oranlar yakında</b> — bu maç oranlar girilince açılacak.</span>
      </div>`;
  } else if (open && !isLoggedIn()){
    pickArea = `
      <div class="login-cta">
        <span>Tahmin girmek için giriş yapmalısın</span>
        <button class="btn" onclick="openAuth('login')">Giriş yap</button>
      </div>`;
  } else if (open){
    pickArea = `
      <div class="pick">
        <div class="pick-label">${my ? 'Tahminini güncelle' : 'Tahminini gir'}</div>
        <input class="num ${my ? 'filled' : ''}" id="h_${m.id}" type="number" inputmode="numeric"
               min="0" max="20" placeholder="–" value="${my?.h ?? ''}" aria-label="${H.name} golü"
               oninput="P_tahmin.hintOdds('${m.id}')">
        <span class="dash">—</span>
        <input class="num ${my ? 'filled' : ''}" id="a_${m.id}" type="number" inputmode="numeric"
               min="0" max="20" placeholder="–" value="${my?.a ?? ''}" aria-label="${A.name} golü"
               oninput="P_tahmin.hintOdds('${m.id}')">
        <button class="btn ${my ? 'saved' : ''}" data-save="${m.id}"
                onclick="P_tahmin.savePick('${m.id}', event)">${my ? 'Güncelle' : 'Kaydet'}</button>
        <button class="btn ghost odds-btn" onclick="openOddsView('${m.id}')"
                title="Bu maçın tüm oranları">📊</button>
      </div>
      <div class="odds-hint" id="hint_${m.id}">${oddsHintText(m, my?.h, my?.a)}</div>`;
  } else if (my){
    const sc = r && isFinished(m) ? scorePrediction(my, r, m) : null;
    pickArea = `
      <div class="pick" style="gap:14px">
        <div class="pick-label">Senin tahminin</div>
        <span class="score" style="font-size:23px;color:var(--dim)">${my.h} — ${my.a}</span>
        ${sc
          ? `<span class="${ptsClass(sc.tier)}" style="font-family:var(--f-num);font-size:22px"
                   title="${sc.tier} × ${sc.mult}">+${sc.pts}p</span>`
          : `<span style="font-size:11px;color:var(--faint)">maç bitince puanlanacak</span>`}
      </div>`;
  }

  let others = '';
  if (!open){
    const rows = Store.users.map(u => {
      const p = (u.you ? myPredictions() : predictionsOf(u.uid))?.[m.id];
      if (!p) return null;
      const sc = r && isFinished(m) ? scorePrediction(p, r, m) : null;
      return { u, p, pts: sc ? sc.pts : null, tier: sc ? sc.tier : 0 };
    }).filter(Boolean).sort((a,b) => (b.pts ?? -1) - (a.pts ?? -1));

    others = `
      <button class="reveal-btn" onclick="P_tahmin.togglePicks('${m.id}', this)">
        <span>Herkes ne dedi (${rows.length})</span><span class="chev">▾</span>
      </button>
      <div class="picks" id="picks_${m.id}">
        ${rows.map(({u,p,pts,tier}) => `
          <div class="prow ${u.you ? 'me' : ''}">
            <span class="who">${u.name}${u.you ? ' (sen)' : ''}</span>
            <span class="sc">${p.h} — ${p.a}</span>
            ${pts !== null ? `<span class="pt ${ptsClass(tier)}">${pts}p</span>` : ''}
          </div>`).join('')}
      </div>`;
  }

  return `
  <article class="derby reveal ${st === 'live' ? 'live' : ''} ${feat ? '' : 'plain'} ${m.derby ? 'hero-match' : ''}
           ${status ? 'st-' + status : ''}"
           ${feat ? 'data-tilt' : ''} style="--hc:${H.c1};--ac:${A.c1}">
    <div class="derby-top">
      <span class="tier ${b.cls}">${b.text}</span>
      <span class="mult ${m.derby ? 'hot' : m.comp !== 'SL' ? 'eu' : ''}">×${b.mult}</span>
      <span class="when">${fmtTime(m.dt)}</span>
      ${m.comp === 'SL' && !m.official ? '<span class="prov" title="Resmi fikstür girilene kadar geçici eşleşme">geçici</span>' : ''}
      ${pickChip}
      ${stateChip}
    </div>
    <div class="derby-body">
      <div class="matchup">
        <div class="side">
          <span class="crest-wrap">${crest(m.home, feat ? 42 : 34)}</span>
          <div class="info"><div class="nm">${H.name}</div>
            <div class="meta">${m.venue || 'EV SAHİBİ'}</div></div>
        </div>
        <div class="center">${center}</div>
        <div class="side away">
          <span class="crest-wrap">${crest(m.away, feat ? 42 : 34)}</span>
          <div class="info"><div class="nm">${A.name}</div><div class="meta">DEPLASMAN</div></div>
        </div>
      </div>
      ${pickArea}
      ${isAdmin() && st === 'open' ? `
        <div class="admin-box">
          <div class="lbl">🛠 Doğru skor oranları</div>
          <span style="font-size:11px;color:var(--faint);flex:1">
            ${oddsReady ? Object.keys(oddsInfo(m.id).scores).length + ' skor girili'
                        : 'girilmedi — maç kapalı'}
          </span>
          <button class="btn" onclick="openOddsModal('${m.id}')">
            ${oddsReady ? 'Düzenle' : 'Oran yapıştır'}
          </button>
        </div>` : ''}
      ${isAdmin() && st !== 'open' ? `
        <div class="admin-box">

/* Skor kutularının altındaki canlı ipucu: oran, çarpan, olası puan */
function oddsHintText(m, h, a){
  const i = oddsInfo(m.id);
  if (!i) return '';
  if (h === '' || a === '' || h == null || a == null){
    const fav = Object.keys(i.scores).reduce((b,k) => i.scores[k] < i.scores[b] ? k : b);
    return `<span class="dim">Bahisçinin favori skoru <b>${fav.replace(':','-')}</b>
            (${i.scores[fav].toFixed(2)}) · ondan saptıkça puan artar</span>`;
  }
  const o    = i.scores[`${+h}:${+a}`];
  const mult = scoreMult(m, +h, +a) * (m.mult || 1);
  return `${o ? `oran <b>${o.toFixed(2)}</b> · ` : `<span class="dim">listede yok · </span>`}
          çarpan <b>×${mult.toFixed(2)}</b> · tam isabet
          <b class="pt-10" style="font-family:var(--f-num);font-size:15px">${Math.round(10 * mult)}p</b>`;
}
function hintOdds(id){
  const el = document.getElementById('hint_' + id);
  if (el) el.innerHTML = oddsHintText(FIXTURE_BY_ID[id],
    document.getElementById('h_' + id).value,
    document.getElementById('a_' + id).value);
  refreshSaveButtons();
}

/* Bekleyen tahmin sayısını düğmelere yansıt — toplu kayıt görünür olsun */
function refreshSaveButtons(){
  const n = collectPicks().ready.length;
  document.querySelectorAll('button[data-save]').forEach(b => {
    const own = b.dataset.save;
    b.textContent = n > 1 ? `${n} tahmini kaydet`
                  : (myPredictions()[own] ? 'Güncelle' : 'Kaydet');
    b.classList.toggle('bulk', n > 1);
  });
}

/* ---------------- Toplu kaydetme ----------------
   Ekranda doldurulmuş BÜTÜN skor kutuları taranır. Hangi kartın
   düğmesine basıldığı fark etmez: on maça skor girip birine
   basarsan onu da diğer dokuzu da tek seferde kaydeder.        */
function collectPicks(){
  const my = myPredictions();
  const ready = [], bad = [];
  document.querySelectorAll('.pick input.num[id^="h_"]').forEach(hEl => {
    const id  = hEl.id.slice(2);
    const aEl = document.getElementById('a_' + id);
    if (!aEl) return;
    const hv = hEl.value.trim(), av = aEl.value.trim();
    if (hv === '' && av === '') return;               // hiç dokunulmamış
    const h = parseInt(hv), a = parseInt(av);
    if (isNaN(h) || isNaN(a)){ bad.push(id); return; } // yarım bırakılmış
    if (h < 0 || a < 0 || h > 20 || a > 20){ bad.push(id); return; }
    const cur = my[id];
    if (cur && cur.h === h && cur.a === a) return;      // zaten kayıtlı
    ready.push({ id, h, a });
  });
  return { ready, bad };
}

async function savePick(id, ev){
  if (!requireLogin()) return;
  const { ready, bad } = collectPicks();

  if (!ready.length){
    toast(bad.length ? 'Önce iki skoru da gir 🙂' : 'Kaydedilecek yeni tahmin yok');
    return;
  }

  const x = ev?.clientX, y = ev?.clientY;
  try {
    await setMyPredictions(ready);
  } catch(e){ toast('Kaydedilemedi: ' + (e.message || 'bağlantı hatası')); return; }

  if (x != null) confetti(x, y, ready.length > 3 ? 40 : 26);

  if (ready.length === 1){
    const p = ready[0], m = FIXTURE_BY_ID[p.id];
    toast(`<b>${TEAMS[m.home].name} ${p.h}–${p.a} ${TEAMS[m.away].name}</b> kaydedildi`);
  } else {
    toast(`<b>${ready.length} tahmin</b> kaydedildi${bad.length ? ` · ${bad.length} maç eksik` : ''}`);
  }
  render();
}

/* Yönetici: maç sonucu kaydet */
async function saveResult(id){
  const h = document.getElementById('rh_' + id).value;
  const a = document.getElementById('ra_' + id).value;
  if (h === '' || a === ''){ toast('İki skoru da gir'); return; }
  try { await setResult(id, h, a); }
  catch(e){ toast('Kaydedilemedi: ' + (e.message || '')); return; }

function matchList(){
  const all = filterFixtures(upcomingFixtures(), fTeam, fComp);
  const list = all.slice(0, shown);

  if (!all.length){
    return `<div class="card"><div class="empty"><span class="em">🔍</span>
      Bu filtreye uyan yaklaşan maç yok.</div></div>`;
  }

  let html = '', lastDay = null;
  list.forEach(m => {
    const k = dayKey(m.dt);
    if (k !== lastDay){
      lastDay = k;
      const sameDay = all.filter(x => dayKey(x.dt) === k).length;
      const today = k === dayKey(NOW().toISOString());
      html += `<div class="daygroup ${today ? 'today' : ''}">
        <span class="d">${fmtDayHeader(m.dt)}</span>
        <span class="n">${sameDay} maç</span>
        <span class="rule"></span></div>`;
    }
    html += matchCard(m);
  });

  if (all.length > shown){
    html += `<button class="btn ghost" onclick="P_tahmin.showMore()" style="width:100%;margin-top:6px">
      ${all.length - shown} maç daha göster ▾
    </button>`;
  }
  return html;
}

async function pickSeason(kind, val){
  if (!requireLogin()) return;
  const cfg = SEASON_PICKS[kind];
  const label = v => TEAMS[v]?.name || v;

  if (cfg.kind === 'multi'){
    const cur = Array.isArray(mySeason()[kind]) ? [...mySeason()[kind]] : [];
    const at  = cur.indexOf(val);
    if (at >= 0){
      cur.splice(at, 1);
    } else {
      if (cur.length >= cfg.max){
        toast(`En fazla <b>${cfg.max} takım</b> seçebilirsin — önce birini kaldır`);
        return;
      }
      cur.push(val);
    }
    await setMySeason(kind, cur);
    toast(cur.length ? `Küme düşme: <b>${cur.map(label).join(', ')}</b>` : 'Seçim temizlendi');
  } else {
    await setMySeason(kind, val);
    toast(`${cfg.title.replace('?','')} → <b>${label(val)}</b>`);
  }
  render();
}

/* ============================================================
   YÖNETİCİ — ORAN YAPIŞTIRMA
   Bahis sitesindeki doğru skor tablosunu seçip kopyala, buraya
   yapıştır. Metin biçimi önemli değil: "H:A  oran" ikililerini
   nerede olursa olsun bulur. Ev sahibi:deplasman sırası varsayılır.
   ============================================================ */
function parseOddsText(text){
  const out = {};
  /* skor, arada en fazla ~24 rakam-dışı karakter, sonra ONDALIKLI oran.
     Ondalık şartı sayesinde skor rakamları oranla karışmaz.          */
  const re = /(\d{1,2})\s*[:\-–]\s*(\d{1,2})[^\d]{0,24}?(\d{1,3}[.,]\d{1,2})/g;
  let mm;
  while ((mm = re.exec(text)) !== null){
    const h = +mm[1], a = +mm[2];
    const o = parseFloat(mm[3].replace(',', '.'));
    if (h > 20 || a > 20) continue;          // "21:30" gibi saatleri ele
    if (!(o > 1) || o > 5000) continue;
    const key = `${h}:${a}`;
    if (!(key in out)) out[key] = o;         // ilk görülen kazanır
  }
  return out;
}

/* Önizleme: kaç skor bulundu, hangi çarpanları üretiyor */
function oddsPreviewHtml(){
  const keys = Object.keys(oddsDraft);
  if (!keys.length){
    return `<div class="empty" style="padding:18px"><span class="em">📋</span>
      Henüz oran yok — yukarıya yapıştır.</div>`;
  }
  const m = FIXTURE_BY_ID[oddsMatchId];
  const min = Math.min(...keys.map(k => oddsDraft[k]));
  const sorted = keys.sort((x,y) => oddsDraft[x] - oddsDraft[y]);

  /* Geçici olarak taslağı kullanarak çarpan hesapla */
  const prev = Store.odds[oddsMatchId];
  Store.odds[oddsMatchId] = { scores: oddsDraft };
  const rows = sorted.map(k => {
    const [h,a] = k.split(':').map(Number);
    const mult = scoreMult(m, h, a) * (m.mult || 1);
    return `<div class="odds-row">
      <span class="s">${h}-${a}</span>
      <span class="o">${oddsDraft[k].toFixed(2)}</span>
      <span class="x">×${mult.toFixed(2)}</span>
      <span class="p">${Math.round(10 * mult)}p</span>
    </div>`;
  }).join('');
  const info = oddsInfo(oddsMatchId);
  const pct = s => Math.round(info.p[s] * 100);
  const outcomes = `${TEAMS[m.home].short || TEAMS[m.home].name} %${pct('H')} ·
                    Beraberlik %${pct('D')} ·
                    ${TEAMS[m.away].short || TEAMS[m.away].name} %${pct('A')}`;
  if (prev) Store.odds[oddsMatchId] = prev; else delete Store.odds[oddsMatchId];

  return `
    <div style="font-size:11.5px;color:var(--dim);margin:12px 0 8px">
      <b style="color:var(--cyan)">${keys.length} skor</b> okundu ·
      en kısa oran <b>${min.toFixed(2)}</b> (×1.00 referansı)<br>
      <span style="color:var(--faint)">${outcomes}</span>
    </div>
    <div class="odds-list">${rows}</div>`;
}

async function saveOddsDraft(){
  if (!Object.keys(oddsDraft).length){ toast('Önce oran yapıştır'); return; }
  try { await setOdds(oddsMatchId, oddsDraft); }
  catch(e){ toast('Kaydedilemedi: ' + (e.message || '')); return; }
  closeOdds();
  toast(`<b>${Object.keys(oddsDraft).length} oran</b> kaydedildi — maç tahmine açıldı`);
  window.render();
}

const GRAD_WORD  = 'LİGİ';

/* ============================================================
   ŞİMŞEK DÖNGÜSÜ
   Beyaz şimşek düşer, düştüğü noktada takımın tek renkli çizgi
   amblemi anında belirir ve bir sonraki şimşekten ÖNCE tamamen
   söner. Sıra hep aynı: GS → FB → BJK → TS → baştan.

   NOT: Amblemler kulüplerin resmi armaları değil; halka + monogram
   biçiminde sade işaretlerdir. Elinde çizgi SVG varsa MARKS içindeki
   çizim fonksiyonunu değiştirmen yeterli.
   ============================================================ */
const BOLT = { cycle:2600, flash:170, hold:520, fade:900 };
const MONO = { GS:'GS', FB:'FB', BJK:'BJK', TS:'TS' };
let boltRAF = null;

/* Şimşekte kullanılan gerçek armalar (doğrudan görsel adresleri).
   Renkleri atılıp beyaza çevrilir; renk hiç kullanılmaz. */
const MARK_SRC = {
  GS: 'https://upload.wikimedia.org/wikipedia/commons/thumb/4/49/Galatasaray_SK_football_logo.png/960px-Galatasaray_SK_football_logo.png',
  FB: 'https://upload.wikimedia.org/wikipedia/tr/thumb/8/86/Fenerbah%C3%A7e_SK.png/250px-Fenerbah%C3%A7e_SK.png',
  BJK:'https://upload.wikimedia.org/wikipedia/commons/thumb/d/da/BesiktasJK-Logo.svg/250px-BesiktasJK-Logo.svg.png',
  TS: 'https://upload.wikimedia.org/wikipedia/tr/a/ab/TrabzonsporAmblemi.png',
};

/* code -> hazırlanmış beyaz canvas | 'mono' (yedek monogram) | null (yükleniyor) */
const markCache = {};

/* Renkli armayı BEYAZ çizime çevirir.
   Saydamlık korunur, renk atılır: pikselin PARLAKLIĞI opaklığa dönüşür.
   Böylece koyu zeminli yuvarlak armalarda içteki açık renkli detaylar
   (harfler, yaprak, kartal) beyaz kalır, koyu gövde saydamlaşır —
   yani dolu bir leke yerine gerçek çizim görüntüsü çıkar. */
function toWhiteArt(im){
  const S = 256;
  const cv = document.createElement('canvas');
  cv.width = cv.height = S;
  const cx = cv.getContext('2d');
  const s = Math.min(S / im.naturalWidth, S / im.naturalHeight) * 0.94;
  const w = im.naturalWidth * s, h = im.naturalHeight * s;
  cx.drawImage(im, (S - w) / 2, (S - h) / 2, w, h);

  let img;
  try { img = cx.getImageData(0, 0, S, S); }
  catch(e){ return null; }                    // CORS engeli → monograma dön

  const p = img.data;
  const LO = 0.30, HI = 0.82;                 // kontrast penceresi
  for (let i = 0; i < p.length; i += 4){
    const a = p[i+3];
    /* ÖNCE parlaklığı oku — sonra pikseli beyaza boya.
       Sıra ters olursa parlaklık hep 1 çıkar ve arma dolu leke olur. */
    const lum = a ? (0.2126*p[i] + 0.7152*p[i+1] + 0.0722*p[i+2]) / 255 : 0;
    const v = Math.min(1, Math.max(0, (lum - LO) / (HI - LO)));
    p[i] = p[i+1] = p[i+2] = 255;
    p[i+3] = a ? Math.round(a * v) : 0;
  }
  cx.putImageData(img, 0, 0);
  return cv;
}
function prepareMark(code){
  if (markCache[code] !== undefined) return;
  markCache[code] = null;                      // yükleniyor
  const im = new Image();
  im.crossOrigin = 'anonymous';                // getImageData için şart
  im.onload  = () => { markCache[code] = toWhiteArt(im) || 'mono'; };
  im.onerror = () => { markCache[code] = 'mono'; };
  im.src = MARK_SRC[code];
}

/* Orta nokta kaydırmasıyla kırık çizgi üretir */
function boltPath(x0, y0, x1, y1, depth, jag){
  let pts = [{x:x0,y:y0},{x:x1,y:y1}];
  for (let d = 0; d < depth; d++){
    const next = [];
    for (let i = 0; i < pts.length - 1; i++){
      const a = pts[i], b = pts[i+1];
      const dx = b.x-a.x, dy = b.y-a.y, len = Math.hypot(dx,dy) || 1;
      const off = (Math.random()-0.5) * len * jag;
      next.push(a, { x:(a.x+b.x)/2 - dy/len*off, y:(a.y+b.y)/2 + dx/len*off });
    }
    next.push(pts[pts.length-1]);
    pts = next;
  }
  return pts;
}

function strokePath(ctx, pts, w, alpha){
  ctx.globalAlpha = alpha;
  ctx.lineWidth = w; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.beginPath();
  pts.forEach((p,i) => i ? ctx.lineTo(p.x,p.y) : ctx.moveTo(p.x,p.y));
  ctx.stroke();
}

/* Armanın arkasına siyah zemin: beyaz çizim her temada okunsun */
function drawBacking(ctx, x, y, r, alpha){
  const g = ctx.createRadialGradient(x, y, r*0.2, x, y, r*1.25);
  g.addColorStop(0,   `rgba(0,0,0,${0.82*alpha})`);
  g.addColorStop(0.72,`rgba(0,0,0,${0.68*alpha})`);
  g.addColorStop(1,   'rgba(0,0,0,0)');
  ctx.save(); ctx.globalAlpha = 1; ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, r*1.25, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

/* Gerçek arma (beyaza çevrilmiş) varsa onu, yoksa monogramı çizer */
function drawMark(ctx, code, x, y, r, alpha){
  const art = markCache[code];
  drawBacking(ctx, x, y, r, alpha);

  if (art && art !== 'mono'){
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.shadowColor = 'rgba(255,255,255,.5)';
    ctx.shadowBlur = r * 0.3;
    const d = r * 1.94;
    ctx.drawImage(art, x - d/2, y - d/2, d, d);
    ctx.restore();
    return;
  }

  /* Yedek: halka + monogram, tamamen beyaz çizgi */
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = '#fff';
  ctx.shadowColor = 'rgba(255,255,255,.6)';
  ctx.shadowBlur = r * 0.4;
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';

  ctx.lineWidth = Math.max(1.6, r * 0.055);
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.stroke();
  ctx.lineWidth = Math.max(1, r * 0.03);
  ctx.beginPath(); ctx.arc(x, y, r * 0.85, 0, Math.PI*2); ctx.stroke();

  /* Monogram kutuya sığana kadar küçült (BJK üç harf) */
  const txt = MONO[code] || code;
  let fs = r * 0.74;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let i = 0; i < 8; i++){
    ctx.font = `${fs.toFixed(1)}px Anton, Impact, sans-serif`;
    if (ctx.measureText(txt).width <= r * 1.34) break;
    fs *= 0.9;
  }
  ctx.lineWidth = Math.max(1.2, r * 0.042);
  ctx.strokeText(txt, x, y + r * 0.03);
  ctx.restore();
}

function startBolts(canvas){
  stopBolts();
  if (!canvas || !canvas.getContext) return;
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  BIG4.forEach(prepareMark);                  // armaları önden hazırla

  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, dpr = 1;
  const fit = () => {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = canvas.clientWidth; H = canvas.clientHeight;
    canvas.width = Math.round(W*dpr); canvas.height = Math.round(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
  };
  fit();

  let idx = 0, t0 = performance.now(), shot = null;

  /* Yeni bir şimşek: tepeden aşağı, çarpma noktası alt yarıda */
  const newShot = () => {
    const ix = W * (0.14 + Math.random()*0.72);
    const iy = H * (0.60 + Math.random()*0.26);
    const sx = ix + (Math.random()-0.5) * W * 0.30;
    const main = boltPath(sx, -10, ix, iy, 6, 0.34);
    const forks = [];
    for (let f = 0; f < 2; f++){
      const at = main[Math.floor(main.length * (0.35 + Math.random()*0.4))];
      forks.push(boltPath(at.x, at.y,
        at.x + (Math.random()-0.5)*W*0.22, at.y + H*0.18*Math.random(), 4, 0.4));
    }
    return { ix, iy, main, forks, r: Math.max(46, Math.min(94, Math.min(W,H)*0.115)) };
  };

  const frame = (now) => {
    if (!canvas.isConnected){ stopBolts(); return; }
    if (canvas.clientWidth !== W || canvas.clientHeight !== H) fit();

    let e = now - t0;
    if (e >= BOLT.cycle){ t0 = now; e = 0; idx = (idx+1) % BIG4.length; shot = null; }
    if (!shot) shot = newShot();

    ctx.clearRect(0,0,W,H);

    /* Şimşek: kısa, titrek, saf beyaz */
    if (e < BOLT.flash){
      const a = e < 42 ? 1 : e < 64 ? 0.28 : e < 112 ? 0.95 : 1 - (e-112)/(BOLT.flash-112);
      ctx.save();
      ctx.strokeStyle = '#fff';
      ctx.shadowColor = 'rgba(255,255,255,.85)'; ctx.shadowBlur = 18;
      strokePath(ctx, shot.main, 3.2, a);
      strokePath(ctx, shot.main, 1.2, a);
      shot.forks.forEach(f => strokePath(ctx, f, 1.6, a*0.7));
      /* çarpma parlaması */
      const g = ctx.createRadialGradient(shot.ix, shot.iy, 0, shot.ix, shot.iy, shot.r*1.9);
      g.addColorStop(0, `rgba(255,255,255,${0.5*a})`);
      g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.globalAlpha = 1; ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(shot.ix, shot.iy, shot.r*1.9, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }

    /* Amblem: şimşekle birlikte anında, sonra yumuşak sönüş */
    const a = e < BOLT.hold ? 1
            : e < BOLT.hold + BOLT.fade ? 1 - (e - BOLT.hold)/BOLT.fade : 0;
    if (a > 0) drawMark(ctx, BIG4[idx], shot.ix, shot.iy, shot.r, a);

    boltRAF = requestAnimationFrame(frame);
  };
  boltRAF = requestAnimationFrame(frame);
}

function stopBolts(){
  if (boltRAF) cancelAnimationFrame(boltRAF);
  boltRAF = null;
}

/* Fare hareketiyle ışık + hafif paralaks */
function initPointerFx(root){
  if (window.matchMedia('(hover: none)').matches) return;
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  let raf = null;
  root.addEventListener('pointermove', (e) => {
    if (raf) return;
    raf = requestAnimationFrame(() => {
      raf = null;
      const r = root.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width;
      const y = (e.clientY - r.top)  / r.height;
      root.style.setProperty('--mx', (x * 100).toFixed(1) + '%');
      root.style.setProperty('--my', (y * 100).toFixed(1) + '%');
      root.style.setProperty('--px', ((x - .5) * -14).toFixed(1) + 'px');
      root.style.setProperty('--py', ((y - .5) * -10).toFixed(1) + 'px');
      root.classList.add('lit');
    });
  });
  root.addEventListener('pointerleave', () => {
    root.classList.remove('lit');
    root.style.setProperty('--px', '0px');
    root.style.setProperty('--py', '0px');
  });
}

        <div><b>${derbies}</b><span>Derbi</span></div>

return { render, nextChip };

/* ===== hesaplayici.html — PUAN HESAPLAYICI ===== */
window.P_hesap = (function(){
/* ============================================================
   Sistemi anlatmak için kum havuzu. Hiçbir şey kaydedilmez.
   Oranı girilmiş GERÇEK maçlar üzerinde çalışır; böylece hem
   oran tablosu hem önem çarpanı maçın kendisinden gelir.
   ============================================================ */
let mid = null, done = false;
let P = { h:2, a:1 }, R = { h:2, a:0 };

/* Oranı girilmiş maçlar — yaklaşanlar önce */
function playable(){
  return FIXTURES.filter(hasOdds).sort((a,b) => {
    const ao = matchState(a) === 'open', bo = matchState(b) === 'open';
    if (ao !== bo) return ao ? -1 : 1;
    return new Date(a.dt) - new Date(b.dt);
  });
}

function currentMatch(){
  const list = playable();
  if (!list.length) return null;
  return list.find(m => m.id === mid) || list[0];
}

function setMatch(id){ mid = id; done = false; render(); }

const TIER_TEXT = {
  10:['Tam isabet','Skoru tam bildin.'],
  8: ['Neredeyse','Kazananı bildin, tek gol saptın.'],
  6: ['Doğru sonuç','Kazananı bildin ama skoru kaçırdın.'],
  2: ['Kıl payı','Tek gol saptın ama sonuç değişti.'],
  0: ['Tutmadı','Ne sonucu ne skoru tutturdun.'],
};

function calc(){
  const g = id => { const v = parseInt(document.getElementById(id).value); return isNaN(v) ? 0 : Math.max(0, Math.min(20, v)); };
  P = { h:g('d-ph'), a:g('d-pa') };
  R = { h:g('d-rh'), a:g('d-ra') };
  done = true;
  render();
  document.getElementById('d-out')?.scrollIntoView({ behavior:'smooth', block:'nearest' });
}

function resultPanel(){
  const m = currentMatch();
  const i = oddsInfo(m.id);
  const s = scorePrediction(P, R, m);
  const [name, why] = TIER_TEXT[s.tier] || TIER_TEXT[0];

  const compMult = m.mult;
  const rr = R.h > R.a ? 'H' : R.h < R.a ? 'A' : 'D';
  /* Çarpanı yuvarlanmış çarpımdan geri bölmek yerine doğrudan hesapla,
     yoksa hesaplayıcıda 10 × 1.94 × 2 = 39 gibi tutarsızlık görünür. */
  const oddsMult = s.tier >= 8 ? scoreMult(m, R.h, R.a)
                 : s.tier === 6 ? outcomeMult(m, rr) : 1;
  const rKey = `${R.h}:${R.a}`;
  const rOdds = i.scores[rKey];
  const outName = { H:'ev sahibi kazanır', D:'beraberlik', A:'deplasman kazanır' }[rr];

  /* Oran çarpanı nereden geldi? */
  const source = s.tier >= 8
    ? `Gerçekleşen skor <b>${R.h}-${R.a}</b>${rOdds ? ` oranı <b>${rOdds.toFixed(2)}</b>` : ' <b>listede yok</b>'}
       — maçın en kısa oranı ${i.min.toFixed(2)}.`
    : s.tier === 6
      ? `Gerçekleşen sonuç <b>${outName}</b>, bahisçiye göre ihtimali
         <b>%${Math.round(i.p[rr] * 100)}</b>.`
      : s.tier === 2 ? 'Bu basamakta oran çarpanı yok — düz 2 puan.'
                     : 'Puan yok.';

  /* Aynı tahminle başka sonuçlar ne getirirdi? */
  const tot = Object.values(i.scores).reduce((x,o) => x + 1/o, 0);
  const alt = Object.keys(i.scores)
    .sort((x,y) => i.scores[x] - i.scores[y]).slice(0, 8)
    .map(k => {
      const [h,a] = k.split(':').map(Number);
      const sc = scorePrediction(P, { h, a }, m);
      const isNow = h === R.h && a === R.a;
      return `<div class="dm-alt ${isNow ? 'now' : ''}">
        <span class="sk">${h}-${a}</span>
        <span class="ih">%${(100/i.scores[k]/tot).toFixed(1)}</span>
        <span class="tb ${ptsClass(sc.tier)}">${sc.tier || 0}</span>
        <span class="pz ${ptsClass(sc.tier)}">${sc.pts}p</span>
      </div>`;
    }).join('');

  return `
    <div class="dm-res ${s.pts ? '' : 'zero'}">
      <div class="big"><b>${s.pts}</b><span>puan</span></div>
      <div class="tier">
        <span class="pbadge pb-${s.tier}">${s.tier}p</span>
        <div><b>${name}</b><em>${why}</em></div>
      </div>
    </div>

    ${s.pts ? `

/* ===== oranlar.html — TOPLU ORAN GİRİŞİ (yönetici) ===== */
window.P_oranlar = (function(){
/* ============================================================
   Birden çok maçın oran tablosunu tek seferde alır.
   Yapıştırdığın metindeki TAKIM ADI başlıkları maçı kendisi bulur;
   maç seçmen gerekmez. Sıra "ev sahibi … deplasman" varsayılır,
   böylece ilk/ikinci devre maçı da doğru eşleşir.
   ============================================================ */

const TR_MAP = { 'ç':'c','ğ':'g','ı':'i','ö':'o','ş':'s','ü':'u','â':'a','î':'i','û':'u' };
const norm = s => (s || '').toLocaleLowerCase('tr')
  .replace(/[çğıöşüâîû]/g, c => TR_MAP[c] || c)
  .replace(/[^a-z0-9]+/g, ' ')
  .trim();

let needles = null;
function teamNeedles(){
  if (needles) return needles;
  const out = [];
  Object.keys(TEAMS).forEach(code => {
    [TEAMS[code].name, TEAMS[code].short].filter(Boolean).forEach(n => {
      const v = norm(n);
      if (v.length >= 3) out.push({ code, n: v });
    });
  });
  return needles = out.sort((a, b) => b.n.length - a.n.length);
}

/* Satırdaki takımları GÖRÜLDÜKLERİ SIRAYLA döndürür */
function teamsInLine(line){
  const hay = ' ' + norm(line) + ' ';
  const hits = [];
  teamNeedles().forEach(({ code, n }) => {
    if (hits.some(h => h.code === code)) return;
    const at = hay.indexOf(' ' + n + ' ');
    if (at !== -1) hits.push({ code, at });
  });
  return hits.sort((a, b) => a.at - b.at).map(h => h.code);
}

/* Verilen takımlara uyan, tahmine açılabilir en yakın maç */
function fixtureFor(codes){
  const cand = FIXTURES.filter(m => matchState(m) === 'open' &&
    codes.includes(m.home) && codes.includes(m.away));
  if (!cand.length) return null;
  /* Ev sahibi sırası tutan varsa onu seç (ilk/ikinci devre ayrımı) */
  const exact = cand.filter(m => codes.indexOf(m.home) < codes.indexOf(m.away));
  return (exact[0] || cand[0]);
}

/* Metni maç bloklarına böler ve her bloğun oranlarını okur */
function parseBulk(text){
  const lines = text.split(/\r?\n/);
  const blocks = [];
  let cur = null, pending = [];

  lines.forEach(line => {
    const hasScore = /\d{1,2}\s*[:\-–]\s*\d{1,2}/.test(line) && /\d[.,]\d/.test(line);
    const codes = hasScore ? [] : teamsInLine(line);

    if (codes.length){
      pending = [...pending, ...codes].slice(-4);
      const fx = fixtureFor(pending);
      if (fx && (!cur || cur.fx.id !== fx.id)){
        cur = { fx, lines: [] };
        blocks.push(cur);
        pending = [];
      }
      return;
    }
    if (cur) cur.lines.push(line);
  });

  return blocks
    .map(b => ({ fx: b.fx, scores: parseOddsText(b.lines.join('\n')) }))
    .filter(b => Object.keys(b.scores).length);
}

let found = [];

function analyse(){
  found = parseBulk(document.getElementById('bulk-in').value);
  document.getElementById('bulk-out').innerHTML = resultHtml();
}

const MIN_SCORES = 12;   // bunun altı büyük ihtimalle yarım kopyalanmış

function resultHtml(){
  const openNoOdds = FIXTURES.filter(m => matchState(m) === 'open' && !hasOdds(m));

  if (!found.length){
    return `<div class="empty" style="padding:22px"><span class="em">📋</span>
      Henüz maç çözümlenmedi.<br>
      <span style="font-size:11px;color:var(--faint)">Tabloyu <b>takım adı başlığıyla birlikte</b>
      kopyaladığından emin ol — maçı o başlıktan tanıyor.</span></div>
      ${missingHtml(openNoOdds)}`;
  }

  const rows = found.map((b, idx) => {
    const n = Object.keys(b.scores).length;
    const min = Math.min(...Object.values(b.scores));
    const fav = Object.keys(b.scores).find(k => b.scores[k] === min);
    const thin = n < MIN_SCORES;
    return `
      <div class="bulk-row">
        <span class="ok">${thin ? '⚠️' : '✓'}</span>
        <span class="nm">
          <b>${TEAMS[b.fx.home].name} – ${TEAMS[b.fx.away].name}</b>
          <em>${fmtDateShort(b.fx.dt)} · ${b.fx.comp === 'SL' ? b.fx.wk + '. hafta' : COMPS[b.fx.comp].short}</em>
        </span>
        <span class="ct ${thin ? 'warn' : ''}">${n} skor</span>
        <span class="fav">favori ${fav.replace(':','-')} · ${min.toFixed(2)}</span>
        <button class="linkbtn" style="margin:0" onclick="P_oranlar.drop(${idx})">çıkar</button>
      </div>
      ${thin ? `<div class="bulk-warn">Bu tablo eksik görünüyor (${n} skor).
        Eksik skorlar en yüksek çarpanı alır — tabloyu tam kopyaladığından emin ol.</div>` : ''}`;
  }).join('');

  const stillMissing = openNoOdds.filter(m => !found.some(b => b.fx.id === m.id));

  return `
    <div style="font-size:12px;color:var(--dim);margin:14px 0 8px">
      <b style="color:var(--cyan)">${found.length} maç</b> tanındı
    </div>
    <div class="bulk-list">${rows}</div>
    <button class="btn" style="width:100%;margin-top:14px"
            onclick="P_oranlar.saveAll()">${found.length} maçın oranlarını kaydet ve aç</button>
    ${missingHtml(stillMissing)}`;
}

function missingHtml(list){
  if (!list.length) return '';
  return `
    <div class="note" style="margin-top:16px">
      <span>🗓</span>
      <span><b>Hâlâ oransız ${list.length} maç:</b><br>
      <span style="color:var(--faint);font-size:11px">
        ${list.slice(0, 12).map(m => `${TEAMS[m.home].short || TEAMS[m.home].name}–${TEAMS[m.away].short || TEAMS[m.away].name}
          <span style="opacity:.6">(${fmtDateShort(m.dt)})</span>`).join(' · ')}
        ${list.length > 12 ? ` … +${list.length - 12}` : ''}
      </span></span>
    </div>`;
}

function drop(i){ found.splice(i, 1); document.getElementById('bulk-out').innerHTML = resultHtml(); }

async function saveAll(){
  if (!found.length) return;
  let ok = 0, fail = 0;
  for (const b of found){
    try { await setOdds(b.fx.id, b.scores); ok++; }
    catch(e){ fail++; console.warn('oran kaydedilemedi', b.fx.id, e); }
  }
  toast(fail ? `<b>${ok} maç</b> kaydedildi · ${fail} başarısız`
             : `<b>${ok} maç</b> tahmine açıldı 🎉`);
  found = [];
  document.getElementById('bulk-in').value = '';
  render();
}

function render(){
  if (!isAdmin()){
    document.getElementById('app').innerHTML = `
      <div class="sec-title" style="margin-top:26px"><h3>Toplu Oran Girişi</h3><span class="rule"></span></div>
      <div class="card"><div class="empty"><span class="em">🔒</span>
        Bu sayfa yalnızca yöneticiye açık.</div></div>`;
    return;
  }
  document.getElementById('app').innerHTML = `
    <div class="sec-title" style="margin-top:26px"><h3>Toplu Oran Girişi</h3><span class="rule"></span></div>
    <div class="card">
      <div class="card-pad">
        <div class="note" style="margin-bottom:14px">
          <span>📋</span>
          <span>Bahis sitesinde her maçın <b>doğru skor</b> tablosunu
          <b>takım adı başlığıyla birlikte</b> seçip kopyala ve arka arkaya buraya yapıştır.
          Maçları başlıktaki takım adlarından kendisi tanır — tek tek seçmen gerekmez.</span>
        </div>
        <textarea id="bulk-in" class="odds-ta" style="min-height:200px"
          placeholder="Galatasaray      Berabere      Çorum FK&#10;1:0   7.00      0:0   15.00     0:1   26.00&#10;2:0   6.00      1:1   11.00     0:2   61.00&#10;…&#10;&#10;Fenerbahçe       Berabere      Konyaspor&#10;1:0   5.50      0:0   12.00     0:1   21.00&#10;…"
          oninput="P_oranlar.analyse()"></textarea>
        <div id="bulk-out">${resultHtml()}</div>
      </div>
    </div>`;
  initReveal();
}

return { render, analyse, drop, saveAll };
