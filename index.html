/* ============================================================
   TEMA SEÇİCİ
   Yeni tema eklemek için: style.css'e [data-theme="ad"] bloğu
   yaz, sonra buraya bir satır ekle. `bg` ve `sw` sadece
   listedeki önizleme içindir.
   ============================================================ */
const THEMES = [
  { key:'obsidyen', name:'Obsidyen',  bg:'#06060c', sw:'linear-gradient(115deg,#29d6ee,#7c6cff,#e8479f)' },
  { key:'gece',     name:'Gece Mavisi',bg:'#04070f', sw:'linear-gradient(115deg,#2fd8f5,#4b7dfb,#7b5cf0)' },
  { key:'bordo',    name:'Bordo Gece', bg:'#0a0509', sw:'linear-gradient(115deg,#f4a261,#d11d47,#ff4d8d)' },
  { key:'grafit',   name:'Grafit',     bg:'#0b0b0d', sw:'linear-gradient(115deg,#ffc93c,#ff8c42,#ff5e5b)' },
  { key:'ametist',  name:'Ametist',    bg:'#090514', sw:'linear-gradient(115deg,#4cc9f0,#9d4edd,#f72585)' },
  { key:'celik',    name:'Çelik',      bg:'#0a0c0f', sw:'linear-gradient(115deg,#cfe3f5,#7f9cc0,#5fd0e0)' },
];
const THEME_KEY = 'dortbuyuk-tema';

function applyTheme(key){
  const t = THEMES.find(x => x.key === key) || THEMES[0];
  if (t.key === 'obsidyen') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t.key);
  try { localStorage.setItem(THEME_KEY, t.key); } catch(e){}
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', t.bg);
  document.querySelectorAll('.theme-list button').forEach(b =>
    b.classList.toggle('on', b.dataset.theme === t.key));
}
const DEFAULT_THEME = 'grafit';          // varsayılan tema
function currentTheme(){
  try { return localStorage.getItem(THEME_KEY) || DEFAULT_THEME; } catch(e){ return DEFAULT_THEME; }
}
function mountThemeDock(){
  document.body.insertAdjacentHTML('beforeend', `
    <div class="theme-dock" id="themeDock">
      <div class="theme-list">
        ${THEMES.map(t => `<button data-theme="${t.key}" onclick="applyTheme('${t.key}')">
          <span class="sw" style="background:${t.sw}"></span><span class="nm">${t.name}</span>
        </button>`).join('')}
      </div>
      <button class="theme-btn" onclick="document.getElementById('themeDock').classList.toggle('open')">
        <span class="dot"></span><span>Tema</span>
      </button>
    </div>`);
  applyTheme(currentTheme());

  document.addEventListener('click', (e) => {
    const dock = document.getElementById('themeDock');
    if (dock && !dock.contains(e.target)) dock.classList.remove('open');
  });
}

/* ---------- Kayan filtre şeritlerinin kenar solması ----------
   Şerit gerçekten taşıyorsa taştığı yönde solar; sığıyorsa hiç solmaz.
   Dinleyici doğrudan şeridin kendisine takılır — şeritler her çizimde
   yeniden yaratıldığından işaret düğümün üstünde tutulur.            */
function paintFilterFade(row){
  const more = row.scrollWidth - row.clientWidth;
  row.classList.toggle('fd-s', row.scrollLeft > 6);
  row.classList.toggle('fd-e', more > 6 && row.scrollLeft < more - 6);
}
function syncFilterFade(root = document){
  root.querySelectorAll('.filterbar .row').forEach(row => {
    if (!row.__fade){
      row.__fade = true;
      row.addEventListener('scroll', () => paintFilterFade(row), { passive:true });
    }
    paintFilterFade(row);
  });
}
function initFilterFade(root = document){
  syncFilterFade(root);
  if (initFilterFade.hazir) return;
  initFilterFade.hazir = true;
  /* Pencere boyu değişince taşma durumu da değişir */
  window.addEventListener('resize', () => syncFilterFade());
}

/* ---------- Görünüme girince belirme ---------- */
/* Her sayfa çiziminden sonra çağrılan ortak kanca */
function initReveal(root = document){
  initFilterFade(root);
  const els = root.querySelectorAll('.reveal:not(.in)');
  if (!('IntersectionObserver' in window)){ els.forEach(e => e.classList.add('in')); return; }
  const io = new IntersectionObserver((entries) => {
    entries.forEach((e, i) => {
      if (!e.isIntersecting) return;
      const el = e.target;
      setTimeout(() => el.classList.add('in'), Math.min(i * 55, 240));
      io.unobserve(el);
    });
  }, { rootMargin:'0px 0px -8% 0px', threshold:.06 });
  els.forEach(el => io.observe(el));
}

/* ---------- Kartlarda 3B eğilme ---------- */
function initTilt(root = document){
  if (window.matchMedia('(hover: none)').matches) return;
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  root.querySelectorAll('[data-tilt]').forEach(card => {
    if (card.__tilt) return;
    card.__tilt = true;
    let raf = null;

    const move = (ev) => {
      if (raf) return;
      raf = requestAnimationFrame(() => {
        raf = null;
        const r = card.getBoundingClientRect();
        const px = (ev.clientX - r.left) / r.width  - .5;
        const py = (ev.clientY - r.top)  / r.height - .5;
        card.style.transform =
          `perspective(1000px) rotateX(${(-py * 4).toFixed(2)}deg) rotateY(${(px * 5).toFixed(2)}deg) translateY(-3px)`;
      });
    };
    const leave = () => { card.style.transform = ''; };

    card.addEventListener('mousemove', move);
    card.addEventListener('mouseleave', leave);
  });
}

/* ---------- Buton dalgası ---------- */
document.addEventListener('click', (e) => {
  const btn = e.target.closest('.btn, .pill, .team-opt');
  if (!btn) return;
  const r = btn.getBoundingClientRect();
  const size = Math.max(r.width, r.height);
  const s = document.createElement('span');
  s.className = 'ripple';
  s.style.width = s.style.height = size + 'px';
  s.style.left = (e.clientX - r.left - size / 2) + 'px';
  s.style.top  = (e.clientY - r.top  - size / 2) + 'px';
  btn.appendChild(s);
  setTimeout(() => s.remove(), 620);
});

/* ---------- Sayaç animasyonu ---------- */
function countUp(el, to, dur = 900){
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches){ el.textContent = to; return; }
  const from = 0, t0 = performance.now();
  const tick = (t) => {
    const k = Math.min((t - t0) / dur, 1);
    const eased = 1 - Math.pow(1 - k, 3);
    el.textContent = Math.round(from + (to - from) * eased);
    if (k < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
function initCounters(root = document){
  const els = [...root.querySelectorAll('[data-count]')];
  if (!('IntersectionObserver' in window)){ els.forEach(el => el.textContent = el.dataset.count); return; }
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      countUp(e.target, +e.target.dataset.count);
      io.unobserve(e.target);
    });
  }, { threshold:.4 });
  els.forEach(el => io.observe(el));
}

/* ---------- Bildirim ---------- */
let toastTimer = null;
function toast(msg){
  let el = document.getElementById('toast');
  if (!el){
    el = document.createElement('div');
    el.id = 'toast';
    document.body.appendChild(el);
  }
  el.innerHTML = `<span class="bar"></span><span>${msg}</span>`;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

/* ---------- Konfeti ---------- */
function confetti(x, y, n = 26){
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const colors = ['#29d6ee','#7c6cff','#e8479f','#a855f7','#f7c95a','#ffffff'];
  for (let i = 0; i < n; i++){
    const p = document.createElement('i');
    p.className = 'confetti';
    p.style.left = x + 'px';
    p.style.top  = y + 'px';
    p.style.background = colors[i % colors.length];
    document.body.appendChild(p);

    const ang  = (Math.PI * 2 * i) / n + Math.random() * .6;
    const vel  = 90 + Math.random() * 150;
    const dx   = Math.cos(ang) * vel;
    const dy   = Math.sin(ang) * vel - 120;
    const spin = (Math.random() * 900 - 450) + 'deg';

    p.animate([
      { transform:'translate(0,0) rotate(0deg)', opacity:1 },
      { transform:`translate(${dx}px, ${dy + 320}px) rotate(${spin})`, opacity:0 },
    ], { duration: 1000 + Math.random() * 700, easing:'cubic-bezier(.15,.7,.35,1)' })
     .onfinish = () => p.remove();
  }
}

/* ---------- Canlı geri sayım ----------
   Sayfa her yeniden çizildiğinde (filtre, kayıt, gezinme) buraya
   tekrar gelinir. Eskisini durdurmazsak her çizimde bir zamanlayıcı
   daha birikir ve kopmuş DOM düğümlerine yazmaya devam eder. */
let cdInterval = null;
function startCountdown(target, els){
  clearInterval(cdInterval);
  const tick = () => {
    if (!els.d || !els.d.isConnected){ clearInterval(cdInterval); return; }
    const t = timeParts(new Date(target).getTime() - NOW().getTime());
    els.d.textContent = String(t.d);
    els.h.textContent = String(t.h).padStart(2,'0');
    els.m.textContent = String(t.m).padStart(2,'0');
    els.s.textContent = String(t.s).padStart(2,'0');
  };
  tick();
  // DEMO_NOW sabitken saniye akmaz; canlıya alınca kendiliğinden çalışır
  if (!DEMO_NOW) cdInterval = setInterval(tick, 1000);
}

/* ---------- Canlı sonuç akışı ----------
   Yönetici skoru güncellediğinde herkesin ekranı yenilensin diye.
   İki koruma var:
     · Veri gerçekten değişmediyse çizim yapılmaz (kendi yazdığımız
       skor geri geldiğinde boşuna yenilememek için).
     · Bir kutuya yazı yazılıyorsa çizim ertelenir — yönetici skoru
       girerken alan altından kayıp yazdığı rakam silinmesin.        */
let sonucAbone = null, sonucBekleyen = null, medyaAbone = null;
function watchResults(render){
  if (!window.Cloud?.watchResults) return;      // demo modda gerek yok
  sonucAbone?.();

  /* Çizimi ertele: veri her hâlükârda güncel: yalnızca yeniden
     boyama bekler, böylece hesaplar doğru kalırken imleç kaçmaz. */
  const ciz = () => {
    const yaziliyor = document.activeElement &&
      /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
    clearTimeout(sonucBekleyen);
    if (yaziliyor){ sonucBekleyen = setTimeout(ciz, 4000); return; }
    render();
  };

  sonucAbone = window.Cloud.watchResults(yeni => {
    if (JSON.stringify(yeni) === JSON.stringify(Store.results)) return;
    Store.results = yeni;
    ciz();
  });

  /* Video da canlı dinlenir: yönetici klibi iliştirince herkeste
     kendiliğinden belirsin, kimse sayfayı yenilemek zorunda kalmasın.
     Aynı çizim ertelemesini paylaşır. */
  medyaAbone?.();
  medyaAbone = window.Cloud.watchMedia?.(yeni => {
    if (JSON.stringify(yeni) === JSON.stringify(Store.media)) return;
    Store.media = yeni;
    ciz();
  });
}

/* ---------- Sayfa açılış ---------- */
async function boot(activePage, render){
  applyTheme(currentTheme());        // ilk boyamadan önce temayı uygula
  mountChrome(activePage);
  document.getElementById('app').innerHTML =
    `<div class="empty" style="padding:80px 20px">Yükleniyor…</div>`;

  await waitForCloud();
  await initStore();

  render();
  mountFooter();
  mountThemeDock();
  refreshAuthChip();
  initReveal();
  initTilt();
  initCounters();
  watchDeli(render);                 // Deli fikir değiştirdikçe tazele
  watchResults(render);              // gol girilince herkeste tazele

  // oturum değişince (başka sekmede çıkış vb.) tazele
  window.Cloud?.onChange(async () => {
    await initStore(); refreshAuthChip(); render();
  });
}

/* cloud.js bir modül olduğu için gecikmeli yüklenir; kısa süre bekle */
function waitForCloud(){
  if (!document.querySelector('script[data-cloud]')) return Promise.resolve();
  if (window.__cloudReady) return Promise.resolve();
  return new Promise(res => {
    const done = () => { window.__cloudReady = true; res(); };
    window.addEventListener('cloud-auth', done, { once:true });
    setTimeout(done, 3500);            // bağlanamazsa demo moduna düş
  });
}

</script>
<script>
/* ============================================================
   DÖRT BÜYÜK 26/27 — Giriş arayüzü
   Bulut açıkken gerçek Firebase hesabı, demo modda tarayıcıda
   saklanan yerel bir takma ad ile çalışır.
   ============================================================ */

let authTab = 'login';   // 'login' | 'signup' | 'reset'

/* ---------- Üst çubuktaki kullanıcı alanı ---------- */
/* Mobilde yalnızca yuvarlak simge kalır (etiket üst çubuğu taşırıyordu),
   bu yüzden düğmenin adı aria-label ile ayrıca yazılır. */
function authChipHtml(){
  const me = Store.me;

/* Firebase hata kodlarını okunur Türkçeye çevirir */
function authError(e){
  const c = (e && e.code) || '';
  if (c.includes('invalid-credential') || c.includes('wrong-password') ||
      c.includes('user-not-found')) return 'E-posta veya şifre hatalı.';
  if (c.includes('email-already-in-use')) return 'Bu e-posta zaten kayıtlı.';
  if (c.includes('weak-password'))        return 'Şifre en az 6 karakter olmalı.';
  if (c.includes('invalid-email'))        return 'E-posta adresi geçersiz.';
  if (c.includes('too-many-requests'))    return 'Çok fazla deneme. Biraz sonra tekrar dene.';
  if (c.includes('network'))              return 'Bağlantı kurulamadı.';
  return e?.message || 'Bir şeyler ters gitti.';
}

async function doLogin(){
  const demo = !window.Cloud?.enabled;

    const name = (document.getElementById('au-name')?.value || '').trim();

  if (!email || !pass) return authMsg('E-posta ve şifre gerekli.');

  try {
    await window.Cloud.login(email, pass);

    toast('Hoş geldin');
    await reloadAfterAuth();
  } catch(e){ authMsg(authError(e)); }

/* ============================================================
   OYUNCU PROFİLİ — puan tablosunda bir satıra tıklayınca açılır
   ============================================================ */

/* Oynanmış maçlar boyunca biriken puan */
function progressionOf(uid){
  const preds = Store.predictions[uid] || {};
  const out = [];
  let cum = 0;
  FIXTURES.forEach(m => {
    if (!isFinished(m) || !Store.results[m.id]) return;
    const p = preds[m.id];
    if (!p) return;
    const s = scorePrediction(p, Store.results[m.id], m);
    cum += s.pts;
    out.push({ m, pred:p, res:Store.results[m.id], got:s.pts, tier:s.tier, cum });
  });
  return out;
}

/* Tek serili birikimli puan grafiği.
   Tek seri olduğu için gösterge (legend) yok — başlık zaten neyi
   gösterdiğini söylüyor. Renk siteyle aynı vurgu değişkeninden gelir,
   böylece altı temada da doğru görünür. */
function progressionChart(rows){
  if (rows.length < 2) return '';
  const W = 340, H = 116, PL = 6, PR = 34, PT = 10, PB = 18;
  const max = Math.max(...rows.map(r => r.cum), 1);
  const x = i => PL + (i / (rows.length - 1)) * (W - PL - PR);
  const y = v => PT + (1 - v / max) * (H - PT - PB);

  const line = rows.map((r,i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(r.cum).toFixed(1)}`).join(' ');
  const area = `${line} L${x(rows.length-1).toFixed(1)} ${y(0)} L${x(0).toFixed(1)} ${y(0)} Z`;

  /* Yatay kılavuz: geri planda, üçte bir aralıklarla */
  const grid = [0.5, 1].map(f => `<line x1="${PL}" x2="${W-PR}" y1="${y(max*f).toFixed(1)}"
    y2="${y(max*f).toFixed(1)}" stroke="currentColor" stroke-opacity=".08" stroke-width="1"/>`).join('');

  /* Her nokta için görünmez, parmak dostu vuruş alanı */
  const hit = rows.map((r,i) => `
    <circle cx="${x(i).toFixed(1)}" cy="${y(r.cum).toFixed(1)}" r="9" fill="transparent"
      style="cursor:pointer" onmouseenter="showProgTip(event, ${i})" onmouseleave="hideProgTip()"
      onclick="showProgTip(event, ${i})"></circle>`).join('');

  const last = rows[rows.length - 1];
  return `
    <div class="prog-wrap">
      <svg class="prog" viewBox="0 0 ${W} ${H}" role="img"
           aria-label="Sezon boyunca biriken puan: ${last.cum}">
        <defs>
          <linearGradient id="progFill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="var(--iris)" stop-opacity=".28"/>
            <stop offset="1" stop-color="var(--iris)" stop-opacity="0"/>
          </linearGradient>
        </defs>
        ${grid}
        <path d="${area}" fill="url(#progFill)"/>
        <path d="${line}" fill="none" stroke="var(--iris)" stroke-width="2"
              stroke-linejoin="round" stroke-linecap="round"/>
        <circle cx="${x(rows.length-1).toFixed(1)}" cy="${y(last.cum).toFixed(1)}" r="4"
                fill="var(--iris)" stroke="var(--bg)" stroke-width="2"/>
        <text x="${W-PR+7}" y="${(y(last.cum)+4).toFixed(1)}" fill="var(--text)"
              font-family="var(--f-num)" font-size="15">${last.cum}</text>
        ${hit}
      </svg>
      <div class="prog-tip" id="progTip"></div>
      <div class="prog-x"><span>${fmtDateShort(rows[0].m.dt)}</span>
        <span>${rows.length} maç</span>
        <span>${fmtDateShort(last.m.dt)}</span></div>
    </div>`;
}

let progRows = [];
function showProgTip(ev, i){
  const r = progRows[i], tip = document.getElementById('progTip');
  if (!r || !tip) return;
  const H = TEAMS[r.m.home], A = TEAMS[r.m.away];
  tip.innerHTML = `<b>${H.short || H.name} ${r.res.h}-${r.res.a} ${A.short || A.name}</b>
    <span>Tahmin ${r.pred.h}-${r.pred.a} · <b class="${ptsClass(r.tier)}">+${r.got}p</b>
    · toplam ${r.cum}</span>`;
  const box = tip.parentElement.getBoundingClientRect();
  const dot = ev.target.getBoundingClientRect();
  const left = dot.left - box.left + dot.width / 2;
  tip.style.left = Math.max(4, Math.min(box.width - 4, left)) + 'px';
  tip.classList.add('on');
}
function hideProgTip(){ document.getElementById('progTip')?.classList.remove('on'); }

function openProfile(uid){
  const rows = leaderboard();
  const me = rows.find(r => r.uid === uid);
  if (!me) return;
  progRows = progressionOf(uid);

  let el = document.getElementById('profileModal');
  if (!el){
    el = document.createElement('div');
    el.id = 'profileModal'; el.className = 'modal';
    el.addEventListener('click', e => { if (e.target === el) closeProfile(); });
    document.body.appendChild(el);
  }

  const best = [...progRows].sort((a,b) => b.got - a.got)[0];
  const recent = [...progRows].reverse().slice(0, 8);

  /* ---- Ünvan tahtası ----
     Yalnızca "bende olanlar" değil, ünvanların TAMAMI listelenir:
     her birinin şu an kimde olduğu ve kaçla tutulduğu görünür.
     Sebebi basit — ünvan tek kişilik olduğu için asıl bilgi
     "geçmek için kaç lazım". Sahibi bu oyuncuysa satır vurgulanır,
     boştaki ünvanlar ise "sahipsiz" olarak durur.               */
  const stats = achievementStats(rows);
  const tahta = titleBoard(rows, stats);
  const bende = tahta.filter(t => t.tutan && t.tutan.uid === uid);

  /* Sağdaki etiket İKİ ayrı soruyu ayırt etmeli:
       · ünvanı GİRİŞ YAPAN mı taşıyor   → "sende"
       · bakılan PROFİL mi taşıyor       → o kişinin adı, vurgulu
     Eskiden tek karşılaştırma vardı ve sahibi bakılan profille
     kıyaslanıyordu; başkasının profiline girince onun ünvanları
     "sende" diye görünüyordu. İkisi artık ayrı değişken.        */
  const benimUid = Store.me && !Store.me.anon ? Store.me.uid : null;

  const satir = (t) => {
    const bos    = !t.tutan;
    const sahip  = bos ? null : t.tutan.uid;
    const benimMi   = !bos && benimUid && sahip === benimUid;   // giriş yapan taşıyor
    const profilinMi = !bos && sahip === uid;                   // bakılan kişi taşıyor
    const sahipAdi = bos ? '' : (rows.find(r => r.uid === sahip)?.name || '—');
    const kim = bos ? 'sahipsiz' : benimMi ? 'sende' : sahipAdi;
    const etiketSinif = benimMi ? 'you' : profilinMi ? 'owner' : '';
    /* Bot profilinde girilemeyen dallar soluk durur. Tek tek "botlar
       yarışmaz" yazmıyoruz — 19 satırda aynı cümle gürültü olurdu;
       açıklama bölümün başında bir kez veriliyor. */
    const disarida = me.ai && !t.botaAcik;
    return `<div class="tl ${profilinMi ? 'mine' : ''} ${bos ? 'free' : ''} ${
              disarida ? 'disarida' : ''} ${profilinMi ? 'ach-' + t.id : ''}">
      <i>${t.emoji}</i>
      <div class="tl-b">
        <b>${t.ad}</b>
        <em>${t.tutan ? t.baslikKisa : 'bu dalda henüz kimse yok'}</em>
      </div>
      <span class="tl-who ${etiketSinif}" ${
        !bos && !benimMi ? `title="${sahipAdi} taşıyor"` : ''}>${kim}</span>
    </div>`;
  };
  /* Kısa açıklama: uzun ipucu satıra sığmıyor, sayıyı öne al */
  tahta.forEach(t => { t.baslikKisa = t.tutan
    ? (t.olcut === 'enBuyukOran' ? t.tutan.sayi.toFixed(2) : t.tutan.sayi) + ' ile tutuyor'
    : ''; });

  /* Bot profilinde sayaç "1/20" değil "1/1" olmalı: girebildiği tek
     dal var, 20 üzerinden saymak hiç kazanamıyormuş gibi gösterirdi. */
  const acikDal = me.ai ? TITLES.filter(t => t.botaAcik).length : TITLES.length;

  const rozetHtml = `
    <div class="pf-h">Ünvanlar
      <span class="pf-count">${bende.length}/${acikDal}</span></div>
    <div class="pf-note">${me.ai
      ? `Yapay zekâ oyuncular ünvan toplamaz — her maça tahmin yazdıkları
         için çoğu dalda haksız üstünlükleri olurdu. Yarışabildikleri tek
         dal <b>Son Maçın Kralı</b>; o da her maç el değiştiriyor.`
      : `Her ünvan tek kişide durur. Almak için sahibini
         <b>geçmen</b> gerekir — eşitlemek yetmez.`}</div>
    <div class="tl-list">${tahta.map(satir).join('')}</div>`;

  /* Başkasının sezon seçimi kilit açılana kadar gizli; kendi profilinde görünür */
  const mine = Store.me && Store.me.uid === uid;
  const seasonHtml = Object.keys(SEASON_PICKS).map(k => {
    const v = me.season?.[k], cfg = SEASON_PICKS[k];
    const has = Array.isArray(v) ? v.length > 0 : !!v;
    const hidden = !mine && !canSeeSeason(k);
    const txt = hidden ? `<em>${has ? 'seçildi' : 'seçilmedi'}</em>`
      : !has ? '<em>seçilmedi</em>'
      : (Array.isArray(v) ? v : [v]).map(x => TEAMS[x]?.name || x).join(', ');
    const got = seasonPoints(k, v, SEASON_RESULT[k]);
    return `<div class="pf-season">
      <span class="k">${seasonMark(cfg, 13)} ${cfg.title}</span>
      <span class="v">${txt}${got ? ` <b style="color:var(--cyan)">+${got}p</b>` : ''}</span>
    </div>`;
  }).join('');

  el.innerHTML = `<div class="modal-card" style="max-width:480px">
    <button class="modal-x" onclick="closeProfile()" aria-label="Kapat">✕</button>
    <div class="modal-head">
      <span class="brand-mark" style="font-size:16px">${
        me.ai ? me.emoji : (me.name||'?').charAt(0).toLocaleUpperCase('tr')}</span>
      <div>
        <div class="modal-title">${me.name}${me.you ? ' (sen)' : ''}${
          me.ai ? '<span class="ai-tag">YAPAY ZEKÂ</span>' : ''}</div>
        <div class="modal-sub">${me.rank}. sıra · ${rows.length} oyuncu arasında</div>
      </div>
    </div>
    <div class="modal-body">
      ${me.ai ? `<div class="note ai-note" style="margin-bottom:14px">
        <span>${me.emoji}</span><span><b>Bu bir yapay zekâ oyuncu.</b>
        ${AI_PLAYERS.find(p => p.uid === me.uid)?.note || ''}
        Ödül için yarışmaz — sadece kıyas içindir.</span>
      </div>` : ''}
      <div class="stat-row" style="margin-bottom:6px">
        <div class="stat"><b>${me.points}</b><span>Puan</span></div>
        <div class="stat"><b>${me.exact}</b><span>Tam isabet</span></div>
        <div class="stat"><b>${me.count}</b><span>Tahmin</span></div>
      </div>

      ${rozetHtml}

      ${progRows.length >= 2 ? `
        <div class="pf-h">Puan gelişimi</div>
        ${progressionChart(progRows)}` : `
        <div class="empty" style="padding:16px">
          Grafik için en az iki puanlanmış maç gerekiyor.</div>`}

      <div class="pf-h">Sezon tahminleri</div>
      ${seasonHtml}

      ${best && best.got > 0 ? `
        <div class="note" style="margin-top:14px">
          <span>En iyi maçı: <b>${TEAMS[best.m.home].short || TEAMS[best.m.home].name}
          ${best.res.h}-${best.res.a} ${TEAMS[best.m.away].short || TEAMS[best.m.away].name}</b>
          — ${best.pred.h}-${best.pred.a} dedi,
          <b style="color:var(--gold)">${best.got} puan</b> aldı.</span>
        </div>` : ''}

      ${recent.length ? `
        <div class="pf-h">Son tahminleri</div>
        <div class="pf-list">
          ${recent.map(r => `
            <div class="pf-row">
              <span class="mt">${TEAMS[r.m.home].short || TEAMS[r.m.home].name}
                <b>${r.res.h}-${r.res.a}</b>
                ${TEAMS[r.m.away].short || TEAMS[r.m.away].name}</span>
              <span class="pd">${r.pred.h}-${r.pred.a}</span>
              <span class="pt ${ptsClass(r.tier)}">${r.got}p</span>
            </div>`).join('')}
        </div>` : ''}
    </div>
  </div>`;
  requestAnimationFrame(() => el.classList.add('show'));
}
function closeProfile(){
  const el = document.getElementById('profileModal');
  if (!el) return;
  el.classList.remove('show');
  setTimeout(() => el.remove(), 260);
}

<script>
/* ===== index.html ===== */
window.P_tahmin = (function(){
/* ============================================================
   TAHMİNLER SAYFASI
   ============================================================ */

let fTeam = 'ALL', fComp = 'ALL', shown = 14;
/* Oranı girilmemiş maçlar bölümü: kapalı başlar, kendi sayfalaması var */
let showSoon = false, shownSoon = 14;

/* ---------------- Hero: sıradaki / oynanan maç ---------------- */
function heroBlock(){
  const m = upcomingFixtures()[0];
  if (!m) return `<div class="card"><div class="empty">Sezon tamamlandı.</div></div>`;

  const H = TEAMS[m.home], A = TEAMS[m.away], b = badgeOf(m);
  const live = matchState(m) === 'live';
  const r = RESULTS[m.id];
  const next = live ? upcomingFixtures().find(f => matchState(f) === 'open') : null;

  const cd = `
    <div class="countdown">
      <div class="cd-cell"><b id="cd-d">0</b><span>gün</span></div>
      <div class="cd-cell"><b id="cd-h">00</b><span>saat</span></div>
      <div class="cd-cell"><b id="cd-m">00</b><span>dk</span></div>
      <div class="cd-cell"><b id="cd-s">00</b><span>sn</span></div>
    </div>`;

  const middle = live
    ? `<div style="text-align:center">
         <div class="score tint" style="font-size:46px">${r ? `${r.h} — ${r.a}` : '– — –'}</div>
         <div style="font-size:10.5px;color:var(--red);letter-spacing:2.5px;margin-top:9px;font-weight:700">
           ${r?.minute ? r.minute + "' OYNANIYOR" : 'OYNANIYOR'}
         </div>
       </div>
       ${next ? `
       <div style="margin-top:20px;padding-top:18px;border-top:1px dashed var(--line)">
         <div style="text-align:center;font-size:9.5px;letter-spacing:2.4px;color:var(--faint);
                     text-transform:uppercase;margin-bottom:11px">
           Sıradaki · ${TEAMS[next.home].name} – ${TEAMS[next.away].name}
         </div>${cd}
       </div>` : ''}`
    : cd;

  return `
  <div class="hero">
    <div class="hero-in">
      <div style="text-align:center">
        <span class="hero-kicker">
          <span class="pulse-dot" ${live ? 'style="background:var(--red)"' : ''}></span>
          ${live ? 'ŞU AN OYNANIYOR' : 'SIRADAKİ MAÇ'}
        </span>
      </div>

      <div class="hero-matchup">
        <div class="hero-side">
          <span class="crest-wrap">${crest(m.home, 54)}</span>
          <div><div class="nm">${H.short || H.name}</div><div class="tag">EV SAHİBİ</div></div>
        </div>
        <div class="hero-vs">VS</div>
        <div class="hero-side">
          <span class="crest-wrap">${crest(m.away, 54)}</span>
          <div><div class="nm">${A.short || A.name}</div><div class="tag">DEPLASMAN</div></div>
        </div>
      </div>

      ${middle}

      <div style="text-align:center;margin-top:18px;display:flex;justify-content:center;
                  gap:8px;flex-wrap:wrap;align-items:center">
        <span class="tier ${b.cls}">${compMark(m.comp)}${b.text}</span>
        <span class="mult ${m.derby ? 'hot' : m.comp !== 'SL' ? 'eu' : ''}">×${b.mult}</span>
        <span style="font-size:11px;color:var(--faint)">${fmtDate(m.dt)} · ${m.venue}</span>
      </div>
    </div>
  </div>`;
}

/* ---------------- Sıradaki maçın videosu ----------------
   Video yoksa BOŞ DİZE döner: sayfada ne kutu, ne başlık, ne boşluk
   kalır — kullanıcı bir şeyin eksik olduğunu fark etmez. Yönetici
   ise videoyu buradan iliştirir/kaldırır. */
function mediaBlock(){
  const m = upcomingFixtures()[0];
  if (!m) return '';

  const kayit = mediaOf(m.id) || { url:'', yazi:'' };
  const adres = kayit.url;
  const v = mediaEmbed(adres);
  const yonetici = isAdmin();
  if (!v && !yonetici) return '';                 // sıradan kullanıcı: hiçbir şey

  /* Video 16:9 çerçeveye oturur; fotoğraf ise KENDİ oranını korur —
     bir mizah karesi kırpılırsa şakası kaçar. */
  let govde = '';
  if (v?.tur === 'yt'){
    govde = `<div class="med-frame">
      <iframe src="${v.src}" title="Maç videosu" loading="lazy" frameborder="0"
        referrerpolicy="strict-origin-when-cross-origin"
        allow="accelerometer; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen></iframe></div>`;
  } else if (v?.tur === 'video'){
    govde = `<div class="med-frame">
      <video src="${v.src}" controls preload="metadata" playsinline></video></div>`;
  } else if (v?.tur === 'foto'){
    govde = `<a class="med-foto" href="${v.src}" target="_blank" rel="noopener noreferrer"
        title="Tam boyutta aç">
        <img src="${v.src}" alt="Maça iliştirilen fotoğraf" loading="lazy"></a>`;
  }

  /* Alt yazı yalnızca medya varken ve doluyken çıkar */
  const altYazi = (v && kayit.yazi)
    ? `<div class="med-yazi">${esc(kayit.yazi)}</div>` : '';

  /* Gömülü fotoğrafın adresi çok uzun; kutuya basmak yerine kısa bir
     etiket gösterilir, yoksa yönetici 600 KB'lık metne bakar. */
  const gomulu = /^data:image\//.test(adres);
  const kutuDegeri = gomulu ? '' : adres;

  const panel = !yonetici ? '' : `
    <div class="admin-box med-admin">
      <div class="lbl">Maç medyası</div>
      <input id="med_${m.id}" type="text" class="med-in" autocomplete="off"
             placeholder="YouTube bağlantısı · .mp4 · .jpg / .png / .gif"
             value="${kutuDegeri.replace(/"/g,'&quot;')}">
      <input id="medy_${m.id}" type="text" class="med-in med-yazi-in" autocomplete="off"
             maxlength="140" placeholder="Alt yazı (isteğe bağlı)"
             value="${esc(kayit.yazi)}">
      <button class="btn" onclick="P_tahmin.saveMedia('${m.id}')">Kaydet</button>
      ${adres ? `<button class="btn ghost" onclick="P_tahmin.saveMedia('${m.id}', true)">Kaldır</button>` : ''}
    </div>
    <div class="med-upload">
      <label class="btn ghost med-file">
        <input type="file" accept="image/*" hidden
               onchange="P_tahmin.pickFoto('${m.id}', this)">
        Bilgisayardan fotoğraf seç
      </label>
      <span class="med-durum" id="medd_${m.id}">${
        gomulu ? `bu maçta gömülü fotoğraf var · ${Math.round(adres.length/1024)} KB`
               : 'ya da yukarıya bir bağlantı yapıştır'}</span>
    </div>`;

  return `<div class="card reveal med-card">${govde}${altYazi}${
    panel ? `<div class="card-pad" style="padding:12px 14px">${panel}</div>` : ''}</div>`;
}

/* Seçilen dosyayı küçültüp doğrudan kaydeder. Video seçilirse
   neden olmadığı açıkça söylenir — sessizce reddetmek kafa karıştırır. */
async function pickFoto(id, input){
  const f = input.files?.[0];
  input.value = '';                                   // aynı dosya tekrar seçilebilsin
  if (!f) return;
  const durum = document.getElementById('medd_' + id);
  const yaz = t => { if (durum) durum.textContent = t; };

  if (/^video\//.test(f.type)){
    toast('Video yüklenemiyor — YouTube bağlantısı yapıştır');
    yaz('video dosyası yüklenemez · YouTube bağlantısı kullan');
    return;
  }
  yaz('küçültülüyor…');
  let r;
  try { r = await fotoKucult(f); }
  catch(e){ toast(e.message || 'Fotoğraf işlenemedi'); yaz('olmadı — başka bir dosya dene'); return; }

  if (r.bayt > FOTO_HEDEF){
    toast('Fotoğraf çok büyük — daha küçük bir kare dene');
    yaz(`sığmadı (${Math.round(r.bayt/1024)} KB)`);
    return;
  }
  const yazi = (document.getElementById('medy_' + id)?.value || '').trim().slice(0, 140);
  try { await setMedia(id, r.uri, yazi); }
  catch(e){ toast('Kaydedilemedi: ' + (e.message || '')); return; }
  toast(`Fotoğraf yüklendi · ${r.en}×${r.boy} · ${Math.round(r.bayt/1024)} KB`);
  render();
}

async function saveMedia(id, sil){
  const kutu = (document.getElementById('med_' + id)?.value || '').trim();
  const eski = mediaOf(id);
  /* Gömülü fotoğrafta adres kutusu bilerek boş duruyor (600 KB'lık
     metni kutuya basmıyoruz). O yüzden boş kutu "sil" demek değil:
     yalnızca alt yazı güncelleniyorsa fotoğraf yerinde kalmalı.
     Silme YALNIZCA Kaldır düğmesinden gelir. */
  const gomuluVar = /^data:image\//.test(eski?.url || '');
  const url  = sil ? '' : (kutu || (gomuluVar ? eski.url : ''));
  const yazi = sil ? '' : (document.getElementById('medy_' + id)?.value || '').trim().slice(0, 140);
  if (url && !mediaEmbed(url)){
    toast('Tanınmayan adres — YouTube, .mp4 ya da .jpg/.png/.gif olmalı');
    return;
  }
  try { await setMedia(id, url, yazi); }
  catch(e){ toast('Kaydedilemedi: ' + (e.message || '')); return; }
  const tur = mediaEmbed(url)?.tur;
  toast(!url ? 'Medya kaldırıldı' : tur === 'foto' ? 'Fotoğraf eklendi' : 'Video eklendi');
  render();
}

/* ---------------- İstatistikler ---------------- */
function statsBlock(){
  const rows = leaderboard();
  const me = rows.find(r => r.you) ||
             { points:0, rank:'–', exact:0, derbyPts:0, euroPts:0 };
  const done = FIXTURES.filter(isFinished).length;
  return `
  <div class="card reveal">
    <div class="card-pad">
      <div class="stat-row">
        <div class="stat"><b data-count="${me.points}">0</b><span>Puanın</span></div>
        <div class="stat">
          ${typeof me.rank === 'number' ? `<b data-count="${me.rank}">0</b>` : `<b>${me.rank}</b>`}
          <span>Sıran / ${rows.length}</span></div>
        <div class="stat"><b data-count="${me.exact}">0</b><span>Tam İsabet</span></div>
      </div>
      <div style="display:flex;justify-content:center;gap:16px;flex-wrap:wrap;
                  font-size:11.5px;color:var(--faint);margin-top:12px">
        <span>Derbilerden <b style="color:var(--gold)">${me.derbyPts}p</b></span>
        <span>Avrupa'dan <b style="color:#8fb0ff">${me.euroPts}p</b></span>
        <span>${done} maç oynandı</span>
      </div>
    </div>
  </div>`;
}

/* ---------------- Ödül kartı ----------------
   Sıralamanın hemen üstünde durur; kimse aramasın diye kompakt.
   Görsel dış bir adresten gelir; yüklenemezse kart sadece
   yazıyla kalır (onerror ile alan gizlenir).                   */
const PRIZE_ART = 'https://static0.moviewebimages.com/wordpress/wp-content/uploads/2024/10/spongebob-squarepants-holding-up-krabby-patty.jpg';


function prizeCard(){
  return `
  <div class="card reveal prize-card">
    <div class="prize-in">
      <div class="prize-txt">
        <span class="kick">Sezon birincisine</span>
        <div class="ttl">1 ADET HAMBURGER</div>
        <div class="sub">Sponsor: <b>Kaan</b></div>
      </div>
      <img class="prize-art" src="${PRIZE_ART}" alt="" aria-hidden="true"
           onerror="this.remove()">
    </div>
  </div>`;
}

/* ---------------- Çarpan tablosu ---------------- */
function multBlock(){
  const rowsHtml = [
    ['SÜRPRİZ PRİMİ', '1. çarpan — beklenmedik skor tutturunca', '×3', 'hot'],
    ['DERBİ', '2. çarpan — dört büyükler birbiriyle', '×2', 'hot'],
    ['AVRUPA', '2. çarpan — Şampiyonlar / Avrupa / Konferans Ligi', '×2', 'eu'],
    ['SÜPER LİG', '2. çarpan — normal lig maçları', '×1', ''],
  ].map(([t, d, x, c]) => `
    <div style="display:flex;align-items:center;gap:11px;padding:8px 0;
                border-bottom:1px solid rgba(255,255,255,.04)">
      <span class="mult ${c}" style="min-width:44px;text-align:center">${x}</span>
      <span style="flex:1;min-width:0">
        <span style="font-size:12.5px;font-weight:600;display:block">${t}</span>
        <span style="font-size:11px;color:var(--faint)">${d}</span>
      </span>
    </div>`).join('');

  return `
  <div class="card reveal">
    <div class="card-pad">
      <div class="note" style="margin-bottom:14px">
        <span style="font-size:15px;flex-shrink:0">⚡</span>
        <span>İki çarpan var ve <b>birbiriyle çarpılır</b>: tahminin ne kadar
        <b>cesur</b> olduğu (×1–×3) ve maçın ne kadar <b>önemli</b> olduğu (×1–×2).
        İkisi birden en fazla ×6 eder — yani bir maçtan en çok 60 puan.</span>
      </div>
      ${rowsHtml}
      <div class="note" style="margin-top:14px">
        <span>Avrupa maçları <b>kura çekildikten sonra</b> fikstüre eklenir.
        Hangi maçların açılacağı yandaki kartta anlatılıyor.</span>
      </div>
    </div>
  </div>`;
}

/* ---------------- Filtreler ---------------- */
function filterBar(){
  const teams = [['ALL','Tüm Takımlar'], ...BIG4.map(c => [c, TEAMS[c].name])];
  const have = new Set(FIXTURES.map(m => m.comp));
  /* Avrupa sekmesi HER ZAMAN durur — kura çekilmeden fikstürde Avrupa
     maçı olmadığı için eskiden gizleniyordu, ama sekmenin yokluğu
     "bu oyunda Avrupa maçı yok" izlenimi veriyordu. Artık görünür ve
     maç girilene kadar kendi boş durumunu gösterir (bkz. euroBos).
     Alt turnuva sekmeleri (UCL/UEL/UECL) ise yalnızca o turnuvadan
     maç varken çıkar; boş yere yedi pil sıralamanın anlamı yok.     */
  const comps = [['ALL','Hepsi'],['DERBY','Derbiler'],['SL','Süper Lig'],
                 ['EU','Avrupa'],['UCL','Şampiyonlar L.'],['UEL','Avrupa L.'],['UECL','Konferans L.']]
                 .filter(([k]) => ['ALL','DERBY','SL','EU'].includes(k) || have.has(k));
  return `
  <div class="filterbar">
    <div class="row">
      ${teams.map(([k,l]) => `<button class="pill ${fTeam===k?'on':''}"
        onclick="P_tahmin.setTeam('${k}')">${l}</button>`).join('')}
    </div>
    <div class="row">
      ${comps.map(([k,l]) => `<button class="pill ${fComp===k?'on':''}"
        onclick="P_tahmin.setComp('${k}')">${l}</button>`).join('')}
    </div>
  </div>`;
}
/* Filtre değişince iki bölümün de sayfalaması başa döner; açık/kapalı
   durumu korunur ki kullanıcı her filtrede yeniden açmak zorunda kalmasın. */
function setTeam(k){ fTeam = k; shown = 14; shownSoon = 14; render(); }
function setComp(k){ fComp = k; shown = 14; shownSoon = 14; render(); }
function showMore(){ shown += 14; render(); }
function showMoreSoon(){ shownSoon += 14; render(); }
function toggleSoon(){ showSoon = !showSoon; shownSoon = 14; render(); }

/* ---------------- Maç kartı ---------------- */
function matchCard(m){
  const H = TEAMS[m.home], A = TEAMS[m.away], b = badgeOf(m);
  const st = matchState(m);
  const r = RESULTS[m.id];
  const my = myPredictions()[m.id];
  const open = st === 'open';
  const feat = isFeatured(m);

  const oddsReady = hasOdds(m);
  const acik      = canPredict(m);      // oranlı ya da iki haftalık pencerede
  /* Tahmin girilebilir mi, girilmiş mi? Kart rengi buna göre. */
  const actionable = acik && isLoggedIn();
  const status = !actionable ? '' : (my ? 'ok' : 'todo');

  const stateChip = open
    ? `<span class="state state-open">${timeLeftShort(new Date(m.dt) - NOW())}</span>`
    : st === 'live'
      ? `<span class="state state-live"><span class="pulse-dot"></span>CANLI${r?.minute ? ' ' + r.minute + "'" : ''}</span>`
      : `<span class="state state-done">BİTTİ</span>`;

  const pickChip = status === 'todo'
    ? `<span class="state state-todo" title="Bu maça henüz tahmin yapmadın">
         <span class="dot"></span>TAHMİNİN YOK</span>`
    : status === 'ok'
      ? `<span class="state state-ok">✓ TAHMİNİN VAR</span>`
      : '';

  const center = (st !== 'open' && r)
    ? `<div class="score tint">${r.h} — ${r.a}</div>`
    : `<div class="vs-lite">VS</div>`;

  let pickArea = '';
  if (open && !acik){
    /* Ne oranı girilmiş ne de iki haftalık pencereye girmiş — pencere budur */
    pickArea = `
      <div class="login-cta">
        <span>⏳ <b>Tahmine kapalı</b> — maçtan iki hafta önce açılır.</span>
      </div>`;
  } else if (open && !isLoggedIn()){
    pickArea = `
      <div class="login-cta">
        <span>Tahmin girmek için giriş yapmalısın</span>
        <button class="btn" onclick="openAuth('login')">Giriş yap</button>
      </div>`;
  } else if (open){
    pickArea = `
      <div class="pick">
        <div class="pick-label">${my ? 'Tahminini güncelle' : 'Tahminini gir'}</div>
        <input class="num ${my ? 'filled' : ''}" id="h_${m.id}" type="number" inputmode="numeric"
               min="0" max="20" placeholder="–" value="${my?.h ?? ''}" aria-label="${H.name} golü"
               oninput="P_tahmin.hintOdds('${m.id}')">
        <span class="dash">—</span>
        <input class="num ${my ? 'filled' : ''}" id="a_${m.id}" type="number" inputmode="numeric"
               min="0" max="20" placeholder="–" value="${my?.a ?? ''}" aria-label="${A.name} golü"
               oninput="P_tahmin.hintOdds('${m.id}')">
        <button class="btn ${my ? 'saved' : ''}" data-save="${m.id}"
                onclick="P_tahmin.savePick('${m.id}', event)">${my ? 'Güncelle' : 'Kaydet'}</button>
        ${oddsReady ? `<button class="btn ghost odds-btn" onclick="openOddsView('${m.id}')"
                title="Bu maçın tüm oranları">${oddsIcon(14)}<span>Oranlar</span></button>` : ''}
      </div>
      <div class="odds-hint" id="hint_${m.id}">${oddsHintText(m, my?.h, my?.a)}</div>`;
  } else if (my){
    /* Maç sürerken de puanla: "şu an bitse ne alırdın" bilgisi. */
    const scored = r && st !== 'open';
    const sc = scored ? scorePrediction(my, r, m) : null;
    pickArea = `
      <div class="pick" style="gap:14px">
        <div class="pick-label">Senin tahminin</div>
        <span class="score" style="font-size:23px;color:var(--dim)">${my.h} — ${my.a}</span>
        ${sc
          ? `<span class="${ptsClass(sc.tier)}" style="font-family:var(--f-num);font-size:22px"
                   title="${sc.tier} × ${sc.mult}">+${sc.pts}p</span>
             ${st === 'live' ? '<span class="live-tag">ŞİMDİLİK</span>' : ''}`
          : `<span style="font-size:11px;color:var(--faint)">maç bitince puanlanacak</span>`}
      </div>`;
  }

  /* Tahminler normalde maç başlayınca açılır. Yönetici erken görebilir —
     ama YALNIZCA kendi tahminini kaydettikten sonra. Aksi hâlde herkesin
     seçimini görüp ona göre oynayabilirdi; yönetici de ödül için yarışıyor.
     Bu koşulu kaldırmak istersen aşağıdaki "&& !!my" yeter. */
  const adminPeek = open && isAdmin();
  let others = '';

  if (!open || (adminPeek && !!my)){
    const peek = open;                       // maç başlamadıysa bu yönetici görünümü
    const scored = r && st !== 'open';
    const rows = Store.users.map(u => {
      const p = (u.you ? myPredictions() : predictionsOf(u.uid))?.[m.id];
      if (!p) return null;
      const sc = scored ? scorePrediction(p, r, m) : null;
      return { u, p, pts: sc ? sc.pts : null, tier: sc ? sc.tier : 0 };
    }).filter(Boolean).sort((a,b) => (b.pts ?? -1) - (a.pts ?? -1));

    others = `
      <button class="reveal-btn ${peek ? 'peek' : ''}" onclick="P_tahmin.togglePicks('${m.id}', this)">
        <span>${peek ? 'Tahminler · yalnızca yönetici' : 'Herkes ne dedi'} (${rows.length})</span>
        <span class="chev">▾</span>
      </button>
      <div class="picks" id="picks_${m.id}">
        ${peek ? `<div class="peek-note">Bu liste maç başlayana kadar
          <b>yalnızca sana</b> görünür.</div>` : ''}
        ${st === 'live' && scored ? `<div class="live-note">
          <span class="pulse-dot"></span>Maç sürüyor — puanlar
          <b>${r.h}-${r.a}</b> skoruna göre, her golde değişir.</div>` : ''}
        ${rows.map(({u,p,pts,tier}) => `
          <div class="prow ${u.you ? 'me' : ''}">
            <span class="who">${u.ai ? u.emoji + ' ' : ''}${u.name}${u.you ? ' (sen)' : ''}</span>
            <span class="sc">${p.h} — ${p.a}</span>
            ${pts !== null ? `<span class="pt ${ptsClass(tier)}">${pts}p</span>` : ''}
          </div>`).join('')}
      </div>`;
  } else if (adminPeek){
    others = `<div class="peek-note lone">Diğer tahminleri görmek için
      <b>önce kendi tahminini kaydet</b>.</div>`;
  }

  return `
  <article class="derby reveal ${st === 'live' ? 'live' : ''} ${feat ? '' : 'plain'} ${m.derby ? 'hero-match' : ''}
           ${status ? 'st-' + status : ''}"
           ${feat ? 'data-tilt' : ''} style="--hc:${H.c1};--ac:${A.c1}">
    <div class="derby-top">
      <span class="tier ${b.cls}">${compMark(m.comp)}${b.text}</span>
      <span class="mult ${m.derby ? 'hot' : m.comp !== 'SL' ? 'eu' : ''}">×${b.mult}</span>
      <span class="when">${m.tbd ? '<b class="q">?</b>' : fmtTime(m.dt)}</span>
      ${m.tbd ? `<span class="prov"
        title="Tarih kesin, saat henüz TFF tarafından açıklanmadı. Tahminler ${TBD_KICKOFF}'da kilitlenir."
        >saat belli değil</span>` : ''}

/* Skor kutularının altındaki canlı ipucu: oran, çarpan, olası puan */
function oddsHintText(m, h, a){
  const i = oddsInfo(m.id);
  /* Oran yoksa tahmin yine kaydedilir; sadece olası puan gösterilemez. */
  if (!i) return `<span class="dim">Oranlar henüz girilmedi — tahminin kaydedilir,
          kazanabileceğin puan oranlar girilince belli olur.</span>`;
  if (h === '' || a === '' || h == null || a == null){
    const fav = Object.keys(i.scores).reduce((b,k) => i.scores[k] < i.scores[b] ? k : b);
    return `<span class="dim">Bahisçinin favori skoru <b>${fav.replace(':','-')}</b>
            (${i.scores[fav].toFixed(2)}) · ondan saptıkça puan artar</span>`;
  }
  const o    = i.scores[`${+h}:${+a}`];
  const mult = scoreMult(m, +h, +a) * (m.mult || 1);
  return `${o ? `oran <b>${o.toFixed(2)}</b> · ` : `<span class="dim">listede yok · </span>`}
          çarpan <b>×${mult.toFixed(2)}</b> · tam isabet
          <b class="pt-10" style="font-family:var(--f-num);font-size:15px">${Math.round(10 * mult)}p</b>`;
}
function hintOdds(id){
  const el = document.getElementById('hint_' + id);
  if (el) el.innerHTML = oddsHintText(FIXTURE_BY_ID[id],
    document.getElementById('h_' + id).value,
    document.getElementById('a_' + id).value);
  refreshSaveButtons();
}

/* Bekleyen tahmin sayısını düğmelere yansıt — toplu kayıt görünür olsun */
function refreshSaveButtons(){
  const n = collectPicks().ready.length;
  document.querySelectorAll('button[data-save]').forEach(b => {
    const own = b.dataset.save;
    b.textContent = n > 1 ? `${n} tahmini kaydet`
                  : (myPredictions()[own] ? 'Güncelle' : 'Kaydet');
    b.classList.toggle('bulk', n > 1);
  });
}

/* ---------------- Toplu kaydetme ----------------
   Ekranda doldurulmuş BÜTÜN skor kutuları taranır. Hangi kartın
   düğmesine basıldığı fark etmez: on maça skor girip birine
   basarsan onu da diğer dokuzu da tek seferde kaydeder.        */
function collectPicks(){
  const my = myPredictions();
  const ready = [], bad = [];
  document.querySelectorAll('.pick input.num[id^="h_"]').forEach(hEl => {
    const id  = hEl.id.slice(2);
    const aEl = document.getElementById('a_' + id);
    if (!aEl) return;
    const hv = hEl.value.trim(), av = aEl.value.trim();
    if (hv === '' && av === '') return;               // hiç dokunulmamış
    const h = parseInt(hv), a = parseInt(av);
    if (isNaN(h) || isNaN(a)){ bad.push(id); return; } // yarım bırakılmış
    if (h < 0 || a < 0 || h > 20 || a > 20){ bad.push(id); return; }
    const cur = my[id];
    if (cur && cur.h === h && cur.a === a) return;      // zaten kayıtlı
    ready.push({ id, h, a });
  });
  return { ready, bad };
}

async function savePick(id, ev){
  if (!requireLogin()) return;
  const { ready, bad } = collectPicks();

  if (!ready.length){
    toast(bad.length ? 'Önce iki skoru da gir' : 'Kaydedilecek yeni tahmin yok');
    return;
  }

  const x = ev?.clientX, y = ev?.clientY;
  try {
    await setMyPredictions(ready);
  } catch(e){ toast('Kaydedilemedi: ' + (e.message || 'bağlantı hatası')); return; }

  if (x != null) confetti(x, y, ready.length > 3 ? 40 : 26);

  if (ready.length === 1){
    const p = ready[0], m = FIXTURE_BY_ID[p.id];
    toast(`<b>${TEAMS[m.home].name} ${p.h}–${p.a} ${TEAMS[m.away].name}</b> kaydedildi`);
  } else {
    toast(`<b>${ready.length} tahmin</b> kaydedildi${bad.length ? ` · ${bad.length} maç eksik` : ''}`);
  }
  render();
}

/* Yönetici: maç sonucu kaydet */
async function saveResult(id){
  const h = document.getElementById('rh_' + id).value;
  const a = document.getElementById('ra_' + id).value;
  if (h === '' || a === ''){ toast('İki skoru da gir'); return; }
  try { await setResult(id, h, a); }
  catch(e){ toast('Kaydedilemedi: ' + (e.message || '')); return; }
  toast('Sonuç kaydedildi');
  render();
}

/* ---------------- Maç listesi (güne göre gruplu) ----------------
   Liste ikiye ayrılır: TAHMİNE AÇIK maçlar üstte, henüz açılmamışlar
   altta ve KAPALI durur. Açık olmak için ya oranların girilmiş olması
   ya da maça iki haftadan az kalmış olması yeter (bkz. canPredict).
   Sebebi basit — sezon başında 120 tahmin edilemez kart, oynanabilir
   birkaç maçı gömüyordu. Alttaki bölüm tek düğmeyle açılır.       */

/* Bir maç dizisini güne göre gruplayıp kartlara çevirir.
   Gün başlığındaki sayaç kendi bölümünü sayar. */
function groupedCards(list, limit){
  let html = '', lastDay = null;
  list.slice(0, limit).forEach(m => {
    const k = dayKey(m.dt);
    if (k !== lastDay){
      lastDay = k;
      const sameDay = list.filter(x => dayKey(x.dt) === k).length;
      const today = k === dayKey(NOW().toISOString());
      html += `<div class="daygroup ${today ? 'today' : ''}">
        <span class="d">${fmtDayHeader(m.dt)}</span>
        <span class="n">${sameDay} maç</span>
        <span class="rule"></span></div>`;
    }
    html += matchCard(m);
  });
  return html;
}

function matchList(){
  const all = filterFixtures(upcomingFixtures(), fTeam, fComp);
  if (!all.length){
    return euroBos(fComp) || `<div class="card quiet"><div class="empty">
      <span class="em">🔭</span>
      <span class="ttl">Maç bulunamadı</span>
      <span class="hint">Bu filtreyle yaklaşan maç yok. Filtreleri temizleyip
        tüm fikstüre bakabilirsin.</span></div></div>`;
  }

  /* Ayrım ORANA göre: üstte oranı girilmiş maçlar, altta girilmemişler.
     Alttakilerin bir kısmı (iki haftadan yakın olanlar) tahmine AÇIKTIR —
     kutuları çalışır, sadece olası puan gösterilemez. Yine de burada
     duruyorlar ki üst liste "puanını görebildiğin maçlar" kalsın.
     Süren maçlar oranı olmasa da üstte kalır: canlı takip ediliyorlar. */
  const ustte   = m => matchState(m) !== 'open' || hasOdds(m);
  const oranli  = all.filter(ustte);
  const oransiz = all.filter(m => !ustte(m));
  const oransizAcik = oransiz.filter(canPredict).length;

  let html = '';

  if (oranli.length){
    html += groupedCards(oranli, shown);
    if (oranli.length > shown){
      html += `<button class="btn ghost" onclick="P_tahmin.showMore()" style="width:100%;margin-top:6px">
        ${oranli.length - shown} maç daha göster ▾
      </button>`;
    }
  } else {
    html += `<div class="card quiet"><div class="empty">
      <span class="em">⏳</span>
      <span class="ttl">Oranlı maç yok</span>
      <span class="hint">${oransizAcik
        ? `Yine de aşağıdaki <b>${oransizAcik} maça</b> tahmin girebilirsin —
           puanı oranlar girilince belli olur.`
        : `Oranlar girilince maçlar burada belirir.
           Aşağıdan tüm fikstüre göz atabilirsin.`}</span></div></div>`;
  }

  /* Oranı girilmemişler: varsayılan kapalı */
  if (oransiz.length){
    html += `
      <button class="btn ghost soon-toggle ${showSoon ? 'open' : ''}"
              onclick="P_tahmin.toggleSoon()">
        <span>⏳ Oranı girilmemiş ${oransiz.length} maç${
          oransizAcik ? ` · ${oransizAcik} tanesi tahmine açık` : ''}</span>
        <span class="chev">▾</span>
      </button>`;
    if (showSoon){
      html += `<div class="soon-note">${oransizAcik
        ? `Başlamasına iki haftadan az kalan <b>${oransizAcik} maça</b> şimdiden
           tahmin girebilirsin; kazanacağın puan oranlar girilince belli olur.
           Kalanlar iki hafta kala açılacak.`
        : `Bu maçlar başlamalarına iki hafta kala tahmine açılacak —
           oranlar daha erken girilirse hemen.`}</div>`;
      html += groupedCards(oransiz, shownSoon);
      if (oransiz.length > shownSoon){
        html += `<button class="btn ghost" onclick="P_tahmin.showMoreSoon()" style="width:100%;margin-top:6px">
          ${oransiz.length - shownSoon} maç daha göster ▾
        </button>`;
      }
    }
  }
  return html;
}

/* ---------------- Sezon tahminleri ---------------- */
function seasonBlock(){
  const my = mySeason(), now = NOW();

  return Object.keys(SEASON_PICKS).map(kind => {
    const cfg = SEASON_PICKS[kind];
    /* seasonLocked() üzerinden gidilmeli, tarihe doğrudan bakılmamalı:
       yeni üye hakkı yalnızca o fonksiyonun içinde tanımlı. */
    const locked = seasonLocked(kind);
    const multi  = cfg.kind === 'multi';
    const picked = my[kind];
    const chosen = multi ? (Array.isArray(picked) ? picked : []) : null;
    const result = SEASON_RESULT[kind];
    const isSel  = v => multi ? chosen.includes(v) : picked === v;

    /* Sonuç açıklandığında kaç puan geldi? */
    const got = seasonPoints(kind, picked, result);
    const resultTxt = !result ? '' : (
      multi ? `Düşen takımlar: <b>${result.map(c => TEAMS[c]?.name || c).join(', ')}</b> —
               ${got ? `<b style="color:var(--cyan)">${chosen.filter(c => result.includes(c)).length} isabet · +${got} puan!</b>`
                     : 'hiçbirini bilemedin.'}`
            : `Sonuç: <b>${TEAMS[result]?.name || result}</b> —
               ${got ? `<b style="color:var(--cyan)">+${got} puan!</b>` : 'puan alamadın.'}`);

    return `
    <div class="card reveal">
      ${seasonFoto(cfg)}
      <div class="card-head">
        ${seasonMark(cfg, 22)}<h2>${cfg.title}</h2>
        <span class="tail">${seasonPointsLabel(kind)}</span>
      </div>
      <div class="card-pad">
        <p class="sub" style="margin-bottom:14px">
          ${cfg.desc}
          ${locked ? ` <span style="color:var(--red)">· Giriş kapandı</span>`
            : yeniUye()
              /* Genel kilit geçmiş, oyuncu kendi 24 saatlik hakkıyla
                 oynuyor: geri sayım o hakka göre gösterilmeli, yoksa
                 geçmiş bir tarihe eksi sayı çıkardı. */
              ? ` <span style="color:var(--gold)">· yeni üye hakkın: ${timeLeftShort(graceKalan())} kaldı</span>`
              : ` <span style="color:var(--cyan)">· ${timeLeftShort(new Date(cfg.lock) - now)} kaldı</span>`}
        </p>

        ${multi ? `<div class="ms-count ${chosen.length === cfg.max ? 'full' : ''}">
            ${chosen.length}/${cfg.max} takım seçildi${chosen.length === cfg.max ? ' ✓' : ''}
            ${chosen.length ? `<span class="ms-list">${chosen.map(c => TEAMS[c]?.name || c).join(' · ')}</span>` : ''}
          </div>` : ''}

        ${cfg.kind === 'list' ? `
          <div class="opt-grid">
            ${cfg.options.map(o => `
              <button class="opt ${isSel(o) ? 'sel' : ''} ${locked ? 'locked' : ''}"
                      ${locked ? 'disabled' : ''}
                      onclick="P_tahmin.pickSeason('${kind}', this.dataset.v)" data-v="${o}">${o}${
                cfg.odds ? `<b>${seasonPickPoints(kind, o)}p</b>` : ''}</button>`).join('')}
          </div>`
        : `
          <div class="${multi ? 'ms-grid' : 'team-grid'}">
            ${cfg.options.map(c => `
              <button class="team-opt t-${c.toLowerCase()} ${isSel(c) ? 'sel' : ''} ${locked ? 'locked' : ''}"
                      ${locked ? 'disabled' : ''} onclick="P_tahmin.pickSeason('${kind}','${c}')">
                ${crest(c, multi ? 30 : 38)}
                <span class="lbl">${multi ? (TEAMS[c]?.short || TEAMS[c]?.name || c) : c}</span>
                ${!multi && cfg.odds ? `<span class="opt-pts">${seasonPickPoints(kind, c)}p</span>` : ''}
              </button>`).join('')}
          </div>`}

        ${result ? `<div class="note" style="margin-top:14px">
          <span>${resultTxt}</span></div>` : ''}
      </div>
    </div>`;
  }).join('');
}

/* Sezon tahminlerinin hepsi yapıldı mı? Yapılmadıysa bölüm sayfanın
   EN ÜSTÜNE çıkar; tamamlanınca eski yerine, en alta iner. */
function seasonDone(){
  const my = mySeason();
  return Object.keys(SEASON_PICKS).every(k => {
    if (seasonLocked(k)) return true;              // kilitliyse yapacak bir şey yok
    const cfg = SEASON_PICKS[k], v = my[k];
    return cfg.kind === 'multi' ? Array.isArray(v) && v.length === cfg.max : !!v;
  });
}

function seasonSection(top){
  const eksik = Object.keys(SEASON_PICKS).filter(k => {
    if (seasonLocked(k)) return false;
    const cfg = SEASON_PICKS[k], v = mySeason()[k];
    return cfg.kind === 'multi' ? !(Array.isArray(v) && v.length === cfg.max) : !v;
  }).length;

  /* Yeni üyeye durumu açıkça söyle: kilit geçmiş ama onun hakkı sürüyor.
     Süre bittiğinde bu kutu kendiliğinden kaybolur. */
  const kalanHak = graceKalan();
  const hakKutusu = kalanHak ? `
    <div class="season-cta grace">
      <span class="dot"></span>
      <span><b>Yeni üye hakkın var.</b> Sezon bahislerinin süresi doldu ama
      sen kaydolduktan sonraki <b>24 saat</b> boyunca üçünü de oynayabilirsin —
      <b style="color:var(--gold)">${timeLeftShort(kalanHak)}</b> kaldı.
      Bu süre boyunca diğerlerinin seçimleri sana kapalı, kimseye bakmadan seç.</span>
    </div>` : '';

  return `
    <div class="sec-title"><h3>Sezon Tahminleri</h3><span class="rule"></span></div>
    ${hakKutusu}
    ${top && eksik && !kalanHak ? `<div class="season-cta">
        <span class="dot"></span>
        <span><b>${eksik} sezon tahminin eksik.</b> Bunlar sezon başında bir kez
        yapılır ve kilitlendikten sonra değiştirilemez — kaçırma.</span>
      </div>` : ''}
    ${seasonBlock()}`;
}

async function pickSeason(kind, val){
  if (!requireLogin()) return;
  const cfg = SEASON_PICKS[kind];
  const label = v => TEAMS[v]?.name || v;

  if (cfg.kind === 'multi'){
    const cur = Array.isArray(mySeason()[kind]) ? [...mySeason()[kind]] : [];
    const at  = cur.indexOf(val);
    if (at >= 0){
      cur.splice(at, 1);
    } else {
      if (cur.length >= cfg.max){
        toast(`En fazla <b>${cfg.max} takım</b> seçebilirsin — önce birini kaldır`);
        return;
      }
      cur.push(val);
    }
    await setMySeason(kind, cur);
    toast(cur.length ? `Küme düşme: <b>${cur.map(label).join(', ')}</b>` : 'Seçim temizlendi');
  } else {
    await setMySeason(kind, val);
    toast(`${cfg.title.replace('?','')} → <b>${label(val)}</b>`);
  }
  render();
}

  const openable = FIXTURES.filter(canPredict);

  const my = myPredictions();
  const done = openable.filter(m => my[m.id]).length;
  const todo = openable.length - done;
  return `

    </div>`;
}

/* ============================================================
   YÖNETİCİ — ORAN YAPIŞTIRMA
   Bahis sitesindeki doğru skor tablosunu seçip kopyala, buraya
   yapıştır. Metin biçimi önemli değil: "H:A  oran" ikililerini
   nerede olursa olsun bulur. Ev sahibi:deplasman sırası varsayılır.
   ============================================================ */
function parseOddsText(text){
  const out = {};
  /* skor, arada en fazla ~24 rakam-dışı karakter, sonra ONDALIKLI oran.
     Ondalık şartı sayesinde skor rakamları oranla karışmaz.          */
  const re = /(\d{1,2})\s*[:\-–]\s*(\d{1,2})[^\d]{0,24}?(\d{1,3}[.,]\d{1,2})/g;
  let mm;
  while ((mm = re.exec(text)) !== null){
    const h = +mm[1], a = +mm[2];
    const o = parseFloat(mm[3].replace(',', '.'));
    if (h > 20 || a > 20) continue;          // "21:30" gibi saatleri ele
    if (!(o > 1) || o > 5000) continue;
    const key = `${h}:${a}`;
    if (!(key in out)) out[key] = o;         // ilk görülen kazanır
  }
  return out;
}

/* ============================================================
   ŞİMŞEK DÖNGÜSÜ
   Beyaz şimşek düşer, düştüğü noktada takımın tek renkli çizgi
   amblemi anında belirir ve bir sonraki şimşekten ÖNCE tamamen
   söner. Sıra hep aynı: GS → FB → BJK → TS → baştan.

   NOT: Amblemler kulüplerin resmi armaları değil; halka + monogram
   biçiminde sade işaretlerdir. Elinde çizgi SVG varsa MARKS içindeki
   çizim fonksiyonunu değiştirmen yeterli.
   ============================================================ */
const BOLT = { cycle:2600, flash:170, hold:520, fade:900 };
const MONO = { GS:'GS', FB:'FB', BJK:'BJK', TS:'TS' };
let boltRAF = null;

/* Şimşekte kullanılan gerçek armalar (doğrudan görsel adresleri).
   Renkleri atılıp beyaza çevrilir; renk hiç kullanılmaz. */
const MARK_SRC = {
  GS: 'https://upload.wikimedia.org/wikipedia/commons/thumb/4/49/Galatasaray_SK_football_logo.png/960px-Galatasaray_SK_football_logo.png',
  FB: 'https://upload.wikimedia.org/wikipedia/tr/thumb/8/86/Fenerbah%C3%A7e_SK.png/250px-Fenerbah%C3%A7e_SK.png',
  BJK:'https://upload.wikimedia.org/wikipedia/commons/thumb/d/da/BesiktasJK-Logo.svg/250px-BesiktasJK-Logo.svg.png',
  TS: 'https://upload.wikimedia.org/wikipedia/tr/a/ab/TrabzonsporAmblemi.png',
};

/* code -> hazırlanmış beyaz canvas | 'mono' (yedek monogram) | null (yükleniyor) */
const markCache = {};

/* Renkli armayı BEYAZ çizime çevirir.
   Saydamlık korunur, renk atılır: pikselin PARLAKLIĞI opaklığa dönüşür.
   Böylece koyu zeminli yuvarlak armalarda içteki açık renkli detaylar
   (harfler, yaprak, kartal) beyaz kalır, koyu gövde saydamlaşır —
   yani dolu bir leke yerine gerçek çizim görüntüsü çıkar. */
function toWhiteArt(im){
  const S = 256;
  const cv = document.createElement('canvas');
  cv.width = cv.height = S;
  const cx = cv.getContext('2d');
  const s = Math.min(S / im.naturalWidth, S / im.naturalHeight) * 0.94;
  const w = im.naturalWidth * s, h = im.naturalHeight * s;
  cx.drawImage(im, (S - w) / 2, (S - h) / 2, w, h);

  let img;
  try { img = cx.getImageData(0, 0, S, S); }
  catch(e){ return null; }                    // CORS engeli → monograma dön

  const p = img.data;
  const LO = 0.30, HI = 0.82;                 // kontrast penceresi
  for (let i = 0; i < p.length; i += 4){
    const a = p[i+3];
    /* ÖNCE parlaklığı oku — sonra pikseli beyaza boya.
       Sıra ters olursa parlaklık hep 1 çıkar ve arma dolu leke olur. */
    const lum = a ? (0.2126*p[i] + 0.7152*p[i+1] + 0.0722*p[i+2]) / 255 : 0;
    const v = Math.min(1, Math.max(0, (lum - LO) / (HI - LO)));
    p[i] = p[i+1] = p[i+2] = 255;
    p[i+3] = a ? Math.round(a * v) : 0;
  }
  cx.putImageData(img, 0, 0);
  return cv;
}
function prepareMark(code){
  if (markCache[code] !== undefined) return;
  markCache[code] = null;                      // yükleniyor
  const im = new Image();
  im.crossOrigin = 'anonymous';                // getImageData için şart
  im.onload  = () => { markCache[code] = toWhiteArt(im) || 'mono'; };
  im.onerror = () => { markCache[code] = 'mono'; };
  im.src = MARK_SRC[code];
}

/* Orta nokta kaydırmasıyla kırık çizgi üretir */
function boltPath(x0, y0, x1, y1, depth, jag){
  let pts = [{x:x0,y:y0},{x:x1,y:y1}];
  for (let d = 0; d < depth; d++){
    const next = [];
    for (let i = 0; i < pts.length - 1; i++){
      const a = pts[i], b = pts[i+1];
      const dx = b.x-a.x, dy = b.y-a.y, len = Math.hypot(dx,dy) || 1;
      const off = (Math.random()-0.5) * len * jag;
      next.push(a, { x:(a.x+b.x)/2 - dy/len*off, y:(a.y+b.y)/2 + dx/len*off });
    }
    next.push(pts[pts.length-1]);
    pts = next;
  }
  return pts;
}

function strokePath(ctx, pts, w, alpha){
  ctx.globalAlpha = alpha;
  ctx.lineWidth = w; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.beginPath();
  pts.forEach((p,i) => i ? ctx.lineTo(p.x,p.y) : ctx.moveTo(p.x,p.y));
  ctx.stroke();
}

/* Armanın arkasına siyah zemin: beyaz çizim her temada okunsun */
function drawBacking(ctx, x, y, r, alpha){
  const g = ctx.createRadialGradient(x, y, r*0.2, x, y, r*1.25);
  g.addColorStop(0,   `rgba(0,0,0,${0.82*alpha})`);
  g.addColorStop(0.72,`rgba(0,0,0,${0.68*alpha})`);
  g.addColorStop(1,   'rgba(0,0,0,0)');
  ctx.save(); ctx.globalAlpha = 1; ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, r*1.25, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

/* Gerçek arma (beyaza çevrilmiş) varsa onu, yoksa monogramı çizer */
function drawMark(ctx, code, x, y, r, alpha){
  const art = markCache[code];
  drawBacking(ctx, x, y, r, alpha);

  if (art && art !== 'mono'){
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.shadowColor = 'rgba(255,255,255,.5)';
    ctx.shadowBlur = r * 0.3;
    const d = r * 1.94;
    ctx.drawImage(art, x - d/2, y - d/2, d, d);
    ctx.restore();
    return;
  }

  /* Yedek: halka + monogram, tamamen beyaz çizgi */
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = '#fff';
  ctx.shadowColor = 'rgba(255,255,255,.6)';
  ctx.shadowBlur = r * 0.4;
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';

  ctx.lineWidth = Math.max(1.6, r * 0.055);
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.stroke();
  ctx.lineWidth = Math.max(1, r * 0.03);
  ctx.beginPath(); ctx.arc(x, y, r * 0.85, 0, Math.PI*2); ctx.stroke();

  /* Monogram kutuya sığana kadar küçült (BJK üç harf) */
  const txt = MONO[code] || code;
  let fs = r * 0.74;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let i = 0; i < 8; i++){
    ctx.font = `${fs.toFixed(1)}px Anton, Impact, sans-serif`;
    if (ctx.measureText(txt).width <= r * 1.34) break;
    fs *= 0.9;
  }
  ctx.lineWidth = Math.max(1.2, r * 0.042);
  ctx.strokeText(txt, x, y + r * 0.03);
  ctx.restore();
}

function startBolts(canvas){
  stopBolts();
  if (!canvas || !canvas.getContext) return;
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  BIG4.forEach(prepareMark);                  // armaları önden hazırla

  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, dpr = 1;
  const fit = () => {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = canvas.clientWidth; H = canvas.clientHeight;
    canvas.width = Math.round(W*dpr); canvas.height = Math.round(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
  };
  fit();

  let idx = 0, t0 = performance.now(), shot = null;

  /* Metin sütununun canvas koordinatındaki yeri (her atışta yeniden
     ölçülür: pencere boyu ve paralaks onu oynatabiliyor). */
  const textBox = () => {
    const c = canvas.parentElement && canvas.parentElement.querySelector('.lander-in');
    if (!c) return null;
    const cr = canvas.getBoundingClientRect(), br = c.getBoundingClientRect();
    const pad = 16;
    return { l:br.left - cr.left - pad, r:br.right - cr.left + pad,
             t:br.top  - cr.top  - pad, b:br.bottom - cr.top + pad };
  };
  /* Noktanın dikdörtgene uzaklığı (içerideyse 0) */
  const gap = (b, x, y) =>
    Math.hypot(Math.max(b.l - x, 0, x - b.r), Math.max(b.t - y, 0, y - b.b));

  /* Yeni bir şimşek.
     Çarpma noktası YAZININ DIŞINDA kalmalı: amblem ve çarpma parlaması
     başlığın ya da butonların üstüne binince metin okunmaz oluyordu.
     Rastgele adaylar denenir, yazıya en uzak olan seçilir; yeterince
     uzak bir aday bulununca aramayı sürdürmeye gerek kalmaz. */
  const newShot = () => {
    const rMax = Math.max(46, Math.min(94, Math.min(W,H)*0.115));
    const box  = textBox();
    let ix = W * 0.5, iy = H * 0.7, best = -1;

    /* Aday alanı tüm sahneyi tarar. Geniş ekranda yazının sağı solu
       boştur, dar ekranda ise yalnızca altı — arama ikisini de kendi
       bulur, ayrı bir kırılma noktası tanımlamaya gerek kalmaz. */
    for (let i = 0; i < 24; i++){
      const cx = W * (0.07 + Math.random()*0.86);
      const cy = H * (0.30 + Math.random()*0.66);
      const d  = box ? gap(box, cx, cy) : Infinity;
      if (d > best){ best = d; ix = cx; iy = cy; }
      if (best > rMax * 1.6) break;
    }
    /* Hiçbir aday yazının dışına düşmediyse (dar ekranda olabiliyor)
       çarpmayı yazının hemen altına indir: orası her zaman boştur. */
    if (box && best < 18){
      iy = Math.min(H - 14, box.b + rMax * 0.55);
      ix = W * (0.18 + Math.random()*0.64);
      best = gap(box, ix, iy);
    }
    /* Kalan boşluk amblemden darsa amblem sığdığı kadar küçülür;
       kaybolmaktansa ufak görünsün. */
    const r = box ? Math.max(26, Math.min(rMax, best * 0.85)) : rMax;

    const sx = ix + (Math.random()-0.5) * W * 0.30;
    const main = boltPath(sx, -10, ix, iy, 6, 0.34);
    const forks = [];
    for (let f = 0; f < 2; f++){
      const at = main[Math.floor(main.length * (0.35 + Math.random()*0.4))];
      forks.push(boltPath(at.x, at.y,
        at.x + (Math.random()-0.5)*W*0.22, at.y + H*0.18*Math.random(), 4, 0.4));
    }
    return { ix, iy, main, forks, r };
  };

  const frame = (now) => {
    if (!canvas.isConnected){ stopBolts(); return; }
    if (canvas.clientWidth !== W || canvas.clientHeight !== H) fit();

    let e = now - t0;
    if (e >= BOLT.cycle){ t0 = now; e = 0; idx = (idx+1) % BIG4.length; shot = null; }
    if (!shot) shot = newShot();

    ctx.clearRect(0,0,W,H);

    /* Şimşek: kısa, titrek, saf beyaz */
    if (e < BOLT.flash){
      const a = e < 42 ? 1 : e < 64 ? 0.28 : e < 112 ? 0.95 : 1 - (e-112)/(BOLT.flash-112);
      ctx.save();
      ctx.strokeStyle = '#fff';
      ctx.shadowColor = 'rgba(255,255,255,.85)'; ctx.shadowBlur = 18;
      strokePath(ctx, shot.main, 3.2, a);
      strokePath(ctx, shot.main, 1.2, a);
      shot.forks.forEach(f => strokePath(ctx, f, 1.6, a*0.7));
      /* çarpma parlaması */
      const g = ctx.createRadialGradient(shot.ix, shot.iy, 0, shot.ix, shot.iy, shot.r*1.9);
      g.addColorStop(0, `rgba(255,255,255,${0.5*a})`);
      g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.globalAlpha = 1; ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(shot.ix, shot.iy, shot.r*1.9, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }

    /* Amblem: şimşekle birlikte anında, sonra yumuşak sönüş */
    const a = e < BOLT.hold ? 1
            : e < BOLT.hold + BOLT.fade ? 1 - (e - BOLT.hold)/BOLT.fade : 0;
    if (a > 0) drawMark(ctx, BIG4[idx], shot.ix, shot.iy, shot.r, a);

    boltRAF = requestAnimationFrame(frame);
  };
  boltRAF = requestAnimationFrame(frame);
}

function stopBolts(){
  if (boltRAF) cancelAnimationFrame(boltRAF);
  boltRAF = null;
}

/* Fare hareketiyle ışık + hafif paralaks */
function initPointerFx(root){
  if (window.matchMedia('(hover: none)').matches) return;
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  let raf = null;
  root.addEventListener('pointermove', (e) => {
    if (raf) return;
    raf = requestAnimationFrame(() => {
      raf = null;
      const r = root.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width;
      const y = (e.clientY - r.top)  / r.height;
      root.style.setProperty('--mx', (x * 100).toFixed(1) + '%');
      root.style.setProperty('--my', (y * 100).toFixed(1) + '%');
      root.style.setProperty('--px', ((x - .5) * -14).toFixed(1) + 'px');
      root.style.setProperty('--py', ((y - .5) * -10).toFixed(1) + 'px');
      root.classList.add('lit');
    });
  });
  root.addEventListener('pointerleave', () => {
    root.classList.remove('lit');
    root.style.setProperty('--px', '0px');
    root.style.setProperty('--py', '0px');
  });
}

   Oranı girilmiş GERÇEK maçlar üzerinde çalışır; böylece hem
   oran tablosu hem önem çarpanı maçın kendisinden gelir.
   ============================================================ */
let mid = null, done = false;
let P = { h:2, a:1 }, R = { h:2, a:0 };

/* Oranı girilmiş maçlar — yaklaşanlar önce */
function playable(){
  return FIXTURES.filter(hasOdds).sort((a,b) => {
    const ao = matchState(a) === 'open', bo = matchState(b) === 'open';
    if (ao !== bo) return ao ? -1 : 1;
    return new Date(a.dt) - new Date(b.dt);
  });
}

function currentMatch(){
  const list = playable();
  if (!list.length) return null;
  return list.find(m => m.id === mid) || list[0];
}

function setMatch(id){ mid = id; done = false; render(); }

const TIER_TEXT = {
  10:['Tam isabet','Skoru tam bildin.'],
  8: ['Neredeyse','Kazananı bildin, tek gol saptın.'],
  6: ['Doğru sonuç','Kazananı bildin ama skoru kaçırdın.'],
  2: ['Kıl payı','Tek gol saptın ama sonuç değişti.'],
  0: ['Tutmadı','Ne sonucu ne skoru tutturdun.'],
};

function calc(){
  const g = id => { const v = parseInt(document.getElementById(id).value); return isNaN(v) ? 0 : Math.max(0, Math.min(20, v)); };
  P = { h:g('d-ph'), a:g('d-pa') };
  R = { h:g('d-rh'), a:g('d-ra') };
  done = true;
  render();
  document.getElementById('d-out')?.scrollIntoView({ behavior:'smooth', block:'nearest' });
}

function resultPanel(){
  const m = currentMatch();
  const i = oddsInfo(m.id);
  const s = scorePrediction(P, R, m);
  const [name, why] = TIER_TEXT[s.tier] || TIER_TEXT[0];

  const compMult = m.mult;
  const rr = R.h > R.a ? 'H' : R.h < R.a ? 'A' : 'D';
  /* Çarpanı yuvarlanmış çarpımdan geri bölmek yerine doğrudan hesapla,
     yoksa hesaplayıcıda 10 × 1.94 × 2 = 39 gibi tutarsızlık görünür. */
  const oddsMult = s.tier >= 8 ? scoreMult(m, R.h, R.a)
                 : s.tier === 6 ? outcomeMult(m, rr) : 1;
  const rKey = `${R.h}:${R.a}`;
  const rOdds = i.scores[rKey];
  const outName = { H:'ev sahibi kazanır', D:'beraberlik', A:'deplasman kazanır' }[rr];

  /* Oran çarpanı nereden geldi? */
  const source = s.tier >= 8
    ? `Gerçekleşen skor <b>${R.h}-${R.a}</b>${rOdds ? ` oranı <b>${rOdds.toFixed(2)}</b>` : ' <b>listede yok</b>'}
       — maçın en kısa oranı ${i.min.toFixed(2)}.`
    : s.tier === 6
      ? `Gerçekleşen sonuç <b>${outName}</b>, bahisçiye göre ihtimali
         <b>%${Math.round(i.p[rr] * 100)}</b>.`
      : s.tier === 2 ? 'Bu basamakta oran çarpanı yok — düz 2 puan.'
                     : 'Puan yok.';

  /* Aynı tahminle başka sonuçlar ne getirirdi? */
  const tot = Object.values(i.scores).reduce((x,o) => x + 1/o, 0);
  const alt = Object.keys(i.scores)
    .sort((x,y) => i.scores[x] - i.scores[y]).slice(0, 8)
    .map(k => {
      const [h,a] = k.split(':').map(Number);
      const sc = scorePrediction(P, { h, a }, m);
      const isNow = h === R.h && a === R.a;
      return `<div class="dm-alt ${isNow ? 'now' : ''}">
        <span class="sk">${h}-${a}</span>
        <span class="ih">%${(100/i.scores[k]/tot).toFixed(1)}</span>
        <span class="tb ${ptsClass(sc.tier)}">${sc.tier || 0}</span>
        <span class="pz ${ptsClass(sc.tier)}">${sc.pts}p</span>
      </div>`;
    }).join('');

  return `
    <div class="dm-res ${s.pts ? '' : 'zero'}">
      <div class="big"><b>${s.pts}</b><span>puan</span></div>
      <div class="tier">
        <span class="pbadge pb-${s.tier}">${s.tier}p</span>
        <div><b>${name}</b><em>${why}</em></div>
      </div>
    </div>

    ${s.pts ? `
    <div class="dm-calc">
      <span class="n">${s.tier}</span><span class="op">×</span>
      <span class="n c1">${oddsMult.toFixed(2)}</span><span class="op">×</span>
      <span class="n c2">${compMult}</span><span class="op">=</span>
      <span class="n eq">${s.pts}</span>
    </div>
    <div class="dm-leg">
      <span><i class="k1"></i>temel puan</span>
      <span><i class="k2"></i>oran çarpanı</span>
      <span><i class="k3"></i>önem çarpanı</span>
    </div>` : ''}

    <div class="note" style="margin-top:14px">
      <span>${source}</span>
    </div>

    <div class="dm-h">Aynı tahminle maç başka türlü bitseydi</div>
    <div class="dm-alts">
      <div class="dm-alt hd"><span class="sk">Skor</span><span class="ih">İhtimal</span>
        <span class="tb">Basamak</span><span class="pz">Puan</span></div>
      ${alt}
    </div>`;
}

window.P_sonuc = (function(){
/* ============================================================
   Başlamış bütün maçlar burada listelenir; sonucu girilmemiş
   olanlar en üstte. Sonuç kaydedilir kaydedilmez puanlama
   kendiliğinden işler — ayrıca bir "hesapla" adımı yoktur.
   ============================================================ */
let draft = {};      // matchId -> {h,a}

function started(){
  return FIXTURES.filter(m => matchState(m) !== 'open')
    .sort((a,b) => new Date(b.dt) - new Date(a.dt));   // en yeni önce
}
function val(id, which){
  if (draft[id] && draft[id][which] != null) return draft[id][which];
  const r = Store.results[id];
  return r ? r[which] : '';
}
function onEdit(id, which, v){
  draft[id] = draft[id] || {};
  const n = v.trim() === '' ? null : parseInt(v);
  draft[id][which] = (n == null || isNaN(n)) ? null : Math.max(0, Math.min(20, n));
  const row = document.getElementById('sn-' + id);
  if (row) row.classList.toggle('dirty', isReady(id));
  const btn = document.getElementById('sn-save');
  if (btn){ const n2 = readyList().length;
    btn.textContent = n2 ? `${n2} sonucu kaydet` : 'Kaydedilecek sonuç yok';
    btn.disabled = !n2; }
}
function isReady(id){
  const d = draft[id]; if (!d) return false;
  if (d.h == null || d.a == null) return false;
  const cur = Store.results[id];
  return !cur || cur.h !== d.h || cur.a !== d.a;
}
function readyList(){ return Object.keys(draft).filter(isReady); }

async function saveAll(){
  const list = readyList();
  if (!list.length) return;
  let ok = 0, fail = 0;
  for (const id of list){
    try { await setResult(id, draft[id].h, draft[id].a); ok++; }
    catch(e){ fail++; console.warn('sonuç kaydedilemedi', id, e); }
  }
  draft = {};
  toast(fail ? `<b>${ok} sonuç</b> kaydedildi · ${fail} başarısız`
             : `<b>${ok} sonuç</b> kaydedildi — puanlar güncellendi`);
  render();
}

function row(m){
  const r = Store.results[m.id];
  const H = TEAMS[m.home], A = TEAMS[m.away];
  return `
    <div class="sn-row ${r ? 'done' : 'todo'}" id="sn-${m.id}">
      <span class="st">${r ? '✓' : '●'}</span>
      <span class="nm">
        <b>${H.short || H.name} – ${A.short || A.name}</b>
        <em>${fmtDate(m.dt)} · ${m.comp === 'SL' ? m.wk + '. hafta' : COMPS[m.comp].short}</em>
      </span>
      <span class="in">
        <input class="num" type="number" min="0" max="20" placeholder="–"
               value="${val(m.id,'h')}" oninput="P_sonuc.onEdit('${m.id}','h',this.value)">
        <span class="dash">—</span>
        <input class="num" type="number" min="0" max="20" placeholder="–"
               value="${val(m.id,'a')}" oninput="P_sonuc.onEdit('${m.id}','a',this.value)">
      </span>
    </div>`;
}

function render(){
  const app = document.getElementById('app');
  const head = `<div class="sec-title" style="margin-top:26px"><h3>Maç Sonuçları</h3>
                  <span class="rule"></span></div>`;
  if (!isAdmin()){
    app.innerHTML = head + `<div class="card"><div class="empty">
      Bu sayfa yalnızca yöneticiye açık.</div></div>`;
    return;
  }
  const list = started();
  const eksik = list.filter(m => !Store.results[m.id]);

  app.innerHTML = head + `
    <div class="card reveal">
      <div class="card-pad">
        <div class="note" style="margin-bottom:14px">
          
          <span>Başlamış maçlar burada. Skoru yaz, <b>kaydet</b> — puanlar
          anında hesaplanır, ayrıca bir işlem gerekmez.</span>
        </div>
        ${list.length ? `
          <div class="sn-head">
            ${eksik.length ? `<span class="s-todo"><span class="dot"></span>${eksik.length} maçın sonucu girilmedi</span>`
                           : `<span class="s-ok">✓ Bütün sonuçlar girildi</span>`}
            <span style="color:var(--faint);font-size:11px">${list.length} maç oynandı</span>
          </div>
          <div class="sn-list">${list.map(row).join('')}</div>
          <button class="btn" id="sn-save" disabled style="width:100%;margin-top:14px"
                  onclick="P_sonuc.saveAll()">Kaydedilecek sonuç yok</button>
        ` : `<div class="empty" style="padding:26px">
              Henüz oynanmış maç yok.</div>`}
      </div>
    </div>

    <div style="text-align:center;margin-top:20px">
      <button class="btn ghost" onclick="go('tahminler.html')">← Maçlara dön</button>
    </div>`;
  initReveal();
