    </div>
    <div style="height:3px;background:var(--grad);opacity:.85"></div>
  </div>`;
}

function fullBoard(){
  const rows = leaderboard();
  const maxPts = Math.max(...rows.map(r => r.points), 1);

  return podium(rows) + `
  <div class="card reveal">
    <div class="card-head">
      <span class="ico">🏅</span><h2>Genel Sıralama</h2>
      <span class="tail">${FIXTURES.filter(isFinished).length} maç oynandı</span>
    </div>
    <div class="card-pad">
      ${rows.map(r => `
        <div class="lb-row clickable ${r.you ? 'me' : ''} ${r.rank <= 3 ? 'top' + r.rank : ''}"
             onclick="openProfile('${r.uid}')" role="button" tabindex="0"
             onkeydown="if(event.key==='Enter')openProfile('${r.uid}')"
             title="${r.name} — gelişimini gör">
          <div class="rank">${r.rank === 1 ? '🥇' : r.rank === 2 ? '🥈' : r.rank === 3 ? '🥉' : r.rank}</div>
          <div class="lb-name">
            <div class="n ${r.rank === 1 ? 'shine' : ''}">${r.name}${r.you ? ' (sen)' : ''}</div>
            <div class="s">${r.exact} tam isabet · ⚔️ ${r.derbyPts}p · 🌍 ${r.euroPts}p</div>
            <div style="height:3px;border-radius:3px;margin-top:6px;background:rgba(255,255,255,.06);overflow:hidden">
              <span style="display:block;height:100%;width:${Math.round(r.points / maxPts * 100)}%;
                           background:var(--grad);border-radius:3px"></span>
            </div>
          </div>
          <div class="trend ${r.delta > 0 ? 'up' : r.delta < 0 ? 'down' : 'flat'}">
            ${r.delta > 0 ? '▲' + r.delta : r.delta < 0 ? '▼' + Math.abs(r.delta) : '–'}
          </div>
          <div class="lb-pts">${r.points}</div>
        </div>`).join('')}
      <div style="font-size:11px;color:var(--faint);margin-top:12px;text-align:center">
        ▲ / ▼ son maçtan önceki sıralamaya göre değişimi gösterir
      </div>
    </div>
  </div>`;
}

/* Kimin hangi takımı seçtiği */
function seasonPicksBoard(){
  const rows = leaderboard();
  const block = (kind) => {
    const cfg = SEASON_PICKS[kind];
    /* Yalnızca seçilmiş şıkları göster — 36 takımın çoğu boş kalırdı.
       Çoklu seçimde (küme düşme) her takım ayrı satır olur.        */
    const tally = {};
    rows.forEach(r => {
      const v = r.season?.[kind];
      if (!v || (Array.isArray(v) && !v.length)) return;
      (Array.isArray(v) ? v : [v]).forEach(x => (tally[x] = tally[x] || []).push(r));
    });
    const picked = Object.keys(tally).sort((a,b) => tally[b].length - tally[a].length);
    const voted = rows.filter(r => {
      const v = r.season?.[kind];
      return Array.isArray(v) ? v.length > 0 : !!v;
    }).length;

    return `
    <div class="card reveal">
      <div class="card-head">
        <span class="ico">${cfg.emoji}</span><h2>${cfg.title}</h2>
        <span class="tail">+${cfg.points}p</span>
      </div>
      <div class="card-pad">
        ${picked.length ? picked.map(v => {
          const list = tally[v], t = TEAMS[v];
          const pct = Math.round(list.length / Math.max(1, voted) * 100);
          return `
          <div class="${t ? 't-' + v.toLowerCase() : ''}" style="display:flex;align-items:center;gap:12px;
               padding:10px 0;border-bottom:1px solid rgba(255,255,255,.04)">
            ${t ? crest(v, 32) : `<span class="opt-dot">${v.charAt(0).toLocaleUpperCase('tr')}</span>`}
            <div style="flex:1;min-width:0">
              <div style="font-size:13px;font-weight:600">${t ? t.name : v}</div>
              <div style="font-size:11px;color:var(--faint);white-space:nowrap;overflow:hidden;
                          text-overflow:ellipsis">${list.map(u => u.name).join(', ')}</div>
              <div style="height:3px;border-radius:3px;margin-top:6px;background:rgba(255,255,255,.06);overflow:hidden">
                <span style="display:block;height:100%;width:${pct}%;border-radius:3px;
                             background:${t ? 'linear-gradient(90deg, var(--c1), var(--c2))' : 'var(--grad)'}"></span>
              </div>
            </div>
            <span style="font-family:var(--f-num);font-size:20px;color:var(--dim);min-width:34px;text-align:right">
              %${pct}
            </span>
          </div>`;
        }).join('') : `<div class="empty" style="padding:18px"><span class="em">🤔</span>
            Henüz kimse seçim yapmadı.</div>`}
      </div>
    </div>`;
  };
  return Object.keys(SEASON_PICKS).map(block).join('');
}

function render(){
  document.getElementById('app').innerHTML = `
    <div class="sec-title" style="margin-top:26px"><h3>Ödül</h3><span class="rule"></span></div>
    ${P_tahmin.prizeCard()}

    <div class="sec-title"><h3>Fantazi Ligi Sıralaması</h3><span class="rule"></span></div>
    ${fullBoard()}
    <div class="sec-title"><h3>Sezon Tahminleri — Kim Ne Dedi</h3><span class="rule"></span></div>
    ${seasonPicksBoard()}
  `;
  initReveal(); initTilt(); initCounters();
}
return { podium, fullBoard, seasonPicksBoard, render };
})();

/* ===== gecmis.html ===== */
window.P_gecmis = (function(){
/* ============================================================
   GEÇMİŞ MAÇLAR SAYFASI
   ============================================================ */

let fTeam = 'ALL', fComp = 'ALL', shown = 12;

/* ---------------- Takım karneleri ---------------- */
function recordsBlock(){
  const rows = BIG4.map(c => ({ c, all:teamRecord(c,'ALL'), form:teamForm(c) }))
                   .sort((a,b) => (b.all.w*3 + b.all.d) - (a.all.w*3 + a.all.d));
  return `
  <div class="card reveal">
    <div class="card-head"><span class="ico">📋</span><h2>Takım Karneleri</h2>
      <span class="tail">tüm turnuvalar</span></div>
    <div class="card-pad">
      ${rows.map(({c, all, form}) => {
        const t = TEAMS[c];
        return `
        <div class="rec t-${c.toLowerCase()}">
          ${crest(c, 40)}
          <div class="body">
            <div class="nm">${t.name}</div>
            <div class="ln">${all.played} maç · ${all.w}G ${all.d}B ${all.l}M ·
              ${all.gf}:${all.ga} <span style="color:var(--dim)">(${all.gf - all.ga > 0 ? '+' : ''}${all.gf - all.ga})</span></div>
            <div class="form">${form.map(f => `<i class="${f}">${f}</i>`).join('')}</div>
          </div>
          <div style="text-align:right;flex-shrink:0">
            <div style="font-family:var(--f-num);font-size:24px;letter-spacing:1px">
              ${Math.round(all.w / Math.max(1, all.played) * 100)}<span style="font-size:14px">%</span>
            </div>
            <div style="font-size:9.5px;color:var(--faint);letter-spacing:1px">GALİBİYET</div>
          </div>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

/* ---------------- Derbi tablosu ---------------- */
function derbyStandings(){
  const t = derbyTable();
  const played = FIXTURES.filter(m => m.derby && isFinished(m)).length;
  return `
  <div class="card reveal">
    <div class="card-head"><span class="ico">⚔️</span><h2>Derbi Tablosu</h2>
      <span class="tail">${played} / 12 derbi</span></div>
    <div class="card-pad">
      <div style="display:grid;grid-template-columns:22px 1fr repeat(5,26px) 34px;gap:6px;
                  font-size:9.5px;letter-spacing:1px;color:var(--faint);text-transform:uppercase;
                  padding:0 6px 8px;border-bottom:1px solid var(--line)">
        <span></span><span>Takım</span><span style="text-align:center">O</span>
        <span style="text-align:center">G</span><span style="text-align:center">B</span>
        <span style="text-align:center">M</span><span style="text-align:center">AV</span>
        <span style="text-align:right">P</span>
      </div>
      ${t.map((row, i) => {
        const av = row.gf - row.ga;
        return `
        <div class="t-${row.code.toLowerCase()}" style="display:grid;
             grid-template-columns:22px 1fr repeat(5,26px) 34px;gap:6px;align-items:center;
             padding:9px 6px;border-bottom:1px solid rgba(255,255,255,.035);
             ${i === 0 ? 'background:linear-gradient(90deg, rgba(247,201,90,.09), transparent 70%);border-radius:8px' : ''}">
          <span style="font-family:var(--f-num);font-size:16px;text-align:center;
                       color:${i === 0 ? 'var(--gold)' : 'var(--faint)'}">${i + 1}</span>
          <span style="display:flex;align-items:center;gap:8px;min-width:0">
            ${crest(row.code, 24)}
            <span style="font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;
                         text-overflow:ellipsis">${TEAMS[row.code].name}</span>
          </span>
          <span style="text-align:center;font-size:12px;color:var(--dim)">${row.played}</span>
          <span style="text-align:center;font-size:12px;color:var(--cyan)">${row.w}</span>
          <span style="text-align:center;font-size:12px;color:var(--dim)">${row.d}</span>
          <span style="text-align:center;font-size:12px;color:var(--faint)">${row.l}</span>
          <span style="text-align:center;font-size:12px;color:var(--dim)">${av > 0 ? '+' : ''}${av}</span>
          <span style="text-align:right;font-family:var(--f-num);font-size:19px;
                       color:${i === 0 ? 'var(--gold)' : 'var(--text)'}">${row.pts}</span>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

/* ---------------- Filtreler ---------------- */
function filterBar(){
  const teams = [['ALL','Tüm Takımlar'], ...BIG4.map(c => [c, TEAMS[c].name])];
  const have = new Set(FIXTURES.map(m => m.comp));
  const comps = [['ALL','Hepsi'],['DERBY','⚔️ Derbiler'],['SL','Süper Lig'],
                 ['EU','🌍 Avrupa'],['UCL','Şampiyonlar L.'],['UEL','Avrupa L.'],['UECL','Konferans L.']]
                 .filter(([k]) => ['ALL','DERBY','SL'].includes(k) ||
                        (k === 'EU' ? ['UCL','UEL','UECL'].some(x => have.has(x)) : have.has(k)));
  return `
  <div class="filterbar">
    <div class="row">${teams.map(([k,l]) =>
      `<button class="pill ${fTeam===k?'on':''}" onclick="P_gecmis.setTeam('${k}')">${l}</button>`).join('')}</div>
    <div class="row">${comps.map(([k,l]) =>
      `<button class="pill ${fComp===k?'on':''}" onclick="P_gecmis.setComp('${k}')">${l}</button>`).join('')}</div>
  </div>`;
}
function setTeam(k){ fTeam = k; shown = 12; render(); }
function setComp(k){ fComp = k; shown = 12; render(); }
function showMore(){ shown += 12; render(); }

/* ---------------- Oynanan maç kartı ---------------- */
function historyCard(m){
  const H = TEAMS[m.home], A = TEAMS[m.away], b = badgeOf(m);
  const r = RESULTS[m.id];
  const live = matchState(m) === 'live';
  const hw = !!r && r.h > r.a, aw = !!r && r.a > r.h;
  const feat = isFeatured(m);

  const rows = Store.users.map(u => {
    const p = (u.you ? myPredictions() : predictionsOf(u.uid))?.[m.id];
    if (!p) return null;
    const sc = (live || !r) ? null : scorePrediction(p, r, m);
    return { u, p, pts: sc ? sc.pts : null, tier: sc ? sc.tier : 0 };
  }).filter(Boolean).sort((a,b) => (b.pts ?? -1) - (a.pts ?? -1));

  const best = rows.filter(x => x.pts !== null && x.pts === rows[0]?.pts && x.pts > 0);

  return `
  <article class="hist reveal ${feat ? '' : 'plain'}" style="--hc:${H.c1};--ac:${A.c1}">
    <div class="derby-top">
      <span class="tier ${b.cls}">${b.text}</span>
      <span class="mult ${m.derby ? 'hot' : m.comp !== 'SL' ? 'eu' : ''}">×${b.mult}</span>
      ${m.comp === 'SL' && !m.official ? '<span class="prov">geçici</span>' : ''}
      <span class="state ${live ? 'state-live' : 'state-done'}">
        ${live ? `<span class="pulse-dot"></span>CANLI${r?.minute ? ' ' + r.minute + "'" : ''}` : fmtDateShort(m.dt)}
      </span>
    </div>

    <div class="derby-body">
      <div class="matchup">
        <div class="side">
          <span class="crest-wrap">${crest(m.home, feat ? 40 : 32)}</span>
          <div class="info"><div class="nm ${hw ? 'win' : 'lose'}">${H.name}</div>
            <div class="meta">${m.venue || ''}</div></div>
        </div>
        <div class="center"><div class="score ${live ? 'tint' : ''}">${r ? `${r.h} — ${r.a}` : '– — –'}</div></div>
        <div class="side away">
          <span class="crest-wrap">${crest(m.away, feat ? 40 : 32)}</span>
          <div class="info"><div class="nm ${aw ? 'win' : 'lose'}">${A.name}</div>
            <div class="meta">deplasman</div></div>
        </div>
      </div>

      ${best.length && !live ? `
        <div class="note" style="margin-top:13px">
          <span>🎯</span><span>Maçın kralı: <b>${best.map(x => x.u.name).join(', ')}</b>
          — ${best[0].pts} puan${best[0].p.h === r.h && best[0].p.a === r.a ? ' (tam isabet)' : ''}</span>
        </div>` : ''}

      <button class="reveal-btn" onclick="P_gecmis.togglePicks('${m.id}', this)">
        <span>Tahminler (${rows.length})</span><span class="chev">▾</span>
      </button>
      <div class="picks" id="picks_${m.id}">
        ${rows.map(({u,p,pts,tier}) => `
          <div class="prow ${u.you ? 'me' : ''}">
            <span class="who">${u.name}${u.you ? ' (sen)' : ''}</span>
            <span class="sc">${p.h} — ${p.a}</span>
            ${pts !== null ? `<span class="pt ${ptsClass(tier)}">${pts}p</span>`
                           : `<span class="pt pt-2" style="font-size:11px">bekliyor</span>`}
          </div>`).join('')}
      </div>
    </div>
  </article>`;
}

function togglePicks(id, btn){
  document.getElementById('picks_' + id).classList.toggle('open');
  btn.classList.toggle('open');
}

/* ---------------- Özet ---------------- */
function summary(list){
  const done = list.filter(isFinished);
  const scored = done.filter(m => RESULTS[m.id]);          // sonucu girilmemiş maçlar sayılmaz
  const goals = scored.reduce((s,m) => s + RESULTS[m.id].h + RESULTS[m.id].a, 0);
  const avg = scored.length ? (goals / scored.length).toFixed(1) : '0';
  /* Tarafsız Avrupa eşleşmelerinde (ör. Real – Bayern) dört büyükten
     kimse sahada değil; bu sayım yalnızca büyüklerin maçlarını kapsar. */
  const bigGames = scored.filter(m => m.big.length);
  const bigWins = bigGames.filter(m => {
    const r = RESULTS[m.id];
    const home = m.home === m.big[0];
    return (home ? r.h - r.a : r.a - r.h) > 0;
  }).length;
  return `
  <div class="card reveal">
    <div class="card-pad">
      <div class="stat-row">
        <div class="stat"><b data-count="${done.length}">0</b><span>Oynanan</span></div>
        <div class="stat"><b data-count="${goals}">0</b><span>Toplam Gol</span></div>
        <div class="stat"><b>${avg}</b><span>Maç Başı Gol</span></div>
      </div>
      <div style="text-align:center;font-size:11.5px;color:var(--faint);margin-top:12px">
        ${bigGames.length ? `${bigWins} / ${bigGames.length} maçta büyük takım kazandı` : '—'}
      </div>
    </div>
  </div>`;
}

/* ---------------- Çiz ---------------- */
function render(){
  const all = filterFixtures(playedFixtures(), fTeam, fComp).slice().reverse();
  const list = all.slice(0, shown);

  let cards = '', lastDay = null;
  list.forEach(m => {
    const k = dayKey(m.dt);
    if (k !== lastDay){
      lastDay = k;
      cards += `<div class="daygroup"><span class="d">${fmtDayHeader(m.dt)}</span>
        <span class="rule"></span></div>`;
    }
    cards += historyCard(m);
  });

  document.getElementById('app').innerHTML = `
    <div class="sec-title" style="margin-top:26px"><h3>Sezon Özeti</h3><span class="rule"></span></div>
    ${summary(playedFixtures())}
    ${recordsBlock()}
    ${derbyStandings()}

    <div class="sec-title"><h3>Oynanan Maçlar</h3><span class="rule"></span></div>
    ${filterBar()}
    ${all.length ? cards : `<div class="card"><div class="empty"><span class="em">🗓</span>
        Bu filtreye uyan oynanmış maç yok.</div></div>`}
    ${all.length > shown ? `<button class="btn ghost" onclick="P_gecmis.showMore()"
        style="width:100%;margin-top:6px">${all.length - shown} maç daha göster ▾</button>` : ''}
  `;
  initReveal(); initTilt(); initCounters();
}
return { recordsBlock, derbyStandings, filterBar, setTeam, setComp, showMore, historyCard, togglePicks, summary, render };
})();

/* ===== Tek dosya yönlendirici ===== */
const ROUTES = {
  'index.html':         P_ana.render,      // tam ekran açılış
  'tahminler.html':     P_tahmin.render,
  'puan-tablosu.html':  P_puan.render,
  'gecmis.html':        P_gecmis.render,
  'nasil-oynanir.html': P_nasil.render,
  'hesaplayici.html':          P_hesap.render,      // puan hesaplayıcı
  'oranlar.html':       P_oranlar.render,   // yönetici — navigasyonda yok
  'logolar.html':       P_logolar.render,   // yönetici — navigasyonda yok
};
const HOME = 'index.html';
let CURRENT = HOME;

/* Açılış sayfası tam genişlik; diğerleri 860px kolonda kalır */
function setActive(href){
  document.querySelector('.wrap')?.classList.toggle('wrap-full', href === HOME);
  document.querySelectorAll('.nav-links a').forEach(a =>
    a.classList.toggle('on', a.dataset.href === href));
}

function go(href){
  if (!ROUTES[href]) return;
  CURRENT = href;
  setActive(href);
  ROUTES[href]();
  window.scrollTo({ top:0, behavior: href === HOME ? 'auto' : 'smooth' });
}

/* auth-ui açık sayfayı yeniden çizmek için global render() bekler */
window.render = () => { setActive(CURRENT); ROUTES[CURRENT](); };
boot(HOME, window.render);

</script>
