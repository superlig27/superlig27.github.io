/* ===== oranlar.html — TOPLU ORAN GİRİŞİ (yönetici) ===== */
window.P_oranlar = (function(){
/* ============================================================
   Birden çok maçın oran tablosunu tek seferde alır.
   Yapıştırdığın metindeki TAKIM ADI başlıkları maçı kendisi bulur;
   maç seçmen gerekmez. Sıra "ev sahibi … deplasman" varsayılır,
   böylece ilk/ikinci devre maçı da doğru eşleşir.
   ============================================================ */

const TR_MAP = { 'ç':'c','ğ':'g','ı':'i','ö':'o','ş':'s','ü':'u','â':'a','î':'i','û':'u' };
const norm = s => (s || '').toLocaleLowerCase('tr')
  .replace(/[çğıöşüâîû]/g, c => TR_MAP[c] || c)
  .replace(/[^a-z0-9]+/g, ' ')
  .trim();

let needles = null;
function teamNeedles(){
  if (needles) return needles;
  const out = [];
  Object.keys(TEAMS).forEach(code => {
    [TEAMS[code].name, TEAMS[code].short].filter(Boolean).forEach(n => {
      const v = norm(n);
      if (v.length >= 3) out.push({ code, n: v });
    });
  });
  return needles = out.sort((a, b) => b.n.length - a.n.length);
}

/* Satırdaki takımları GÖRÜLDÜKLERİ SIRAYLA döndürür */
function teamsInLine(line){
  const hay = ' ' + norm(line) + ' ';
  const hits = [];
  teamNeedles().forEach(({ code, n }) => {
    if (hits.some(h => h.code === code)) return;
    const at = hay.indexOf(' ' + n + ' ');
    if (at !== -1) hits.push({ code, at });
  });
  return hits.sort((a, b) => a.at - b.at).map(h => h.code);
}

/* Verilen takımlara uyan, tahmine açılabilir en yakın maç */
function fixtureFor(codes){
  const cand = FIXTURES.filter(m => matchState(m) === 'open' &&
    codes.includes(m.home) && codes.includes(m.away));
  if (!cand.length) return null;
  /* Ev sahibi sırası tutan varsa onu seç (ilk/ikinci devre ayrımı) */
  const exact = cand.filter(m => codes.indexOf(m.home) < codes.indexOf(m.away));
  return (exact[0] || cand[0]);
}

/* Metni maç bloklarına böler ve her bloğun oranlarını okur */
function parseBulk(text){
  const lines = text.split(/\r?\n/);
  const blocks = [];
  let cur = null, pending = [];

  lines.forEach(line => {
    const hasScore = /\d{1,2}\s*[:\-–]\s*\d{1,2}/.test(line) && /\d[.,]\d/.test(line);
    const codes = hasScore ? [] : teamsInLine(line);

    if (codes.length){
      pending = [...pending, ...codes].slice(-4);
      const fx = fixtureFor(pending);
      if (fx && (!cur || cur.fx.id !== fx.id)){
        cur = { fx, lines: [] };
        blocks.push(cur);
        pending = [];
      }
      return;
    }
    if (cur) cur.lines.push(line);
  });

  return blocks
    .map(b => ({ fx: b.fx, scores: parseOddsText(b.lines.join('\n')) }))
    .filter(b => Object.keys(b.scores).length);
}

let found = [];

function analyse(){
  found = parseBulk(document.getElementById('bulk-in').value);
  document.getElementById('bulk-out').innerHTML = resultHtml();
}

const MIN_SCORES = 12;   // bunun altı büyük ihtimalle yarım kopyalanmış

function resultHtml(){
  const openNoOdds = FIXTURES.filter(m => matchState(m) === 'open' && !hasOdds(m));

  if (!found.length){
    return `<div class="empty" style="padding:22px">
      Henüz maç çözümlenmedi.<br>
      <span style="font-size:11px;color:var(--faint)">Tabloyu <b>takım adı başlığıyla birlikte</b>
      kopyaladığından emin ol — maçı o başlıktan tanıyor.</span></div>
      ${missingHtml(openNoOdds)}`;
  }

  const rows = found.map((b, idx) => {
    const n = Object.keys(b.scores).length;
    const min = Math.min(...Object.values(b.scores));
    const fav = Object.keys(b.scores).find(k => b.scores[k] === min);
    const thin = n < MIN_SCORES;
    return `
      <div class="bulk-row">
        <span class="ok ${thin ? 'warn' : ''}">${thin ? '!' : '✓'}</span>
        <span class="nm">
          <b>${TEAMS[b.fx.home].name} – ${TEAMS[b.fx.away].name}</b>
          <em>${fmtDateShort(b.fx.dt)} · ${b.fx.comp === 'SL' ? b.fx.wk + '. hafta' : COMPS[b.fx.comp].short}</em>
        </span>
        <span class="ct ${thin ? 'warn' : ''}">${n} skor</span>
        <span class="fav">favori ${fav.replace(':','-')} · ${min.toFixed(2)}</span>
        <button class="linkbtn" style="margin:0" onclick="P_oranlar.drop(${idx})">çıkar</button>
      </div>
      ${thin ? `<div class="bulk-warn">Bu tablo eksik görünüyor (${n} skor).
        Eksik skorlar en yüksek çarpanı alır — tabloyu tam kopyaladığından emin ol.</div>` : ''}`;
  }).join('');

  const stillMissing = openNoOdds.filter(m => !found.some(b => b.fx.id === m.id));

  return `
    <div style="font-size:12px;color:var(--dim);margin:14px 0 8px">
      <b style="color:var(--cyan)">${found.length} maç</b> tanındı
    </div>
    <div class="bulk-list">${rows}</div>
    <button class="btn" style="width:100%;margin-top:14px"
            onclick="P_oranlar.saveAll()">${found.length} maçın oranlarını kaydet ve aç</button>
    ${missingHtml(stillMissing)}`;
}

function missingHtml(list){
  if (!list.length) return '';
  return `
    <div class="note" style="margin-top:16px">
      
      <span><b>Hâlâ oransız ${list.length} maç:</b><br>
      <span style="color:var(--faint);font-size:11px">
        ${list.slice(0, 12).map(m => `${TEAMS[m.home].short || TEAMS[m.home].name}–${TEAMS[m.away].short || TEAMS[m.away].name}
          <span style="opacity:.6">(${fmtDateShort(m.dt)})</span>`).join(' · ')}
        ${list.length > 12 ? ` … +${list.length - 12}` : ''}
      </span></span>
    </div>`;
}

function drop(i){ found.splice(i, 1); document.getElementById('bulk-out').innerHTML = resultHtml(); }

async function saveAll(){
  if (!found.length) return;
  let ok = 0, fail = 0;
  for (const b of found){
    try { await setOdds(b.fx.id, b.scores); ok++; }
    catch(e){ fail++; console.warn('oran kaydedilemedi', b.fx.id, e); }
  }
  toast(fail ? `<b>${ok} maç</b> kaydedildi · ${fail} başarısız`
             : `<b>${ok} maç</b> tahmine açıldı`);
  found = [];
  document.getElementById('bulk-in').value = '';
  render();
}

function render(){
  if (!isAdmin()){
    document.getElementById('app').innerHTML = `
      <div class="sec-title" style="margin-top:26px"><h3>Toplu Oran Girişi</h3><span class="rule"></span></div>
      <div class="card"><div class="empty">
        Bu sayfa yalnızca yöneticiye açık.</div></div>`;
    return;
  }
  document.getElementById('app').innerHTML = `
    <div class="sec-title" style="margin-top:26px"><h3>Toplu Oran Girişi</h3><span class="rule"></span></div>
    <div class="card">
      <div class="card-pad">
        <div class="note" style="margin-bottom:14px">
          
          <span>Bahis sitesinde her maçın <b>doğru skor</b> tablosunu
          <b>takım adı başlığıyla birlikte</b> seçip kopyala ve arka arkaya buraya yapıştır.
          Maçları başlıktaki takım adlarından kendisi tanır — tek tek seçmen gerekmez.</span>
        </div>
        <textarea id="bulk-in" class="odds-ta" style="min-height:200px"
          placeholder="Galatasaray      Berabere      Çorum FK&#10;1:0   7.00      0:0   15.00     0:1   26.00&#10;2:0   6.00      1:1   11.00     0:2   61.00&#10;…&#10;&#10;Fenerbahçe       Berabere      Konyaspor&#10;1:0   5.50      0:0   12.00     0:1   21.00&#10;…"
          oninput="P_oranlar.analyse()"></textarea>
        <div id="bulk-out">${resultHtml()}</div>
      </div>
    </div>`;
  initReveal();
}

return { render, analyse, drop, saveAll };
})();

  isabet: { ad:'Tam isabet',  fn:(a,b) => b.exact - a.exact || b.points - a.points },
  /* "Form" artık tek anlama geliyor: puan serisi. Eskiden bu sıralama
     sıra değişimine (delta) bakıyordu; adı aynı, ölçütü başkaydı. */
  form:   { ad:'Form',        fn:(a,b) => b.streak - a.streak || b.points - a.points },
};
/* Kayıtlı seçim listeden kaldırılmış bir ölçüt olabilir (İsim gibi);
   o zaman sessizce puana dön, boş tablo çizmektense. */
let lbSort = 'puan', lbQuery = '';

const adSade = s => (s || '').toLocaleLowerCase('tr')

function setLbSort(k){ lbSort = LB_SORTS[k] ? k : 'puan'; render(); }
function onLbSearch(v){

      </div>

        ▲ / ▼ ${canli.length ? 'süren maç öncesindeki' : 'son maçtan önceki'} sıralamaya göre değişimi gösterir
      </div>
    </div>
  </div>`;
}

/* Kimin hangi takımı seçtiği */
function seasonPicksBoard(){
  const rows = leaderboard();
  const block = (kind) => {
    const cfg = SEASON_PICKS[kind];
    /* Yalnızca seçilmiş şıkları göster — 36 takımın çoğu boş kalırdı.
       Çoklu seçimde (küme düşme) her takım ayrı satır olur.        */
    const tally = {};
    rows.forEach(r => {
      const v = r.season?.[kind];
      if (!v || (Array.isArray(v) && !v.length)) return;
      (Array.isArray(v) ? v : [v]).forEach(x => (tally[x] = tally[x] || []).push(r));
    });
    const picked = Object.keys(tally).sort((a,b) => tally[b].length - tally[a].length);
    const voted = rows.filter(r => {
      const v = r.season?.[kind];
      return Array.isArray(v) ? v.length > 0 : !!v;
    }).length;

    /* Kilit açılana kadar kimin ne seçtiği gizli — yalnızca kaç kişinin
       seçim yaptığı görünür. Yoksa geç seçen, erken seçeni kopyalar.
       Yönetici, kendi seçimini yaptıysa erken görebilir. */
    if (!canSeeSeason(kind)){
      /* Yeni üye için genel kilit çoktan geçti; ona "şu kadar sonra
         açılacak" demek anlamsız olurdu. Kendi hakkı bitince liste
         zaten açılacağı için geri sayım o hakka göre yazılır. */
      const hak   = graceKalan();
      const kalan = timeLeftShort(hak || (new Date(cfg.lock) - NOW()));
      return `
      <div class="card reveal">
        ${seasonFoto(cfg)}
        <div class="card-head">
          ${seasonMark(cfg, 22)}<h2>${cfg.title}</h2>
          <span class="tail">${seasonPointsLabel(kind)}</span>
        </div>
        <div class="card-pad">
          <div class="locked-box">
            
            <div>
              <b>Seçimler gizli</b>
              <em>${voted}/${rows.length} oyuncu seçimini yaptı ·
                  <b style="color:var(--cyan)">${kalan}</b> sonra ${
                    hak ? 'sana da açılacak' : 'herkese açılacak'}</em>
              <em class="sub">${hak ? 'Kendi seçimini yapana kadar kimseninkini göremezsin'
                                    : fmtDate(cfg.lock)}</em>
            </div>
          </div>
          ${isAdmin() ? `<div class="peek-note lone">Yönetici olarak erken
            görebilirsin — <b>önce kendi seçimini yap</b>.</div>` : ''}
        </div>
      </div>`;
    }

    /* Kilit açılmadan görünüyorsa bu sadece yöneticiye açık bir görünüm */
    const erken = !seasonLocked(kind);

    return `
    <div class="card reveal">
      ${seasonFoto(cfg)}
      <div class="card-head">
        ${seasonMark(cfg, 22)}<h2>${cfg.title}</h2>
        <span class="tail">${seasonPointsLabel(kind)}</span>
      </div>
      <div class="card-pad">
        ${erken ? `<div class="peek-note">Kilit açılmadı — bu liste
          <b>yalnızca sana</b> görünür. Herkese açılma: ${fmtDate(cfg.lock)}</div>` : ''}
        ${picked.length ? picked.map(v => {
          /* Şampiyonlar Ligi şıkları uzun adla tutulur ('Real Madrid');
             koda çevirince arma çizilebiliyor. Çeviremezsek baş harf.
             Yazı, şıkkın kendi adı olarak kalır: kod verilmişse TEAMS
             adı, uzun ad verilmişse aynen o — böylece burada yazan isim
             tahmin sayfasındakiyle aynı kalır. */
          const code = teamCodeOf(v), t = TEAMS[code];
          const label = TEAMS[v] ? TEAMS[v].name : v;
          const list = tally[v];
          const pct = Math.round(list.length / Math.max(1, voted) * 100);
          return `
          <div class="${t ? 't-' + code.toLowerCase() : ''}" style="display:flex;align-items:center;gap:12px;
               padding:10px 0;border-bottom:1px solid rgba(255,255,255,.04)">
            ${t ? crest(code, 32) : `<span class="opt-dot">${v.charAt(0).toLocaleUpperCase('tr')}</span>`}
            <div style="flex:1;min-width:0">
              <div style="font-size:13px;font-weight:600">${label}</div>
              <div style="font-size:11px;color:var(--faint);white-space:nowrap;overflow:hidden;
                          text-overflow:ellipsis">${list.map(u => u.name).join(', ')}</div>
              <div style="height:3px;border-radius:3px;margin-top:6px;background:rgba(255,255,255,.06);overflow:hidden">
                <span style="display:block;height:100%;width:${pct}%;border-radius:3px;
                             background:${t ? 'linear-gradient(90deg, var(--c1), var(--c2))' : 'var(--grad)'}"></span>
              </div>
            </div>
            <span style="font-family:var(--f-num);font-size:20px;color:var(--dim);min-width:34px;text-align:right">
              %${pct}
            </span>
          </div>`;
        }).join('') : `<div class="empty" style="padding:22px">
            <span class="em">🗳️</span>
            <span class="ttl">Sandık boş</span>
            <span class="hint">Bu bahiste henüz kimse seçim yapmadı.</span></div>`}
      </div>
    </div>`;
  };
  return Object.keys(SEASON_PICKS).map(block).join('');
}

function render(){
  document.getElementById('app').innerHTML = `
    <div class="sec-title" style="margin-top:26px"><h3>Ödül</h3><span class="rule"></span></div>
    ${P_tahmin.prizeCard()}

    <!-- Bölüm başlığı yok: sıralamanın adını artık görsel şerit taşıyor
         (bkz. banner('board', …, 'Fantazi Ligi Sıralaması')). İkisi

}
return { podium, fullBoard, seasonPicksBoard, setLbSort, onLbSearch, render };
})();

function filterBar(){

function setTeam(k){ fTeam = k; shown = 12; render(); }
function setComp(k){ fComp = k; shown = 12; render(); }

/* ---------------- Oynanan maç kartı ---------------- */
function historyCard(m){
  const H = TEAMS[m.home], A = TEAMS[m.away], b = badgeOf(m);
  const r = RESULTS[m.id];
  const live = matchState(m) === 'live';
  const hw = !!r && r.h > r.a, aw = !!r && r.a > r.h;
  const feat = isFeatured(m);

  const rows = Store.users.map(u => {
    const p = (u.you ? myPredictions() : predictionsOf(u.uid))?.[m.id];
    if (!p) return null;
    const sc = (live || !r) ? null : scorePrediction(p, r, m);
    return { u, p, pts: sc ? sc.pts : null, tier: sc ? sc.tier : 0 };
  }).filter(Boolean).sort((a,b) => (b.pts ?? -1) - (a.pts ?? -1));

  const best = rows.filter(x => x.pts !== null && x.pts === rows[0]?.pts && x.pts > 0);

  return `
  <article class="hist reveal ${feat ? '' : 'plain'}" style="--hc:${H.c1};--ac:${A.c1}">
    <div class="derby-top">
      <span class="tier ${b.cls}">${compMark(m.comp)}${b.text}</span>
      <span class="mult ${m.derby ? 'hot' : m.comp !== 'SL' ? 'eu' : ''}">×${b.mult}</span>

          <span class="crest-wrap">${crest(m.home, feat ? 40 : 32)}</span>
          <div class="info"><div class="nm ${hw ? 'win' : 'lose'}">${H.name}</div>
            <div class="meta">${m.venue || ''}</div></div>
        </div>
        <div class="center"><div class="score ${live ? 'tint' : ''}">${r ? `${r.h} — ${r.a}` : '– — –'}</div></div>
        <div class="side away">
          <span class="crest-wrap">${crest(m.away, feat ? 40 : 32)}</span>
          <div class="info"><div class="nm ${aw ? 'win' : 'lose'}">${A.name}</div>
            <div class="meta">deplasman</div></div>
        </div>
      </div>

      ${best.length && !live ? `
        <div class="note" style="margin-top:13px">
          <span>Maçın kralı: <b>${best.map(x => x.u.name).join(', ')}</b>
          — ${best[0].pts} puan${best[0].p.h === r.h && best[0].p.a === r.a ? ' (tam isabet)' : ''}</span>
        </div>` : ''}

      <button class="reveal-btn" onclick="P_gecmis.togglePicks('${m.id}', this)">
        <span>Tahminler (${rows.length})</span><span class="chev">▾</span>
      </button>
      <div class="picks" id="picks_${m.id}">
        ${rows.map(({u,p,pts,tier}) => `
          <div class="prow ${u.you ? 'me' : ''}">
            <span class="who">${u.ai ? u.emoji + ' ' : ''}${u.name}${u.you ? ' (sen)' : ''}</span>
            <span class="sc">${p.h} — ${p.a}</span>
            ${pts !== null ? `<span class="pt ${ptsClass(tier)}">${pts}p</span>`
                           : `<span class="pt pt-2" style="font-size:11px">bekliyor</span>`}
          </div>`).join('')}
      </div>
    </div>

}

function togglePicks(id, btn){

  btn.classList.toggle('open');
}

/* ---------------- Özet ---------------- */
function summary(list){
  const done = list.filter(isFinished);
  const scored = done.filter(m => RESULTS[m.id]);          // sonucu girilmemiş maçlar sayılmaz
  const goals = scored.reduce((s,m) => s + RESULTS[m.id].h + RESULTS[m.id].a, 0);
  const avg = scored.length ? (goals / scored.length).toFixed(1) : '0';
  /* Tarafsız Avrupa eşleşmelerinde (ör. Real – Bayern) dört büyükten
     kimse sahada değil; bu sayım yalnızca büyüklerin maçlarını kapsar. */
  const bigGames = scored.filter(m => m.big.length);
  const bigWins = bigGames.filter(m => {
    const r = RESULTS[m.id];
    const home = m.home === m.big[0];
    return (home ? r.h - r.a : r.a - r.h) > 0;
  }).length;
  return `
  <div class="card reveal">
    <div class="card-pad">
      <div class="stat-row">
        <div class="stat"><b data-count="${done.length}">0</b><span>Oynanan</span></div>
        <div class="stat"><b data-count="${goals}">0</b><span>Toplam Gol</span></div>

      </div>
      <div style="text-align:center;font-size:11.5px;color:var(--faint);margin-top:12px">
        ${bigGames.length ? `${bigWins} / ${bigGames.length} maçta büyük takım kazandı` : '—'}
      </div>
    </div>
  </div>`;
}

return { recordsBlock, derbyStandings, filterBar, setTeam, setComp, showMore, historyCard, togglePicks, summary, render };

/* ============================================================
   KULLANIM KOLAYLIKLARI
   Esc ile kapatma, klavye kısayolları, başa dön düğmesi.
   Hepsi tek yerde durur ki hangi tuşun ne yaptığı tek bakışta
   görülsün — kısayol eklemek KEYS listesine satır yazmaktır.
   ============================================================ */

/* Açık olan pencereyi kapat. Sıra önemli: en son açılan en üsttedir,
   Esc önce onu kapatmalı (oran penceresi profilin üstüne açılabiliyor). */
const MODALS = [
  { id:'oddsModal',    kapat:() => closeOdds() },
  { id:'oddsView',     kapat:() => closeOddsView() },
  { id:'profileModal', kapat:() => closeProfile() },
  { id:'authModal',    kapat:() => closeAuth() },
  { id:'keysModal',    kapat:() => closeKeys() },
];
function acikPencere(){
  /* DOM sırası değil, z-sırası: sonradan eklenen düğüm daha üsttedir */
  const acik = MODALS.map(m => ({ ...m, el: document.getElementById(m.id) }))
                     .filter(m => m.el);
  if (!acik.length) return null;
  return acik.reduce((a, b) =>
    (a.el.compareDocumentPosition(b.el) & Node.DOCUMENT_POSITION_FOLLOWING) ? b : a);
}
function kapatUstteki(){
  const m = acikPencere();
  if (!m) return false;
  m.kapat();
  return true;
}

/* ---------- Klavye kısayolları penceresi ---------- */
function openKeys(){
  let el = document.getElementById('keysModal');
  if (!el){
    el = document.createElement('div');
    el.id = 'keysModal'; el.className = 'modal';
    el.addEventListener('click', e => { if (e.target === el) closeKeys(); });
    document.body.appendChild(el);
  }
  el.innerHTML = `<div class="modal-card">
    <button class="modal-x" onclick="closeKeys()" aria-label="Kapat">✕</button>
    <div class="modal-head">
      <span class="brand-mark" style="font-size:15px">⌨</span>
      <div>
        <div class="modal-title">Klavye Kısayolları</div>
        <div class="modal-sub">Fareye uzanmadan gez</div>
      </div>
    </div>
    <div class="modal-body">
      <div class="keys">
        ${KEYS.map(k => `<div class="keyrow">
          <kbd>${k.tus}</kbd><span class="d">${k.ne}</span></div>`).join('')}
      </div>
    </div>
  </div>`;
  requestAnimationFrame(() => el.classList.add('show'));
}
function closeKeys(){
  const el = document.getElementById('keysModal');
  if (!el) return;
  el.classList.remove('show');
  setTimeout(() => el.remove(), 260);
}

/* Kısayol çizelgesi. `git` alanı olanlar sayfa değiştirir. */
const KEYS = [
  { tus:'1', ne:'Tahminler',       git:'tahminler.html' },
  { tus:'2', ne:'Puan Tablosu',    git:'puan-tablosu.html' },
  { tus:'3', ne:'Geçmiş Maçlar',   git:'gecmis.html' },
  { tus:'4', ne:'Nasıl Oynanır',   git:'nasil-oynanir.html' },
  { tus:'0', ne:'Ana sayfa',       git:'index.html' },
  { tus:'/', ne:'Puan tablosunda oyuncu ara' },
  { tus:'T', ne:'Tema değiştirici' },
  { tus:'?', ne:'Bu pencere' },
  { tus:'Esc', ne:'Açık pencereyi kapat' },
];

function initShortcuts(){
  document.addEventListener('keydown', (e) => {
    /* Esc her yerde çalışır — yazı yazarken bile pencereyi kapatmalı */
    if (e.key === 'Escape'){ if (kapatUstteki()) e.preventDefault(); return; }

    /* Kutuya yazı yazılıyorsa harf kısayolları susar, yoksa
       skor kutusuna "1" yazan kişi Tahminler'e ışınlanırdı. */
    const yaziliyor = e.target instanceof Element &&
      (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable);
    if (yaziliyor || e.ctrlKey || e.metaKey || e.altKey) return;

    if (e.key === '?'){ openKeys(); e.preventDefault(); return; }
    if (e.key === '/'){
      const ara = document.getElementById('lbSearch');
      if (ara){ ara.focus(); ara.select(); e.preventDefault(); }
      return;
    }
    if (e.key === 't' || e.key === 'T'){
      document.getElementById('themeDock')?.classList.toggle('open');
      e.preventDefault(); return;
    }
    const k = KEYS.find(x => x.tus === e.key && x.git);
    if (k){ go(k.git); e.preventDefault(); }
  });
}

/* ---------- Dokunmatikte ipucu balonu ----------
   Telefonda :hover yok ve title= hiç görünmez; rozetler bu yüzden
   anlamı okunamayan renkli noktalara dönüşüyordu. Burada balon
   PARMAKLA açılıyor.

   Olay YAKALAMA evresinde dinleniyor ve durduruluyor: rozet, tıklanınca
   profili açan satırın içinde duruyor. Durdurmazsak rozete dokunmak
   profili açar ve balon hiç görünmez.                                */
function initTapTips(){
  document.addEventListener('click', (e) => {
    /* Fare kontrolü BURADA yapılır, dinleyici kurulurken değil:
       kurulum anında bakarsak, sayfa masaüstünde açılıp sonra
       dokunmatiğe geçen bir cihazda (ya da geliştirici araçlarında)
       özellik ölü kalır. Faresi olanda zaten :hover çalışıyor. */
    if (!matchMedia('(hover: none)').matches) return;
    const t = e.target.closest?.('.tip[data-tip]');
    /* Başka bir yere dokunulduysa açık balonları kapat */
    document.querySelectorAll('.tip.acik').forEach(x => { if (x !== t) x.classList.remove('acik'); });
    if (!t) return;
    e.preventDefault();
    e.stopPropagation();                              // satırın tıklaması çalışmasın
    t.classList.toggle('acik');
  }, true);
}

/* ---------- Başa dön ---------- */
function initToTop(){
  const b = document.createElement('button');
  b.className = 'to-top'; b.type = 'button';
  b.setAttribute('aria-label', 'Başa dön');
  b.innerHTML = '↑';
  b.onclick = () => window.scrollTo({ top:0, behavior:'smooth' });
  document.body.appendChild(b);

  let raf = null;
  const bak = () => {
    if (raf) return;
    raf = requestAnimationFrame(() => {
      raf = null;
      b.classList.toggle('on', window.scrollY > 620);
    });
  };
  window.addEventListener('scroll', bak, { passive:true });
  bak();
}

/* ===== Tek dosya yönlendirici ===== */
const ROUTES = {
  'index.html':         P_ana.render,      // tam ekran açılış
  'tahminler.html':     P_tahmin.render,
  'puan-tablosu.html':  P_puan.render,
  'gecmis.html':        P_gecmis.render,
  'nasil-oynanir.html': P_nasil.render,
  'hesaplayici.html':          P_hesap.render,      // puan hesaplayıcı
  'oranlar.html':       P_oranlar.render,   // yönetici — navigasyonda yok
  'logolar.html':       P_logolar.render,   // yönetici — navigasyonda yok
  'sonuclar.html':      P_sonuc.render,     // yönetici — navigasyonda yok
};
const HOME = 'index.html';
let CURRENT = HOME;

/* Açılış sayfası tam genişlik; diğerleri 860px kolonda kalır */
function setActive(href){
  document.querySelector('.wrap')?.classList.toggle('wrap-full', href === HOME);
  document.querySelectorAll('.nav-links a').forEach(a =>
    a.classList.toggle('on', a.dataset.href === href));
}

function go(href){
  if (!ROUTES[href]) return;
  CURRENT = href;
  setActive(href);
  ROUTES[href]();
  window.scrollTo({ top:0, behavior: href === HOME ? 'auto' : 'smooth' });
}

/* auth-ui açık sayfayı yeniden çizmek için global render() bekler */
window.render = () => { setActive(CURRENT); ROUTES[CURRENT](); };
initShortcuts();
initToTop();
initTapTips();
boot(HOME, window.render);

</script>
